<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA Settings & iOS Integration -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LinguaCards" />

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }

  <!-- React & Babel Core -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase & QR Code Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      background-color: #090d16;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    .safe-top { padding-top: max(12px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .card-flip { perspective: 1000px; }
    .card-inner {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Config & Default Key Setup
    const DEFAULT_API_KEY = "AQ.Ab8RN6ISBSPyMyTiUgv4LC9ZFNYBQu82KgCPHX2w6gH9KSKpow";
    
    // Default Situational & Level Collections (50+ words base)
    const BASE_COLLECTIONS = [
      {
        id: 'travel',
        title: '✈️ Путешествия & Аэропорт',
        description: 'Слова для перелетов, отелей, таможни и ориентирования в городе',
        levels: {
          beginner: [
            { id: 't1', english: 'Passport', russian: 'Паспорт', phonetic: 'ˈpæspɔːrt', example: 'Show your passport at check-in.' },
            { id: 't2', english: 'Luggage', russian: 'Багаж', phonetic: 'ˈlʌɡɪdʒ', example: 'I lost my luggage at the airport.' },
            { id: 't3', english: 'Boarding pass', russian: 'Посадочный талон', phonetic: 'ˈbɔːrdɪŋ pæs', example: 'Keep your boarding pass ready.' },
            { id: 't4', english: 'Ticket', russian: 'Билет', phonetic: 'ˈtɪkɪt', example: 'I booked a round-trip ticket.' },
            { id: 't5', english: 'Gate', russian: 'Выход на посадку', phonetic: 'ɡeɪt', example: 'Gate 5 is closing soon.' },
            { id: 't6', english: 'Hotel', russian: 'Отель', phonetic: 'hoʊˈtel', example: 'We checked into our hotel early.' },
            { id: 't7', english: 'Flight', russian: 'Рейс', phonetic: 'flaɪt', example: 'Our flight is delayed by two hours.' },
            { id: 't8', english: 'Customs', russian: 'Таможня', phonetic: 'ˈkʌstəmz', example: 'We passed through airport customs.' },
            { id: 't9', english: 'Taxi', russian: 'Такси', phonetic: 'ˈtæksi', example: 'Let us order a taxi to town.' },
            { id: 't10', english: 'Map', russian: 'Карта', phonetic: 'mæp', example: 'I need a city map for tourists.' }
          ],
          intermediate: [
            { id: 't11', english: 'Accommodation', russian: 'Жилье / Проживание', phonetic: 'əˌkɑːməˈdeɪʃn', example: 'We found affordable accommodation near downtown.' },
            { id: 't12', english: 'Itinerary', russian: 'Маршрут путешествия', phonetic: 'aɪˈtɪnəreri', example: 'Our itinerary includes three main cities.' },
            { id: 't13', english: 'Destination', russian: 'Пункт назначения', phonetic: 'ˌdestɪˈneɪʃn', example: 'We reached our destination safely.' },
            { id: 't14', english: 'Reservation', russian: 'Бронирование', phonetic: 'ˌrezərˈveɪʃn', example: 'I have a hotel reservation under my name.' },
            { id: 't15', english: 'Departure', russian: 'Отправление / Вылет', phonetic: 'dɪˈpɑːrtʃər', example: 'Check the flight departure board.' }
          ],
          advanced: [
            { id: 't16', english: 'Layover', russian: 'Пересадка между рейсами', phonetic: 'ˈleɪoʊvər', example: 'We had an eight-hour layover in Istanbul.' },
            { id: 't17', english: 'Embarkation', russian: 'Посадка на борт', phonetic: 'ˌembɑːrˈkeɪʃn', example: 'Prepare documents for embarkation.' },
            { id: 't18', english: 'Excursion', russian: 'Экскурсия', phonetic: 'ɪkˈskɜːrʒn', example: 'They took a day excursion into the mountains.' }
          ]
        }
      },
      {
        id: 'dining',
        title: '🍕 Рестораны & Еда',
        description: 'Лексика для заказа блюд, кафе, ингредиентов и оплаты счетов',
        levels: {
          beginner: [
            { id: 'd1', english: 'Menu', russian: 'Меню', phonetic: 'ˈmenjuː', example: 'Could we have the menu please?' },
            { id: 'd2', english: 'Water', russian: 'Вода', phonetic: 'ˈwɔːtər', example: 'A glass of cold water, please.' },
            { id: 'd3', english: 'Bill', russian: 'Счет', phonetic: 'bɪl', example: 'Can I pay the bill by card?' },
            { id: 'd4', english: 'Table', russian: 'Столик', phonetic: 'ˈteɪbl', example: 'A table for two, please.' },
            { id: 'd5', english: 'Coffee', russian: 'Кофе', phonetic: 'ˈkɔːfi', example: 'I start my morning with coffee.' }
          ],
          intermediate: [
            { id: 'd6', english: 'Appetizer', russian: 'Закуска', phonetic: 'ˈæpɪtaɪzər', example: 'We ordered soup as an appetizer.' },
            { id: 'd7', english: 'Main course', russian: 'Основное блюдо', phonetic: 'meɪn kɔːrs', example: 'The main course was grilled fish.' },
            { id: 'd8', english: 'Tip', russian: 'Чаевые', phonetic: 'tɪp', example: 'We left a generous tip for the waiter.' }
          ],
          advanced: [
            { id: 'd9', english: 'Cuisine', russian: 'Кухня (национальная)', phonetic: 'kwɪˈziːn', example: 'This restaurant offers authentic Mediterranean cuisine.' },
            { id: 'd10', english: 'Dietary restrictions', russian: 'Диетические ограничения', phonetic: 'ˈdaɪətəri rɪˈstrɪkʃnz', example: 'Inform the server about your dietary restrictions.' }
          ]
        }
      },
      {
        id: 'home',
        title: '🏠 Дом & Быт',
        description: 'Обустройство дома, бытовая техника, мебель и повседневный уют',
        levels: {
          beginner: [
            { id: 'h1', english: 'Kitchen', russian: 'Кухня', phonetic: 'ˈkɪtʃɪn', example: 'We cook dinner in the kitchen.' },
            { id: 'h2', english: 'Bedroom', russian: 'Спальня', phonetic: 'ˈbedruːm', example: 'My bedroom is quiet and bright.' },
            { id: 'h3', english: 'Door', russian: 'Дверь', phonetic: 'dɔːr', example: 'Please lock the front door.' }
          ],
          intermediate: [
            { id: 'h4', english: 'Appliance', russian: 'Бытовой прибор', phonetic: 'əˈplaɪəns', example: 'The microwave is an essential kitchen appliance.' },
            { id: 'h5', english: 'Furniture', russian: 'Мебель', phonetic: 'ˈfɜːrnɪtʃər', example: 'They bought wooden furniture for the room.' }
          ],
          advanced: [
            { id: 'h6', english: 'Renovation', russian: 'Ремонт / Реконструкция', phonetic: 'ˌrenəˈveɪʃn', example: 'The house is undergoing a complete renovation.' }
          ]
        }
      }
    ];
    // Firebase Anonymous Config Fallback
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForVercelSyncModeOnly_123",
      authDomain: "linguacards-app.firebaseapp.com",
      projectId: "linguacards-app",
      storageBucket: "linguacards-app.appspot.com",
      messagingSenderId: "109876543210",
      appId: "1:109876543210:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      try { firebase.initializeApp(firebaseConfig); } catch (e) { console.log(e); }
    }
    const db = firebase.firestore ? firebase.firestore() : null;

    function App() {
      const [activeTab, setActiveTab] = useState('cards'); // 'cards', 'topics', 'speech', 'leaderboard'
      const [cards, setCards] = useState([
        { id: '1', english: 'Serendipity', russian: 'Счастливая случайность', phonetic: 'ˌserənˈdɪpəti', example: 'Finding this peaceful place was pure serendipity.' },
        { id: '2', english: 'Resilience', russian: 'Устойчивость / Стойкость', phonetic: 'rɪˈzɪliəns', example: 'Her emotional resilience helped her overcome difficulties.' }
      ]);
      const [learnedIds, setLearnedIds] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [apiKey, setApiKey] = useState(DEFAULT_API_KEY);
      
      // User & Social States
      const [userId, setUserId] = useState(() => localStorage.getItem('lc_uid') || 'user_' + Math.random().toString(36).substr(2, 6));
      const [userName, setUserName] = useState(() => localStorage.getItem('lc_uname') || 'Исследователь');
      const [following, setFollowing] = useState([]);
      const [leaderboard, setLeaderboard] = useState([]);

      // Modal & Interactive States
      const [showOnboarding, setShowOnboarding] = useState(!localStorage.getItem('lc_registered'));
      const [showSettings, setShowSettings] = useState(false);
      const [selectedTopic, setSelectedTopic] = useState(null);
      const [topicLevel, setTopicLevel] = useState('beginner');
      const [previewTopic, setPreviewTopic] = useState(null);
      const [activeWordModal, setActiveWordModal] = useState(null);
      const [inputWord, setInputWord] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [speechScore, setSpeechScore] = useState(0);

      useEffect(() => {
        localStorage.setItem('lc_uid', userId);
        localStorage.setItem('lc_uname', userName);
      }, [userId, userName]);

      // Handle Word Click inside Example Sentences
      const handleTokenClick = (word) => {
        const cleanWord = word.replace(/[^a-zA-Z]/g, '');
        if (!cleanWord) return;
        setActiveWordModal({ word: cleanWord, loading: true, translation: '' });
        
        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Translate the English word "${cleanWord}" into Russian briefly with 1-2 words only.` }] }]
          })
        })
        .then(r => r.json())
        .then(data => {
          const trans = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Перевод недоступен';
          setActiveWordModal({ word: cleanWord, loading: false, translation: trans });
        })
        .catch(() => {
          setActiveWordModal({ word: cleanWord, loading: false, translation: 'Ошибка перевода' });
        });
      };

      // Add Word from Context Modal
      const addModalWordToDeck = () => {
        if (!activeWordModal || !activeWordModal.word) return;
        const newCard = {
          id: Date.now().toString(),
          english: activeWordModal.word,
          russian: activeWordModal.translation,
          phonetic: '',
          example: `Added from reading context.`
        };
        setCards(prev => [newCard, ...prev]);
        setActiveWordModal(null);
      };

      const currentCard = cards[currentIndex] || cards[0];

      return (
        <div className="flex-1 flex flex-col max-w-md mx-auto w-full pb-20">
          {/* iOS Dynamic Island Protected Header */}
          <header className="sticky top-0 z-40 bg-[#090d16]/90 backdrop-blur-md border-b border-gray-800/80 safe-top px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-sm shadow-md">
                L
              </div>
              <span className="font-bold text-base text-gray-100 tracking-tight">LinguaCards</span>
            </div>

            {/* Navigation Tabs */}
            <nav className="flex items-center space-x-1 bg-gray-900/80 p-1 rounded-xl border border-gray-800">
              <button onClick={() => setActiveTab('cards')} class={`px-2.5 py-1 rounded-lg text-xs font-medium transition ${activeTab === 'cards' ? 'bg-brand-600 text-white' : 'text-gray-400'}`}>
                🎴 Карточки
              </button>
              <button onClick={() => setActiveTab('topics')} class={`px-2.5 py-1 rounded-lg text-xs font-medium transition ${activeTab === 'topics' ? 'bg-brand-600 text-white' : 'text-gray-400'}`}>
                📚 Темы
              </button>
              <button onClick={() => setActiveTab('speech')} class={`px-2.5 py-1 rounded-lg text-xs font-medium transition ${activeTab === 'speech' ? 'bg-brand-600 text-white' : 'text-gray-400'}`}>
                🎤 Речь
              </button>
            </nav>

            <button onClick={() => setShowSettings(true)} class="p-2 text-gray-400 hover:text-white rounded-lg">
              ⚙️
            </button>
          </header>

          {/* Main Body */}
          <main className="p-4 flex-1 flex flex-col">
            {activeTab === 'cards' && currentCard && (
              <div className="flex-1 flex flex-col justify-center my-auto">
                <div onClick={() => setIsFlipped(!isFlipped)} className="card-flip w-full cursor-pointer min-h-[320px]">
                  <div class={`card-inner relative w-full h-full rounded-2xl bg-gradient-to-b from-gray-800/90 to-gray-900 border border-gray-700/60 p-6 flex flex-col justify-between shadow-2xl ${isFlipped ? 'card-flipped' : ''}`}>
                    
                    {/* Front Side */}
                    <div className="card-front absolute inset-0 p-6 flex flex-col justify-between">
                      <div className="text-xs text-gray-400 font-semibold tracking-wider">НАЖМИТЕ ДЛЯ ПЕРЕВОДА 🔄</div>
                      <div className="text-center my-auto">
                        <h2 className="text-3xl font-extrabold text-white">{currentCard.english}</h2>
                        {currentCard.phonetic && <p className="text-sm text-brand-400 mt-2">[{currentCard.phonetic}]</p>}
                      </div>
                      <div className="text-xs text-gray-500 text-center">LinguaCards AI</div>
                    </div>

                    {/* Back Side */}
                    <div className="card-back absolute inset-0 p-6 flex flex-col justify-between">
                      <div className="text-xs text-brand-400 font-bold">ПЕРЕВОД & ПРИМЕР</div>
                      <div className="text-center my-auto">
                        <h3 className="text-2xl font-bold text-emerald-400">{currentCard.russian}</h3>
                        
                        {/* Interactive Clickable Sentence Example */}
                        {currentCard.example && (
                          <div className="mt-4 p-3 bg-gray-950/60 rounded-xl border border-gray-800 text-sm text-gray-300">
                            {currentCard.example.split(' ').map((w, idx) => (
                              <span 
                                key={idx} 
                                onClick={(e) => { e.stopPropagation(); handleTokenClick(w); }}
                                className="inline-block hover:text-brand-400 hover:underline cursor-pointer px-0.5"
                              >
                                {w}{' '}
                              </span>
                            ))}
                          </div>
                        )}
                      </div>
                      <div className="text-xs text-gray-500 text-center">Нажмите слово в примере для перевода</div>
                    </div>

                  </div>
                </div>

                {/* Card Control Buttons */}
                <div className="grid grid-cols-2 gap-3 mt-6">
                  <button onClick={() => setCurrentIndex((currentIndex + 1) % cards.length)} className="py-3 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold rounded-xl border border-gray-700">
                    Пропустить
                  </button>
                  <button onClick={() => { setLearnedIds([...learnedIds, currentCard.id]); setCurrentIndex((currentIndex + 1) % cards.length); }} className="py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg">
                    ✓ Выучил
                  </button>
                </div>
              </div>
            )}

            {/* Topics & Levels Tab */}
            {activeTab === 'topics' && (
              <div className="space-y-4">
                <h2 className="text-lg font-bold text-white">📚 Подборки по темам и уровням</h2>
                {BASE_COLLECTIONS.map(col => (
                  <div key={col.id} className="p-4 bg-gray-900 border border-gray-800 rounded-2xl space-y-3">
                    <h3 className="font-bold text-brand-400">{col.title}</h3>
                    <p className="text-xs text-gray-400">{col.description}</p>
                    <div className="grid grid-cols-3 gap-2 pt-2">
                      {['beginner', 'intermediate', 'advanced'].map(lvl => (
                        <button 
                          key={lvl} 
                          onClick={() => setPreviewTopic({ col, lvl })} 
                          className="py-2 px-2 bg-gray-800 hover:bg-brand-600 rounded-lg text-xs font-semibold text-center border border-gray-700"
                        >
                          {lvl === 'beginner' ? '🟢 A1-A2' : lvl === 'intermediate' ? '🟡 B1-B2' : '🔴 C1-C2'}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Interactive Word Pop-up Modal */}
          {activeWordModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-700 p-5 rounded-2xl max-w-xs w-full text-center space-y-3">
                <h4 className="text-xl font-bold text-white">{activeWordModal.word}</h4>
                {activeWordModal.loading ? (
                  <div className="text-xs text-brand-400 animate-pulse">Загрузка перевода AI...</div>
                ) : (
                  <p className="text-lg text-emerald-400 font-semibold">{activeWordModal.translation}</p>
                )}
                <div className="flex space-x-2 pt-2">
                  <button onClick={() => setActiveWordModal(null)} className="flex-1 py-2 bg-gray-800 text-gray-300 text-xs rounded-xl">Закрыть</button>
                  <button onClick={addModalWordToDeck} className="flex-1 py-2 bg-brand-600 text-white font-bold text-xs rounded-xl">+ В колоду</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
