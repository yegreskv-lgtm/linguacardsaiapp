      "spend": { v1: "spend", v2: "spent", v3: "spent", tr1: "[spend]", tr2: "[spent]", tr3: "[spent]", ru: "тратить, проводить время" },
      "stand": { v1: "stand", v2: "stood", v3: "stood", tr1: "[stænd]", tr2: "[stʊd]", tr3: "[stʊd]", ru: "стоять" },
      "swim": { v1: "swim", v2: "swam", v3: "swum", tr1: "[swɪm]", tr2: "[swæm]", tr3: "[swʌm]", ru: "плавать" },
      "take": { v1: "take", v2: "took", v3: "taken", tr1: "[teɪk]", tr2: "[tʊk]", tr3: "[ˈteɪkən]", ru: "брать" },
      "teach": { v1: "teach", v2: "taught", v3: "taught", tr1: "[tiːtʃ]", tr2: "[tɔːt]", tr3: "[tɔːt]", ru: "учить, обучать" },
      "tell": { v1: "tell", v2: "told", v3: "told", tr1: "[tel]", tr2: "[təʊld]", tr3: "[təʊld]", ru: "рассказывать" },
      "think": { v1: "think", v2: "thought", v3: "thought", tr1: "[θɪŋk]", tr2: "[θɔːt]", tr3: "[θɔːt]", ru: "думать" },
      "throw": { v1: "throw", v2: "threw", v3: "thrown", tr1: "[θrəʊ]", tr2: "[θruː]", tr3: "[θrəʊn]", ru: "бросать" },
      "understand": { v1: "understand", v2: "understood", v3: "understood", tr1: "[ˌʌndərˈstænd]", tr2: "[ˌʌndərˈstʊd]", tr3: "[ˌʌndərˈstʊd]", ru: "понимать" },
      "wake": { v1: "wake", v2: "woke", v3: "woken", tr1: "[weɪk]", tr2: "[wəʊk]", tr3: "[ˈwəʊkən]", ru: "просыпаться, будить" },
      "wear": { v1: "wear", v2: "wore", v3: "worn", tr1: "[weə]", tr2: "[wɔː]", tr3: "[wɔːn]", ru: "носить (одежду)" },
      "win": { v1: "win", v2: "won", v3: "won", tr1: "[wɪn]", tr2: "[wʌn]", tr3: "[wʌn]", ru: "побеждать" },
      "write": { v1: "write", v2: "wrote", v3: "written", tr1: "[raɪt]", tr2: "[rəʊt]", tr3: "[ˈrɪtn]", ru: "писать" }
    };

    const REVERSE_IRREGULAR = {};
    Object.keys(IRREGULAR_VERBS).forEach(v1 => {
      const data = IRREGULAR_VERBS[v1];
      REVERSE_IRREGULAR[data.v1.toLowerCase()] = v1;
      REVERSE_IRREGULAR[data.v2.toLowerCase()] = v1;
      REVERSE_IRREGULAR[data.v3.toLowerCase()] = v1;
    });

    function App() {
      const [username, setUsername] = useState(() => localStorage.getItem('lingua_username') || 'Сергей');
      
      const [deck, setDeck] = useState(() => {
        const saved = localStorage.getItem('lingua_deck');
        if (!saved) return INITIAL_CARDS;
        try {
          const parsed = JSON.parse(saved);
          const seen = new Set();
          return parsed.filter(card => {
            const key = (card.formsDetails ? card.formsDetails.f1.word : card.english).toLowerCase().trim();
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          }).map(card => {
            const cleanEng = card.english.split('—')[0].trim().toLowerCase();
            const verbBase = REVERSE_IRREGULAR[cleanEng] || cleanEng;

            if (IRREGULAR_VERBS[verbBase] && !card.formsDetails) {
              const info = IRREGULAR_VERBS[verbBase];
              return {
                ...card,
                english: `${info.v1} — ${info.v2} — ${info.v3}`,
                russian: info.ru,
                transcription: null,
                formsDetails: {
                  f1: { word: info.v1, tr: info.tr1 },
                  f2: { word: info.v2, tr: info.tr2 },
                  f3: { word: info.v3, tr: info.tr3 }
                }
              };
            }

            if (CORRECT_TRANSCRIPTIONS[cleanEng] && !card.formsDetails && (!card.transcription || card.transcription === '[—]')) {
              return { ...card, transcription: CORRECT_TRANSCRIPTIONS[cleanEng] };
            }

            return card;
          });
        } catch (e) {
          return INITIAL_CARDS;
        }
      });

      const [masteredCards, setMasteredCards] = useState(() => {
        const saved = localStorage.getItem('lingua_mastered');
        return saved ? JSON.parse(saved) : [];
      });

      const [duplicateModal, setDuplicateModal] = useState(null);

      const [sessionQueue, setSessionQueue] = useState([]);
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const [activeTab, setActiveTab] = useState('study');
      const [newWordInput, setNewWordInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [toast, setToast] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      
      const [isBulkAddOpen, setIsBulkAddOpen] = useState(false);
      const [bulkInput, setBulkInput] = useState('');
      const [isBulkProcessing, setIsBulkProcessing] = useState(false);
      const [editingCard, setEditingCard] = useState(null);

      useEffect(() => {
        localStorage.setItem('lingua_deck', JSON.stringify(deck));
      }, [deck]);

      useEffect(() => {
        localStorage.setItem('lingua_mastered', JSON.stringify(masteredCards));
      }, [masteredCards]);

      const showToast = (message, type = 'info', duration = 4000) => {
        setToast({ message, type });
        setTimeout(() => setToast(null), duration);
      };

      const handleRestoreAllMastered = () => {
        if (masteredCards.length === 0) return;
        setMasteredCards([]);
        showToast('Все выученные слова успешно возвращены в карточки для повторения! 🔄', 'success');
      };

      const handleExportFile = async () => {
        try {
          const dataObj = { deck, masteredCards };
          const dataStr = JSON.stringify(dataObj, null, 2);
          const fileName = `linguacards_backup_${Date.now()}.json`;

          if (window.showSaveFilePicker) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: fileName,
                types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
              });
              const writable = await handle.createWritable();
              await writable.write(dataStr);
              await writable.close();
              showToast('Файл бэкапа успешно сохранен! 📁', 'success', 6000);
              return;
            } catch (err) {
              if (err.name === 'AbortError') return;
            }
          }

          const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const downloadAnchor = document.createElement('a');
          downloadAnchor.href = url;
          downloadAnchor.download = fileName;
          
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          
          setTimeout(() => {
            document.body.removeChild(downloadAnchor);
            URL.revokeObjectURL(url);
          }, 1000);

          // Увеличенное время показа уведомления с четкой подсказкой для iOS
          showToast('📁 Файл сохранен! Откройте приложение "Файлы" -> "Загрузки"', 'success', 7000);
        } catch (err) {
          showToast('Не удалось скачать файл бэкапа', 'error');
        }
      };

      const handleImportFile = (e) => {
        const fileReader = new FileReader();
        if (e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.deck) setDeck(parsed.deck);
              if (parsed.masteredCards) setMasteredCards(parsed.masteredCards);
              showToast('Коллекция слов успешно восстановлена из файла! 🎉', 'success');
            } catch (err) {
              showToast('Ошибка чтения файла бэкапа', 'error');
            }
          };
        }
      };

      const handleCopyTextList = () => {
        const text = deck.map(c => `${c.english} — ${c.russian}`).join('\n');
        navigator.clipboard.writeText(text);
        showToast('Список всех слов скопирован в буфер обмена! 📋', 'success');
      };

      const currentCard = useMemo(() => {
        if (sessionQueue.length === 0) return null;
        const cardId = sessionQueue[currentCardIndex] || sessionQueue[0];
        return deck.find(c => c.id === cardId) || null;
      }, [sessionQueue, currentCardIndex, deck]);

      const formatTranscription = (w) => {
        const cleanW = w.toLowerCase().trim();
        if (CORRECT_TRANSCRIPTIONS[cleanW]) return CORRECT_TRANSCRIPTIONS[cleanW];
        const cleaned = cleanW.replace(/[^a-zA-Z]/g, '');
        if (!cleaned) return '[—]';
        return `[${cleaned}]`;
      };

      const processInputLine = async (rawInput, existingDeck = deck) => {
        let line = rawInput.trim();
        if (!line) return null;

        let manualTranscription = null;
        const bracketMatch = line.match(/\[(.*?)\]/);
        if (bracketMatch) {
          manualTranscription = `[${bracketMatch[1].trim()}]`;
          line = line.replace(bracketMatch[0], '').replace(/\s+/g, ' ').trim();
        }

        const delimiterMatch = line.match(/\s*[-—=:|\t]\s*/);
        let part1 = line;
        let part2 = '';

        if (delimiterMatch) {
          const parts = line.split(delimiterMatch[0]);
          part1 = parts[0]?.trim() || '';
          part2 = parts.slice(1).join(' ').trim() || '';
        }

        let english = '';
        let russian = '';
        let formsDetails = null;

        const lowerKey = part1.toLowerCase();
        let baseVerb = lowerKey;
        if (REVERSE_IRREGULAR[lowerKey]) {
          baseVerb = REVERSE_IRREGULAR[lowerKey];
        }

        if (IRREGULAR_VERBS[baseVerb]) {
          const info = IRREGULAR_VERBS[baseVerb];
          english = `${info.v1} — ${info.v2} — ${info.v3}`;
          russian = info.ru;
          formsDetails = {
            f1: { word: info.v1, tr: manualTranscription || info.tr1 },
            f2: { word: info.v2, tr: info.tr2 },
            f3: { word: info.v3, tr: info.tr3 }
          };
        } else if (part2) {
          const isPart1Ru = /[а-яё]/i.test(part1);
          if (isPart1Ru) { russian = part1; english = part2; } 
          else { english = part1; russian = part2; }
        } else {
          const isRu = /[а-яё]/i.test(part1);
          english = part1; russian = part1;
          try {
            const langPair = isRu ? 'ru|en' : 'en|ru';
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(part1)}&langpair=${langPair}`);
            const data = await res.json();
            if (data?.responseData?.translatedText) {
              const translated = data.responseData.translatedText;
              if (isRu) { english = translated; russian = part1; } 
              else { english = part1; russian = translated; }
            }
          } catch (e) {}
        }

        const cleanEngLower = english.toLowerCase();
        const verbKey = Object.keys(IRREGULAR_VERBS).find(k => cleanEngLower.includes(k) || k === cleanEngLower);
        if (verbKey && !formsDetails) {
          const info = IRREGULAR_VERBS[verbKey];
          english = `${info.v1} — ${info.v2} — ${info.v3}`;
          russian = info.ru;
          formsDetails = {
            f1: { word: info.v1, tr: manualTranscription || info.tr1 },
            f2: { word: info.v2, tr: info.tr2 },
            f3: { word: info.v3, tr: info.tr3 }
          };
        }

        russian = russian.replace(/[a-zA-Z]+/g, '').replace(/[\/\—\-]+/g, ' ').trim();
        russian = russian.charAt(0).toUpperCase() + russian.slice(1);
        if (!russian) russian = part1;

        const baseCheckKey = formsDetails ? formsDetails.f1.word.toLowerCase() : cleanEngLower;

        const existingCard = existingDeck.find(c => {
          const cBase = c.formsDetails ? c.formsDetails.f1.word.toLowerCase() : c.english.toLowerCase();
          return cBase === baseCheckKey;
        });

        if (existingCard) {
          if (!existingCard.russian.toLowerCase().includes(russian.toLowerCase())) {
            return { isDuplicate: true, existingCard, newRussian: russian, rawInput };
          } else {
            return { action: 'exists', card: existingCard };
          }
        }

        return {
          card: {
            id: 'card-' + Date.now() + Math.random(),
            english,
            russian,
            transcription: formsDetails ? null : (manualTranscription || formatTranscription(english)),
            formsDetails: formsDetails || null,
            createdAt: Date.now()
          }
        };
      };

      const handleAddWordAutomatic = async (e) => {
        e?.preventDefault();
        const query = newWordInput.trim();
        if (!query) return;
        setIsGenerating(true);
        try {
          const res = await processInputLine(query, deck);
          if (res.isDuplicate) {
            setDuplicateModal(res);
            setIsGenerating(false);
            return;
          }
          if (res.action === 'exists') {
            showToast(`Слово уже есть в вашей колоде!`, 'info');
            setNewWordInput('');
            setIsGenerating(false);
            return;
          }
          if (res.card) {
            setDeck(prev => [res.card, ...prev]);
            setNewWordInput('');
            showToast(`Слово добавлено! 🚀`, 'success');
          }
        } catch (err) {
          showToast('Не удалось добавить слово', 'error');
        } finally { setIsGenerating(false); }
      };

      const handleConfirmAddTranslation = () => {
        if (!duplicateModal) return;
        const { existingCard, newRussian } = duplicateModal;
        
        setDeck(prev => prev.map(c => {
          if (c.id === existingCard.id) {
            const updatedRu = `${c.russian} / ${newRussian}`;
            return { ...c, russian: updatedRu };
          }
          return c;
        }));

        showToast(`Новый вариант перевода добавлен! 🤝`, 'success');
        setDuplicateModal(null);
        setNewWordInput('');
      };

      const handleBulkAddAuto = async () => {
        const rawLines = bulkInput.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        if (rawLines.length === 0) return;
        setIsBulkProcessing(true);
        try {
          const newCards = [];
          let updatedDeck = [...deck];
          for (let i = 0; i < rawLines.length; i++) {
            const res = await processInputLine(rawLines[i], updatedDeck);
            if (res.card) {
              newCards.push(res.card);
              updatedDeck.unshift(res.card);
            } else if (res.isDuplicate) {
              updatedDeck = updatedDeck.map(c => {
                if (c.id === res.existingCard.id) {
                  return { ...c, russian: `${c.russian} / ${res.newRussian}` };
                }
                return c;
              });
            }
          }
          if (newCards.length > 0) {
            setDeck(updatedDeck);
          }
          setBulkInput('');
          setIsBulkAddOpen(false);
          showToast(`Массовая загрузка завершена! 🚀`, 'success');
        } catch (err) {
          showToast('Ошибка при загрузке', 'error');
        } finally { setIsBulkProcessing(false); }
      };

      const handleDeleteCard = (cardId) => {
        setDeck(prev => prev.filter(c => c.id !== cardId));
        setMasteredCards(prev => prev.filter(c => c.id !== cardId));
        setSessionQueue(prev => prev.filter(id => id !== cardId));
        showToast('Слово удалено', 'info');
      };

      const handleSkip = () => {
        if (sessionQueue.length <= 1) return;
        setIsFlipped(false);
        setSessionQueue(prev => {
          const currentId = prev[currentCardIndex];
          const updated = prev.filter((_, idx) => idx !== currentCardIndex);
          return [...updated, currentId];
        });
      };

      const handleDone = () => {
        if (sessionQueue.length === 0) return;
        setIsFlipped(false);
        setSessionQueue(prev => prev.filter((_, idx) => idx !== currentCardIndex));
      };

      const handleMastered = (cardToMaster = currentCard) => {
        if (!cardToMaster) return;
        setIsFlipped(false);
        if (!masteredCards.some(c => c.id === cardToMaster.id)) {
          setMasteredCards(prev => [cardToMaster, ...prev]);
        }
        setSessionQueue(prev => prev.filter(id => id !== cardToMaster.id));
        showToast(`Слово выучено!`, 'success');
      };

      const handleRestoreCard = (card) => {
        setMasteredCards(prev => prev.filter(c => c.id !== card.id));
        setSessionQueue(prev => [...prev, card.id]);
      };

      const handleResetSession = () => {
        const masteredIds = new Set(masteredCards.map(m => m.id));
        const activeIds = deck.filter(c => !masteredIds.has(c.id)).map(c => c.id);
        setSessionQueue(activeIds);
        setCurrentCardIndex(0);
        setIsFlipped(false);
      };

      const handleShuffleSession = () => {
        if (sessionQueue.length <= 1) return;
        setIsFlipped(false);
        setSessionQueue(prev => {
          const shuffled = [...prev];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          return shuffled;
        });
      };

      const handleSpeak = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/—/g, ' ');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = 0.88;
        window.speechSynthesis.speak(utterance);
      };

      const handleOpenEdit = (card) => {
        const isIrregular = card.formsDetails !== null;
        setEditingCard({
          ...card,
          isIrregular,
          f1Word: isIrregular ? card.formsDetails.f1.word : card.english.split('—')[0].trim(),
          f1Tr: isIrregular ? card.formsDetails.f1.tr : (card.transcription || ''),
          f2Word: isIrregular ? card.formsDetails.f2.word : '',
          f2Tr: isIrregular ? card.formsDetails.f2.tr : '',
          f3Word: isIrregular ? card.formsDetails.f3.word : '',
          f3Tr: isIrregular ? card.formsDetails.f3.tr : ''
        });
      };

      const handleSaveEditedCard = (e) => {
        e.preventDefault();
        if (!editingCard) return;

        let updatedCard;
        if (editingCard.isIrregular) {
          const w1 = editingCard.f1Word.trim();
          const w2 = editingCard.f2Word.trim();
          const w3 = editingCard.f3Word.trim();
          updatedCard = {
            ...editingCard,
            english: `${w1} — ${w2} — ${w3}`,
            russian: editingCard.russian.trim(),
            transcription: null,
            formsDetails: {
              f1: { word: w1, tr: editingCard.f1Tr.trim() || formatTranscription(w1) },
              f2: { word: w2, tr: editingCard.f2Tr.trim() || formatTranscription(w2) },
              f3: { word: w3, tr: editingCard.f3Tr.trim() || formatTranscription(w3) }
            }
          };
          delete updatedCard.isIrregular;
          delete updatedCard.f1Word; delete updatedCard.f1Tr;
          delete updatedCard.f2Word; delete updatedCard.f2Tr;
          delete updatedCard.f3Word; delete updatedCard.f3Tr;
        } else {
          const eng = editingCard.english.trim();
          const tr = editingCard.f1Tr.trim();
          updatedCard = {
            ...editingCard,
            english: eng,
            russian: editingCard.russian.trim(),
            transcription: tr || formatTranscription(eng),
            formsDetails: null
          };
          delete updatedCard.isIrregular;
          delete updatedCard.f1Word; delete updatedCard.f1Tr;
          delete updatedCard.f2Word; delete updatedCard.f2Tr;
          delete updatedCard.f3Word; delete updatedCard.f3Tr;
        }

        setDeck(prev => prev.map(c => c.id === updatedCard.id ? updatedCard : c));
        setMasteredCards(prev => prev.map(c => c.id === updatedCard.id ? updatedCard : c));
        setEditingCard(null);
        showToast('Карточка успешно обновлена! ✨', 'success');
      };

      useEffect(() => {
        const masteredIds = new Set(masteredCards.map(m => m.id));
        const activeDeck = deck.filter(c => !masteredIds.has(c.id));
        setSessionQueue(prev => {
          const validIds = new Set(activeDeck.map(c => c.id));
          const filtered = prev.filter(id => validIds.has(id));
          if (filtered.length === 0 && activeDeck.length > 0) return activeDeck.map(c => c.id);
          return filtered;
        });
      }, [deck, masteredCards]);

      const filteredDeck = deck.filter(c => (c.english || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.russian || '').toLowerCase().includes(searchTerm.toLowerCase()));
      const filteredMastered = masteredCards.filter(c => (c.english || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.russian || '').toLowerCase().includes(searchTerm.toLowerCase()));
      const verbsOnlyDeck = deck.filter(c => c.formsDetails !== null);

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100 pt-safe pb-28">
          
          {toast && (
            <div className={`fixed top-safe right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl backdrop-blur-md border transition-all duration-300 animate-bounce-short max-w-md mt-4 ${
              toast.type === 'error' ? 'bg-red-950/90 text-red-200 border-red-800' : 
              toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-800' : 
              'bg-slate-800/90 text-blue-200 border-slate-700'
            }`}>
              <Icon name={toast.type === 'error' ? 'alert-circle' : toast.type === 'success' ? 'check-circle-2' : 'info'} className="w-5 h-5 shrink-0" />
              <span className="text-xs sm:text-sm font-medium">{toast.message}</span>
            </div>
          )}

          <header className="border-b border-slate-800/80 bg-slate-900/85 backdrop-blur-xl sticky top-0 z-40 px-4 py-3">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-blue-500/20 shrink-0">
                  <Icon name="sparkles" className="w-4 h-4 text-white" />
                </div>
                <div>
                  <h1 className="font-bold text-sm sm:text-base leading-tight text-white">
                    LinguaCards
                  </h1>
                  <p className="text-[10px] sm:text-[11px] text-slate-400 font-medium">Профиль: <span className="text-emerald-400 font-bold">{username}</span></p>
                </div>
              </div>
            </div>
          </header>

          {activeTab !== 'settings' && activeTab !== 'manual' && activeTab !== 'verbs' && (
            <div className="bg-slate-900/40 border-b border-slate-800/60 py-3 px-4 sm:px-6">
              <div className="max-w-3xl mx-auto flex flex-col gap-3">
                <form onSubmit={handleAddWordAutomatic} className="flex flex-col sm:flex-row gap-2.5">
                  <div className="relative flex-grow">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                      <Icon name="plus-circle" className="w-5 h-5" />
                    </div>
                    <input
                      type="text"
                      value={newWordInput}
                      onChange={(e) => setNewWordInput(e.target.value)}
                      placeholder="Слово [транскрипция] — перевод..."

                <div className="flex gap-2 pt-2">
                  <button onClick={() => setDuplicateModal(null)} className="flex-1 py-2.5 text-xs text-slate-400 hover:text-white bg-slate-800 rounded-xl">Отмена</button>
                  <button onClick={handleConfirmAddTranslation} className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-xl">
                    Добавить вариант
                  </button>
                </div>
              </div>
            </div>
          )}

          {editingCard && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 relative my-8 shadow-2xl">
                <button onClick={() => setEditingCard(null)} className="absolute top-4 right-4 text-slate-500 hover:text-slate-300"><Icon name="x" className="w-5 h-5" /></button>
                <h3 className="text-lg font-bold text-white mb-4">Редактировать карточку</h3>
                
                <form onSubmit={handleSaveEditedCard} className="space-y-4">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Перевод (на русском):</label>
                    <input type="text" required value={editingCard.russian} onChange={(e) => setEditingCard({ ...editingCard, russian: e.target.value })} className="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500" />
                  </div>

                  <div className="flex items-center gap-2 py-1">
                    <input 
                      type="checkbox" 
                      id="isIrregularCheck" 
                      checked={editingCard.isIrregular} 
                      onChange={(e) => setEditingCard({ ...editingCard, isIrregular: e.target.checked })} 
                      className="w-4 h-4 accent-blue-600 rounded cursor-pointer" 
                    />
                    <label htmlFor="isIrregularCheck" className="text-xs font-semibold text-indigo-300 cursor-pointer">
                      Это неправильный глагол (3 формы)
                    </label>
                  </div>

                  {editingCard.isIrregular ? (
                    <div className="space-y-3 p-3 bg-indigo-950/30 border border-indigo-900/50 rounded-xl">
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[10px] text-indigo-300 mb-1">V1 (Infinitive)</label>
                          <input type="text" value={editingCard.f1Word} onChange={(e) => setEditingCard({ ...editingCard, f1Word: e.target.value })} placeholder="например: go" className="w-full px-2.5 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-100" />
                        </div>
                        <div>
                          <label className="block text-[10px] text-indigo-300 mb-1">Транскрипция V1</label>
                          <input type="text" value={editingCard.f1Tr} onChange={(e) => setEditingCard({ ...editingCard, f1Tr: e.target.value })} placeholder="[ɡəʊ]" className="w-full px-2.5 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-100 font-mono" />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[10px] text-indigo-300 mb-1">V2 (Past Simple)</label>
                          <input type="text" value={editingCard.f2Word} onChange={(e) => setEditingCard({ ...editingCard, f2Word: e.target.value })} placeholder="например: went" className="w-full px-2.5 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-100" />
                        </div>
                        <div>
                          <label className="block text-[10px] text-indigo-300 mb-1">Транскрипция V2</label>
                          <input type="text" value={editingCard.f2Tr} onChange={(e) => setEditingCard({ ...editingCard, f2Tr: e.target.value })} placeholder="[went]" className="w-full px-2.5 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-100 font-mono" />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[10px] text-indigo-300 mb-1">V3 (Participle II)</label>
                          <input type="text" value={editingCard.f3Word} onChange={(e) => setEditingCard({ ...editingCard, f3Word: e.target.value })} placeholder="например: gone" className="w-full px-2.5 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-100" />
                        </div>
                        <div>
                          <label className="block text-[10px] text-indigo-300 mb-1">Транскрипция V3</label>
                          <input type="text" value={editingCard.f3Tr} onChange={(e) => setEditingCard({ ...editingCard, f3Tr: e.target.value })} placeholder="[ɡɒn]" className="w-full px-2.5 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-slate-100 font-mono" />
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Английское слово:</label>
                        <input type="text" required value={editingCard.english} onChange={(e) => setEditingCard({ ...editingCard, english: e.target.value })} className="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500" />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Транскрипция:</label>
                        <input type="text" value={editingCard.f1Tr} onChange={(e) => setEditingCard({ ...editingCard, f1Tr: e.target.value })} placeholder="[...]" className="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 font-mono focus:outline-none focus:border-blue-500" />
                      </div>
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setEditingCard(null)} className="px-4 py-2.5 text-xs text-slate-400 hover:text-white">Отмена</button>
                    <button type="submit" className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl shadow-lg">Сохранить</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isBulkAddOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 relative flex flex-col">
                <button onClick={() => setIsBulkAddOpen(false)} className="absolute top-4 right-4 text-slate-500 hover:text-slate-300"><Icon name="x" className="w-5 h-5" /></button>
                <h3 className="text-lg font-bold text-white mb-1">Массовая загрузка</h3>
                <p className="text-[11px] text-slate-400 mb-3">Каждое слово с новой строки. Можно указать транскрипцию в квадратных скобках:</p>
                <textarea rows={6} value={bulkInput} onChange={(e) => setBulkInput(e.target.value)} placeholder="serendipity [ˌserənˈdɪpəti] — Счастливая случайность&#10;courage [ˈkʌrɪdʒ] — Мужество" className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono text-slate-100 mb-4 resize-none" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setIsBulkAddOpen(false)} className="px-4 py-2 text-xs text-slate-400">Отмена</button>
                  <button onClick={handleBulkAddAuto} disabled={isBulkProcessing || !bulkInput.trim()} className="px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-xl flex items-center gap-2">Загрузить</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
