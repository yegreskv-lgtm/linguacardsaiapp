</head>

  <div id="root" class="flex-grow flex flex-col"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const iconProps = { xmlns: "http://www.w3.org/2000/svg", width: "24", height: "24", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className };
      switch (name) {
        case 'sparkles': return <svg {...iconProps}><path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>;
        case 'settings': return <svg {...iconProps}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
        case 'layers': return <svg {...iconProps}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 12.5"/><path d="m22 17.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 17.5"/></svg>;
        case 'book-open': return <svg {...iconProps}><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>;
        case 'trophy': return <svg {...iconProps}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>;
        case 'plus-circle': return <svg {...iconProps}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>;
        case 'wand-2': return <svg {...iconProps}><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.21 1.21 0 0 0 1.72 0L21.64 5.36a1.21 1.21 0 0 0 0-1.72z"/><path d="m14 7 3 3"/><path d="M5 6v1"/><path d="M19 17v1"/><path d="M10 2v1"/><path d="M7 8H6"/><path d="M21 12h-1"/></svg>;
        case 'key': return <svg {...iconProps}><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>;
        case 'shuffle': return <svg {...iconProps}><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l.8 1.1"/><path d="M14.4 14.2l.8 1.1c.8 1.1 2 1.7 3.3 1.7H22"/><path d="m18 18 4 4-4 4"/></svg>;
        case 'help-circle': return <svg {...iconProps}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>;
        case 'alert-circle': return <svg {...iconProps}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        case 'check-circle-2': return <svg {...iconProps}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
        case 'rotate-ccw': return <svg {...iconProps}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        case 'party-popper': return <svg {...iconProps}><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24 2.24"/><path d="M8 16 16 8"/><path d="m11 13 8 8"/></svg>;
        case 'mouse-pointer-click': return <svg {...iconProps}><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></svg>;
        case 'volume-2': return <svg {...iconProps}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
        case 'x': return <svg {...iconProps}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        case 'list-plus': return <svg {...iconProps}><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg>;
        default: return null;
      }
    };

    const INITIAL_CARDS = [
      {
        id: "card-1",
        english: "Serendipity",
        russian: "Счастливая случайность",
        transcription: "[ˌserənˈdɪpəti]",
        formsDetails: null,
        exampleEn: "Finding this rare book was pure serendipity.",
        exampleRu: "Находка этой редкой книги была чистой случайностью.",
        createdAt: Date.now() - 500000
      }
    ];

    const IRREGULAR_VERBS = {
      "be": { v1: "be", v2: "was/were", v3: "been", tr1: "[biː]", tr2: "[wɒz / wɜː]", tr3: "[biːn]", ru: "быть" },
      "begin": { v1: "begin", v2: "began", v3: "begun", tr1: "[bɪˈɡɪn]", tr2: "[bɪˈɡæn]", tr3: "[bɪˈɡʌn]", ru: "начинать(ся)" },
      "break": { v1: "break", v2: "broke", v3: "broken", tr1: "[breɪk]", tr2: "[brəʊk]", tr3: "[ˈbrəʊkən]", ru: "ломать" },
      "bring": { v1: "bring", v2: "brought", v3: "brought", tr1: "[brɪŋ]", tr2: "[brɔːt]", tr3: "[brɔːt]", ru: "приносить" },
      "buy": { v1: "buy", v2: "bought", v3: "bought", tr1: "[baɪ]", tr2: "[bɔːt]", tr3: "[bɔːt]", ru: "покупать" },
      "come": { v1: "come", v2: "came", v3: "come", tr1: "[kʌm]", tr2: "[keɪm]", tr3: "[kʌm]", ru: "приходить" },
      "do": { v1: "do", v2: "did", v3: "done", tr1: "[duː]", tr2: "[dɪd]", tr3: "[dʌn]", ru: "делать" },
      "draw": { v1: "draw", v2: "drew", v3: "drawn", tr1: "[drɔː]", tr2: "[druː]", tr3: "[drɔːn]", ru: "рисовать" },
      "drink": { v1: "drink", v2: "drank", v3: "drunk", tr1: "[drɪŋk]", tr2: "[dræŋk]", tr3: "[drʌŋk]", ru: "пить" },
      "drive": { v1: "drive", v2: "drove", v3: "driven", tr1: "[draɪv]", tr2: "[drəʊv]", tr3: "[ˈdrɪvn]", ru: "водить автомобиль" },
      "eat": { v1: "eat", v2: "ate", v3: "eaten", tr1: "[iːt]", tr2: "[et]", tr3: "[ˈiːtn]", ru: "есть" },
      "fall": { v1: "fall", v2: "fell", v3: "fallen", tr1: "[fɔːl]", tr2: "[fel]", tr3: "[ˈfɔːlən]", ru: "падать" },
      "find": { v1: "find", v2: "found", v3: "found", tr1: "[faɪnd]", tr2: "[faʊnd]", tr3: "[faʊnd]", ru: "находить" },
      "fly": { v1: "fly", v2: "flew", v3: "flown", tr1: "[flaɪ]", tr2: "[fluː]", tr3: "[fləʊn]", ru: "летать" },
      "forget": { v1: "forget", v2: "forgot", v3: "forgotten", tr1: "[fərˈɡet]", tr2: "[fərˈɡɒt]", tr3: "[fərˈɡɒtn]", ru: "забывать" },
      "get": { v1: "get", v2: "got", v3: "got/gotten", tr1: "[ɡet]", tr2: "[ɡɒt]", tr3: "[ɡɒt / ˈɡɒtn]", ru: "получать" },
      "give": { v1: "give", v2: "gave", v3: "given", tr1: "[ɡɪv]", tr2: "[ɡeɪv]", tr3: "[ˈɡɪvn]", ru: "давать" },
      "go": { v1: "go", v2: "went", v3: "gone", tr1: "[ɡəʊ]", tr2: "[went]", tr3: "[ɡɒn]", ru: "идти, ехать" },
      "have": { v1: "have", v2: "had", v3: "had", tr1: "[hæv]", tr2: "[hæd]", tr3: "[hæd]", ru: "иметь" },
      "know": { v1: "know", v2: "knew", v3: "known", tr1: "[nəʊ]", tr2: "[njuː]", tr3: "[nəʊn]", ru: "знать" },
      "make": { v1: "make", v2: "made", v3: "made", tr1: "[meɪk]", tr2: "[meɪd]", tr3: "[meɪd]", ru: "делать, создавать" },
      "meet": { v1: "meet", v2: "met", v3: "met", tr1: "[miːt]", tr2: "[met]", tr3: "[met]", ru: "встречать" },
      "read": { v1: "read", v2: "read", v3: "read", tr1: "[riːd]", tr2: "[red]", tr3: "[red]", ru: "читать" },
      "run": { v1: "run", v2: "ran", v3: "run", tr1: "[rʌn]", tr2: "[ræn]", tr3: "[rʌn]", ru: "бежать" },
      "say": { v1: "say", v2: "said", v3: "said", tr1: "[seɪ]", tr2: "[sed]", tr3: "[sed]", ru: "говорить, сказать" },
      "see": { v1: "see", v2: "saw", v3: "seen", tr1: "[siː]", tr2: "[sɔː]", tr3: "[siːn]", ru: "видеть" },
      "sing": { v1: "sing", v2: "sang", v3: "sung", tr1: "[sɪŋ]", tr2: "[sæŋ]", tr3: "[sʌŋ]", ru: "петь" },
      "sit": { v1: "sit", v2: "sat", v3: "sat", tr1: "[sɪt]", tr2: "[sæt]", tr3: "[sæt]", ru: "сидеть" },
      "speak": { v1: "speak", v2: "spoke", v3: "spoken", tr1: "[spiːk]", tr2: "[spəʊk]", tr3: "[ˈspəʊkən]", ru: "говорить" },
      "swim": { v1: "swim", v2: "swam", v3: "swum", tr1: "[swɪm]", tr2: "[swæm]", tr3: "[swʌm]", ru: "плавать" },
      "take": { v1: "take", v2: "took", v3: "taken", tr1: "[teɪk]", tr2: "[tʊk]", tr3: "[ˈteɪkən]", ru: "брать" },
      "tell": { v1: "tell", v2: "told", v3: "told", tr1: "[tel]", tr2: "[təʊld]", tr3: "[təʊld]", ru: "рассказывать" },
      "think": { v1: "think", v2: "thought", v3: "thought", tr1: "[θɪŋk]", tr2: "[θɔːt]", tr3: "[θɔːt]", ru: "думать" },
      "write": { v1: "write", v2: "wrote", v3: "written", tr1: "[raɪt]", tr2: "[rəʊt]", tr3: "[ˈrɪtn]", ru: "писать" }
    };

    const REVERSE_IRREGULAR = {};
    Object.keys(IRREGULAR_VERBS).forEach(v1 => {
      const data = IRREGULAR_VERBS[v1];
      REVERSE_IRREGULAR[data.v1.toLowerCase()] = v1;
      REVERSE_IRREGULAR[data.v2.toLowerCase()] = v1;
      REVERSE_IRREGULAR[data.v3.toLowerCase()] = v1;
    });

    const SMART_DICTIONARY = {
      "ass": { en: "Ass", ru: "Осел / Упрямец", tr: "[æs]" },
      "talk": { en: "Talk", ru: "Разговаривать", tr: "[tɔːk]" },
      "say": { en: "Say", ru: "Говорить, сказать", tr: "[seɪ]" },
      "speak": { en: "Speak", ru: "Говорить", tr: "[spiːk]" },
      "teacher": { en: "Teacher", ru: "Учитель", tr: "[ˈtiːtʃər]" },
      "egg": { en: "Egg", ru: "Яйцо", tr: "[eɡ]" }
    };

    function App() {
      const [username, setUsername] = useState(() => localStorage.getItem('lingua_username') || 'Сергей');
      
      const [deck, setDeck] = useState(() => {
        const saved = localStorage.getItem('lingua_deck');
        return saved ? JSON.parse(saved) : INITIAL_CARDS;
      });

      const [masteredCards, setMasteredCards] = useState(() => {
        const saved = localStorage.getItem('lingua_mastered');
        return saved ? JSON.parse(saved) : [];
      });

      const [duplicateModal, setDuplicateModal] = useState(null);

      const [sessionQueue, setSessionQueue] = useState([]);
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const [activeTab, setActiveTab] = useState('study');
      const [newWordInput, setNewWordInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [toast, setToast] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      
      const [isBulkAddOpen, setIsBulkAddOpen] = useState(false);
      const [bulkInput, setBulkInput] = useState('');
      const [isBulkProcessing, setIsBulkProcessing] = useState(false);
      const [editingCard, setEditingCard] = useState(null);

      useEffect(() => {
        localStorage.setItem('lingua_deck', JSON.stringify(deck));
      }, [deck]);

      useEffect(() => {
        localStorage.setItem('lingua_mastered', JSON.stringify(masteredCards));
      }, [masteredCards]);

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleRestoreAllMastered = () => {
        if (masteredCards.length === 0) return;
        setMasteredCards([]);
        showToast('Все выученные слова успешно возвращены в карточки для повторения! 🔄', 'success');
      };

      const currentCard = useMemo(() => {
        if (sessionQueue.length === 0) return null;
        const cardId = sessionQueue[currentCardIndex] || sessionQueue[0];
        return deck.find(c => c.id === cardId) || null;
      }, [sessionQueue, currentCardIndex, deck]);

      const formatTranscription = (w) => {
        const cleaned = w.replace(/[^a-zA-Z]/g, '');
        if (!cleaned) return '[—]';
        return `[${cleaned.toLowerCase()}]`;
      };

      const processInputLine = async (rawInput, existingDeck = deck) => {
        const line = rawInput.trim();
        if (!line) return null;

        const delimiterMatch = line.match(/\s*[-—=:|\t]\s*/);
        let part1 = line;
        let part2 = '';

        if (delimiterMatch) {
          const parts = line.split(delimiterMatch[0]);
          part1 = parts[0]?.trim() || '';
          part2 = parts.slice(1).join(' ').trim() || '';
        }

        let english = '';
        let russian = '';
        let formsDetails = null;

        if (part2) {
          const isPart1Ru = /[а-яё]/i.test(part1);
          if (isPart1Ru) { russian = part1; english = part2; } 
          else { english = part1; russian = part2; }
        } else {
          const lowerKey = part1.toLowerCase();
          let baseVerb = lowerKey;
          if (REVERSE_IRREGULAR[lowerKey]) {
            baseVerb = REVERSE_IRREGULAR[lowerKey];
          }

          if (IRREGULAR_VERBS[baseVerb]) {
            const info = IRREGULAR_VERBS[baseVerb];
            english = `${info.v1} — ${info.v2} — ${info.v3}`;
            russian = info.ru;
            formsDetails = {
              f1: { word: info.v1, tr: info.tr1, ru: info.ru },
              f2: { word: info.v2, tr: info.tr2, ru: `${info.ru} (прошедшее)` },
              f3: { word: info.v3, tr: info.tr3, ru: `${info.ru} (причастие)` }
            };
          } else if (SMART_DICTIONARY[lowerKey]) {
            const item = SMART_DICTIONARY[lowerKey];
            english = item.en;
            russian = item.ru;
          } else {
            const isRu = /[а-яё]/i.test(part1);
            english = part1; russian = part1;
            try {
              const langPair = isRu ? 'ru|en' : 'en|ru';
              const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(part1)}&langpair=${langPair}`);
              const data = await res.json();
              if (data?.responseData?.translatedText) {
                const translated = data.responseData.translatedText;
                if (isRu) { english = translated; russian = part1; } 
                else { english = part1; russian = translated; }
              }
            } catch (e) {}
          }
        }

        const cleanEngLower = english.toLowerCase();
        let finalEnglish = english;
        let finalRussian = russian.charAt(0).toUpperCase() + russian.slice(1);

        const verbKey = Object.keys(IRREGULAR_VERBS).find(k => cleanEngLower.includes(k));
        if (verbKey && !formsDetails) {
          const info = IRREGULAR_VERBS[verbKey];
          finalEnglish = `${info.v1} — ${info.v2} — ${info.v3}`;
          formsDetails = {
            f1: { word: info.v1, tr: info.tr1, ru: finalRussian },
            f2: { word: info.v2, tr: info.tr2, ru: `${finalRussian} (прошедшее)` },
            f3: { word: info.v3, tr: info.tr3, ru: `${finalRussian} (причастие)` }
          };
        }

        const existingCard = existingDeck.find(c => c.english.toLowerCase() === cleanEngLower || (formsDetails && c.english.toLowerCase().includes(formsDetails.f1.word)));
        if (existingCard) {
          if (!existingCard.russian.toLowerCase().includes(finalRussian.toLowerCase())) {
            return { isDuplicate: true, existingCard, newRussian: finalRussian, rawInput };
          } else {
            return { action: 'exists', card: existingCard };
          }
        }

        return {
          card: {
            id: 'card-' + Date.now() + Math.random(),
            english: finalEnglish,
            russian: finalRussian,
            transcription: formsDetails ? null : formatTranscription(finalEnglish),
            formsDetails: formsDetails || null,
            exampleEn: `Example sentence using "${finalEnglish}".`,
            exampleRu: `Пример перевода: "${finalRussian}".`,
            createdAt: Date.now()
          }
        };
      };

      const handleAddWordAutomatic = async (e) => {
        e?.preventDefault();
        const query = newWordInput.trim();
        if (!query) return;
        setIsGenerating(true);
        try {
          const res = await processInputLine(query, deck);
          if (res.isDuplicate) {
            setDuplicateModal(res);
            setIsGenerating(false);
            return;
          }
          if (res.action === 'exists') {
            showToast(`Слово "${res.card.english}" уже есть в вашей колоде!`, 'info');
            setNewWordInput('');
            setIsGenerating(false);
            return;
          }
          if (res.card) {
            setDeck(prev => [res.card, ...prev]);
            setNewWordInput('');
            showToast(`Слово "${res.card.english}" добавлено! 🚀`, 'success');
          }
        } catch (err) {
          showToast('Не удалось добавить слово', 'error');
        } finally { setIsGenerating(false); }
      };

      const handleConfirmAddTranslation = () => {
        if (!duplicateModal) return;
        const { existingCard, newRussian } = duplicateModal;
        
        setDeck(prev => prev.map(c => {
          if (c.id === existingCard.id) {
            const updatedRu = `${c.russian} / ${newRussian}`;
            return { ...c, russian: updatedRu };
          }
          return c;
        }));

        showToast(`Новый вариант перевода добавлен к слову "${existingCard.english}"! 🤝`, 'success');
        setDuplicateModal(null);
        setNewWordInput('');
      };

      const handleBulkAddAuto = async () => {
        const rawLines = bulkInput.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        if (rawLines.length === 0) return;
        setIsBulkProcessing(true);
        try {
          const newCards = [];
          let updatedDeck = [...deck];
          for (let i = 0; i < rawLines.length; i++) {
            const res = await processInputLine(rawLines[i], updatedDeck);
            if (res.card) {
              newCards.push(res.card);
              updatedDeck.unshift(res.card);
            } else if (res.isDuplicate) {
              updatedDeck = updatedDeck.map(c => {
                if (c.id === res.existingCard.id) {
                  return { ...c, russian: `${c.russian} / ${res.newRussian}` };
                }
                return c;
              });
            }
          }
          if (newCards.length > 0) {
            setDeck(updatedDeck);
          }
          setBulkInput('');
          setIsBulkAddOpen(false);
          showToast(`Массовая обработка завершена! 🚀`, 'success');
        } catch (err) {
          showToast('Ошибка при загрузке', 'error');
        } finally { setIsBulkProcessing(false); }
      };

      const handleSkip = () => {
        if (sessionQueue.length <= 1) return;
        setIsFlipped(false);
        setSessionQueue(prev => {
          const currentId = prev[currentCardIndex];
          const updated = prev.filter((_, idx) => idx !== currentCardIndex);
          return [...updated, currentId];
        });
      };

      const handleDone = () => {
        if (sessionQueue.length === 0) return;
        setIsFlipped(false);
        setSessionQueue(prev => prev.filter((_, idx) => idx !== currentCardIndex));
      };

      const handleMastered = (cardToMaster = currentCard) => {
        if (!cardToMaster) return;
        setIsFlipped(false);
        if (!masteredCards.some(c => c.id === cardToMaster.id)) {
          setMasteredCards(prev => [cardToMaster, ...prev]);
        }
        showToast(`Выучено: ${cardToMaster.english}!`, 'success');
      };

      const handleRestoreCard = (card) => {
        setMasteredCards(prev => prev.filter(c => c.id !== card.id));
        setSessionQueue(prev => [...prev, card.id]);
      };

      const handleResetSession = () => {
        const masteredIds = new Set(masteredCards.map(m => m.id));
        const activeIds = deck.filter(c => !masteredIds.has(c.id)).map(c => c.id);
        setSessionQueue(activeIds);
        setCurrentCardIndex(0);
        setIsFlipped(false);
      };

      const handleShuffleSession = () => {
        if (sessionQueue.length <= 1) return;
        setIsFlipped(false);
        setSessionQueue(prev => {
          const shuffled = [...prev];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          return shuffled;
        });
      };

      const handleSpeak = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/—/g, ' ');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = 0.88;
        window.speechSynthesis.speak(utterance);
      };

      const handleSaveEditedCard = (e) => {
        e.preventDefault();
        if (!editingCard) return;
        const updatedCard = {
          ...editingCard,
          english: editingCard.english.trim(),
          russian: editingCard.russian.trim(),
          transcription: formatTranscription(editingCard.english.trim())
        };
        setDeck(prev => prev.map(c => c.id === updatedCard.id ? updatedCard : c));
        setMasteredCards(prev => prev.map(c => c.id === updatedCard.id ? updatedCard : c));
        setEditingCard(null);
      };

      useEffect(() => {
        const masteredIds = new Set(masteredCards.map(m => m.id));
        const activeDeck = deck.filter(c => !masteredIds.has(c.id));
        setSessionQueue(prev => {
          const validIds = new Set(activeDeck.map(c => c.id));
          const filtered = prev.filter(id => validIds.has(id));
          if (filtered.length === 0 && activeDeck.length > 0) return activeDeck.map(c => c.id);
          return filtered;
        });
      }, [deck, masteredCards]);

      const filteredDeck = deck.filter(c => (c.english || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.russian || '').toLowerCase().includes(searchTerm.toLowerCase()));
      const filteredMastered = masteredCards.filter(c => (c.english || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.russian || '').toLowerCase().includes(searchTerm.toLowerCase()));

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100 pt-safe pb-28">
          
          {toast && (
            <div className={`fixed top-safe right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl backdrop-blur-md border transition-all duration-300 animate-bounce-short max-w-md mt-4 ${
              toast.type === 'error' ? 'bg-red-950/90 text-red-200 border-red-800' : 
              toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-800' : 
              'bg-slate-800/90 text-blue-200 border-slate-700'
            }`}>
              <Icon name={toast.type === 'error' ? 'alert-circle' : toast.type === 'success' ? 'check-circle-2' : 'info'} className="w-5 h-5 shrink-0" />
              <span className="text-xs sm:text-sm font-medium">{toast.message}</span>
            </div>
          )}

          <header className="border-b border-slate-800/80 bg-slate-900/85 backdrop-blur-xl sticky top-0 z-40 px-4 py-3">
            <div className="max-w-4xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-blue-500/20 shrink-0">
                  <Icon name="sparkles" className="w-4 h-4 text-white" />
                </div>
                <div>
                  <h1 className="font-bold text-sm sm:text-base leading-tight text-white">
                    LinguaCards
                  </h1>
                  <p className="text-[10px] sm:text-[11px] text-slate-400 font-medium">Профиль: <span className="text-emerald-400 font-bold">{username}</span></p>
                </div>
              </div>
            </div>
          </header>

          {activeTab !== 'settings' && activeTab !== 'manual' && (
            <div className="bg-slate-900/40 border-b border-slate-800/60 py-3 px-4 sm:px-6">
              <div className="max-w-3xl mx-auto flex flex-col gap-3">
                <form onSubmit={handleAddWordAutomatic} className="flex flex-col sm:flex-row gap-2.5">
                  <div className="relative flex-grow">
                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                      <Icon name="plus-circle" className="w-5 h-5" />
                    </div>
                    <input
                      type="text"
                      value={newWordInput}
                      onChange={(e) => setNewWordInput(e.target.value)}
                      placeholder="Слово, глагол (например: write) или пара..."
                      className="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                  
                  <div className="flex items-center gap-2">
                    <button type="submit" disabled={isGenerating || !newWordInput.trim()} className="flex-1 sm:flex-none px-5 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-medium text-sm rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 disabled:opacity-50">
                      {isGenerating ? <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : <Icon name="wand-2" className="w-4 h-4" />}
                      <span>Добавить</span>
                    </button>
                    <button type="button" onClick={() => setIsBulkAddOpen(true)} className="px-3.5 py-2.5 bg-indigo-950/80 hover:bg-indigo-900 text-indigo-300 font-medium text-sm rounded-xl border border-indigo-800/60 transition-all flex items-center gap-1.5 shrink-0">
                      <Icon name="list-plus" className="w-4 h-4" /> <span>Списком</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <main className="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">

            {/* ВКЛАДКА: УЧЕБА */}
            {activeTab === 'study' && (
              <div className="flex flex-col items-center justify-center max-w-lg mx-auto w-full py-2">
                <div className="w-full flex items-center justify-between mb-4 px-2">
                  <span className="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 border border-slate-700">
                    Осталось: <strong className="text-blue-400">{sessionQueue.length}</strong>
                  </span>
                  <div className="flex items-center gap-3">
                    {sessionQueue.length > 1 && (
                      <button onClick={handleShuffleSession} className="text-xs text-slate-300 hover:text-indigo-400 flex items-center gap-1 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800">
                        <Icon name="shuffle" className="w-3.5 h-3.5" /> Перемешать
                      </button>
                    )}
                    {sessionQueue.length < deck.length && (
                      <button onClick={handleResetSession} className="text-xs text-slate-400 hover:text-blue-400 flex items-center gap-1">
                        <Icon name="rotate-ccw" className="w-3.5 h-3.5" /> Сбросить
                      </button>
                    )}
                  </div>
                </div>

                {sessionQueue.length === 0 ? (
                  <div className="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-8 text-center shadow-xl my-8">
                    <div className="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/20">
                      <Icon name="party-popper" className="w-8 h-8" />
                    </div>
                    <h3 className="text-xl font-bold text-slate-100 mb-2">Все активные карточки пройдены!</h3>
                    <button onClick={handleResetSession} className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium mt-4">Повторить сессию</button>
                  </div>
                ) : (
                  currentCard && (
                    <div className="w-full flex flex-col items-center">
                      <div onClick={() => setIsFlipped(!isFlipped)} className="w-full h-80 sm:h-96 perspective-1000 cursor-pointer group select-none">
                        <div className={`relative w-full h-full duration-500 transform-style-3d transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                          
                          <div className="absolute inset-0 w-full h-full rounded-3xl bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 border border-slate-700/60 p-6 sm:p-8 flex flex-col justify-between backface-hidden shadow-2xl">
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 bg-slate-800/80 px-3 py-1 rounded-full">Русский</span>
                              <button onClick={(e) => { e.stopPropagation(); handleSpeak(currentCard.english); }} className="p-2.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all border border-slate-700">
                                <Icon name="volume-2" className="w-5 h-5 text-blue-400" />
                              </button>
                            </div>
                            <div className="my-auto text-center px-4">
                              <h2 className="text-2xl sm:text-3xl font-extrabold text-white">{currentCard.russian}</h2>
                            </div>
                            <div className="text-center text-xs text-slate-400 flex items-center justify-center gap-1">
                              <Icon name="mouse-pointer-click" className="w-3.5 h-3.5" /> Нажмите для переворота
                            </div>
                          </div>

                          <div className="absolute inset-0 w-full h-full rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950 border border-indigo-500/40 p-6 sm:p-8 flex flex-col justify-between rotate-y-180 backface-hidden shadow-2xl overflow-y-auto">
                            <div className="flex items-center justify-between shrink-0">
                              <span className="text-xs font-semibold uppercase tracking-wider text-indigo-300 bg-indigo-950/80 px-3 py-1 rounded-full">English</span>
                              <button onClick={(e) => { e.stopPropagation(); handleSpeak(currentCard.english); }} className="p-2.5 rounded-full bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/40 transition-all border border-indigo-500/30">
                                <Icon name="volume-2" className="w-5 h-5 text-indigo-300" />
                              </button>
                            </div>

                            <div className="my-auto text-center py-2">
                              {currentCard.formsDetails ? (
                                <div className="space-y-3">
                                  <h2 className="text-xl sm:text-2xl font-black text-white">{currentCard.english}</h2>
                                  <div className="grid grid-cols-3 gap-2 pt-2 border-t border-indigo-900/60 text-left">
                                    <div className="bg-indigo-950/60 p-2 rounded-xl border border-indigo-900/40">
                                      <div className="text-xs font-bold text-indigo-300">{currentCard.formsDetails.f1.word}</div>
                                      <div className="text-[10px] font-mono text-slate-400">{currentCard.formsDetails.f1.tr}</div>
                                      <div className="text-[10px] text-slate-300 mt-1 truncate">{currentCard.formsDetails.f1.ru}</div>
                                    </div>
                                    <div className="bg-indigo-950/60 p-2 rounded-xl border border-indigo-900/40">
                                      <div className="text-xs font-bold text-indigo-300">{currentCard.formsDetails.f2.word}</div>
                                      <div className="text-[10px] font-mono text-slate-400">{currentCard.formsDetails.f2.tr}</div>
                                      <div className="text-[10px] text-slate-300 mt-1 truncate">{currentCard.formsDetails.f2.ru}</div>
                                    </div>
                                    <div className="bg-indigo-950/60 p-2 rounded-xl border border-indigo-900/40">
                                      <div className="text-xs font-bold text-indigo-300">{currentCard.formsDetails.f3.word}</div>
                                      <div className="text-[10px] font-mono text-slate-400">{currentCard.formsDetails.f3.tr}</div>
                                      <div className="text-[10px] text-slate-300 mt-1 truncate">{currentCard.formsDetails.f3.ru}</div>
                                    </div>
                                  </div>
                                </div>
                              ) : (
                                <>
                                  <h2 className="text-3xl sm:text-4xl font-black text-white mb-1">{currentCard.english}</h2>
                                  <p className="text-xs font-mono text-indigo-300 bg-indigo-950/60 px-3 py-1 rounded-lg inline-block mb-3 border border-indigo-800/40">{currentCard.transcription}</p>
                                  <p className="text-xs text-slate-300 italic">"{currentCard.exampleEn}"</p>
                                </>
                              )}
                            </div>

                            <div className="text-center text-xs text-indigo-300/70 shrink-0">Нажмите обратно</div>
                          </div>

                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-3 w-full mt-6">
                        <button onClick={handleSkip} className="p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex flex-col items-center"><span>Пропустить</span></button>
                        <button onClick={handleDone} className="p-3 rounded-2xl bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white text-xs font-semibold flex flex-col items-center"><span>Готово</span></button>
                        <button onClick={() => handleMastered(currentCard)} className="p-3 rounded-2xl bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white text-xs font-semibold flex flex-col items-center"><span>Выучил</span></button>
                      </div>
                    </div>
                  )
                )}
              </div>
            )}

            {/* ВКЛАДКА: СЛОВА */}
            {activeTab === 'deck' && (
              <div className="space-y-4">
                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                  <h2 className="text-lg font-bold text-white">Все слова ({deck.length})</h2>
                  <input
                    type="text"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Поиск..."
                    className="w-full sm:w-64 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200"
                  />
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {filteredDeck.map((card) => {
                    const isMastered = masteredCards.some(m => m.id === card.id);
                    return (
                      <div key={card.id} className="bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                        <div className="flex justify-between items-start gap-2">
                          <div className="w-full">
                            <h3 className="text-base font-bold text-white flex items-center justify-between gap-2">
                              <span>{card.english}</span>
                              <button onClick={() => handleSpeak(card.english)} className="text-slate-400 hover:text-indigo-400 shrink-0">
                                <Icon name="volume-2" className="w-4 h-4" />
                              </button>
                            </h3>

                            {card.formsDetails ? (
                              <div className="grid grid-cols-3 gap-2 mt-2 pt-2 border-t border-slate-800 text-left">
                                <div className="bg-slate-950 p-2 rounded-lg border border-slate-800">
                                  <div className="text-[11px] font-bold text-blue-400">{card.formsDetails.f1.word}</div>
                                  <div className="text-[10px] font-mono text-slate-400">{card.formsDetails.f1.tr}</div>
                                  <div className="text-[10px] text-slate-300 mt-0.5 truncate">{card.formsDetails.f1.ru}</div>
                                </div>
                                <div className="bg-slate-950 p-2 rounded-lg border border-slate-800">
                                  <div className="text-[11px] font-bold text-blue-400">{card.formsDetails.f2.word}</div>
                                  <div className="text-[10px] font-mono text-slate-400">{card.formsDetails.f2.tr}</div>
                                  <div className="text-[10px] text-slate-300 mt-0.5 truncate">{card.formsDetails.f2.ru}</div>
                                </div>
                                <div className="bg-slate-950 p-2 rounded-lg border border-slate-800">
                                  <div className="text-[11px] font-bold text-blue-400">{card.formsDetails.f3.word}</div>
                                  <div className="text-[10px] font-mono text-slate-400">{card.formsDetails.f3.tr}</div>
                                  <div className="text-[10px] text-slate-300 mt-0.5 truncate">{card.formsDetails.f3.ru}</div>
                                </div>
                              </div>
                            ) : (
                              <div className="flex items-center justify-between mt-1">
                                <span className="text-xs font-mono text-slate-400">{card.transcription}</span>
                                <span className="text-xs font-medium text-blue-400 text-right">{card.russian}</span>
                              </div>
                            )}
                          </div>
                        </div>

                        {card.formsDetails && (
                          <div className="mt-2 text-xs font-medium text-blue-400">Перевод: {card.russian}</div>
                        )}

                        <div className="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
                          <div className="flex items-center gap-3">
                            <button onClick={() => handleMastered(card)} className={`${isMastered ? 'text-emerald-400 font-semibold' : 'text-indigo-400 hover:text-indigo-300'}`}>
                              {isMastered ? '✓ Выучено' : 'В выученные'}
                            </button>
                            <button onClick={() => setEditingCard({ ...card })} className="text-slate-400 hover:text-blue-400 flex items-center gap-1">
                              <Icon name="key" className="w-3.5 h-3.5" /> Изменить
                            </button>
                          </div>
                          <button onClick={() => {
                            setDeck(prev => prev.filter(c => c.id !== card.id));
                            setMasteredCards(prev => prev.filter(c => c.id !== card.id));
                          }} className="text-red-400 hover:text-red-300">Удалить</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ВКЛАДКА: ВЫУЧЕНО */}
            {activeTab === 'mastered' && (
              <div className="space-y-4">
                <div className="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <h2 className="text-lg font-bold text-emerald-400">Выученные слова ({masteredCards.length})</h2>
                  {masteredCards.length > 0 && (
                    <button onClick={handleRestoreAllMastered} className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-semibold flex items-center gap-2 shadow-lg transition-all">
                      <Icon name="rotate-ccw" className="w-4 h-4" /> Вернуть все в карточки
                    </button>
                  )}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {filteredMastered.map((card) => (
                    <div key={card.id} className="bg-slate-900/60 border border-emerald-950 rounded-xl p-4 flex justify-between items-center">
                      <div>
                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                          {card.english}
                        </h3>
                        <span className="text-xs text-emerald-400 block mt-1">{card.russian}</span>
                      </div>
                      <button onClick={() => handleRestoreCard(card)} className="text-blue-400 hover:text-blue-300 text-xs font-medium">Вернуть в учебу</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ВКЛАДКА: ИНСТРУКЦИЯ */}
            {activeTab === 'manual' && (
              <div className="max-w-2xl mx-auto w-full space-y-6 py-2">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
                  <h2 className="text-xl font-extrabold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                    <Icon name="help-circle" className="w-6 h-6 text-blue-400" /> Инструкция
                  </h2>
                  <div className="space-y-3 text-xs text-slate-300">
                    <p>✨ <strong>Неправильные глаголы:</strong> автоматически записываются в формате <code className="bg-slate-950 px-2 py-0.5 rounded text-blue-400 font-mono">write — wrote — written</code>. Под каждой формой отображается индивидуальная транскрипция и перевод.</p>
                    <p>🔍 <strong>Проверка дубликатов:</strong> если слово уже есть в колоде, но с другим переводом, приложение предложит добавить новый вариант.</p>
                  </div>
                </div>
              </div>
            )}

            {/* ВКЛАДКА: НАСТРОЙКИ */}
            {activeTab === 'settings' && (
              <div className="max-w-md mx-auto w-full space-y-4 py-2">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
                  <div>
                    <h3 className="text-base font-bold text-white mb-2">Настройки профиля</h3>
                    <label className="block text-xs text-slate-400 mb-1">Ваше имя / логин:</label>
                    <input
                      type="text"
                      value={username}
                      onChange={(e) => {
                        setUsername(e.target.value);
                        localStorage.setItem('lingua_username', e.target.value);
                      }}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* НАВИГАЦИЯ СНИЗУ */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-xl border-t border-slate-800 flex items-center justify-around px-2 py-2 pb-safe shadow-2xl">
            <button onClick={() => setActiveTab('study')} className={`flex flex-col items-center flex-1 py-1 transition-all ${activeTab === 'study' ? 'text-blue-400 font-bold scale-105' : 'text-slate-500 hover:text-slate-300'}`}>
              <Icon name="layers" className="w-5 h-5 mb-0.5" /><span className="text-[10px]">Учеба</span>
            </button>
            <button onClick={() => setActiveTab('deck')} className={`flex flex-col items-center flex-1 py-1 transition-all ${activeTab === 'deck' ? 'text-blue-400 font-bold scale-105' : 'text-slate-500 hover:text-slate-300'}`}>
              <Icon name="book-open" className="w-5 h-5 mb-0.5" /><span className="text-[10px]">Слова ({deck.length})</span>
            </button>
            <button onClick={() => setActiveTab('mastered')} className={`flex flex-col items-center flex-1 py-1 transition-all ${activeTab === 'mastered' ? 'text-blue-400 font-bold scale-105' : 'text-slate-500 hover:text-slate-300'}`}>
              <Icon name="trophy" className="w-5 h-5 mb-0.5" /><span className="text-[10px]">Выучено ({masteredCards.length})</span>
            </button>
            <button onClick={() => setActiveTab('manual')} className={`flex flex-col items-center flex-1 py-1 transition-all ${activeTab === 'manual' ? 'text-blue-400 font-bold scale-105' : 'text-slate-500 hover:text-slate-300'}`}>
              <Icon name="help-circle" className="w-5 h-5 mb-0.5" /><span className="text-[10px]">Помощь</span>
            </button>
            <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center flex-1 py-1 transition-all ${activeTab === 'settings' ? 'text-blue-400 font-bold scale-105' : 'text-slate-500 hover:text-slate-300'}`}>
              <Icon name="settings" className="w-5 h-5 mb-0.5" /><span className="text-[10px]">Настройки</span>
            </button>
          </nav>

          {duplicateModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 text-center shadow-2xl">
                <div className="w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center mx-auto border border-amber-500/20">
                  <Icon name="alert-circle" className="w-6 h-6" />
                </div>
                <h3 className="text-base font-bold text-white">Слово уже существует!</h3>
                <p className="text-xs text-slate-300 leading-relaxed">
                  Слово <strong className="text-blue-400">{duplicateModal.existingCard.english}</strong> уже есть в вашей колоде.<br/>
                  Текущий перевод: <span className="text-slate-400">"{duplicateModal.existingCard.russian}"</span><br/>
                  Новый перевод: <span className="text-emerald-400">"{duplicateModal.newRussian}"</span>
                </p>
                <p className="text-xs text-slate-400">Добавить новый вариант перевода к имеющейся карточке?</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setDuplicateModal(null)} className="flex-1 py-2.5 text-xs text-slate-400 hover:text-white bg-slate-800 rounded-xl">Отмена</button>
                  <button onClick={handleConfirmAddTranslation} className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs rounded-xl">
                    Добавить вариант
                  </button>
                </div>
              </div>
            </div>
          )}

          {editingCard && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 relative">
                <button onClick={() => setEditingCard(null)} className="absolute top-4 right-4 text-slate-500 hover:text-slate-300"><Icon name="x" className="w-5 h-5" /></button>
                <h3 className="text-base font-bold text-white mb-4">Редактировать слово</h3>
                <form onSubmit={handleSaveEditedCard} className="space-y-3">
                  <input type="text" required value={editingCard.english} onChange={(e) => setEditingCard({ ...editingCard, english: e.target.value })} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100" />
                  <input type="text" required value={editingCard.russian} onChange={(e) => setEditingCard({ ...editingCard, russian: e.target.value })} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100" />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setEditingCard(null)} className="px-3 py-2 text-xs text-slate-400">Отмена</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-xl">Сохранить</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isBulkAddOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 relative flex flex-col">
                <button onClick={() => setIsBulkAddOpen(false)} className="absolute top-4 right-4 text-slate-500 hover:text-slate-300"><Icon name="x" className="w-5 h-5" /></button>
                <h3 className="text-lg font-bold text-white mb-2">Массовая загрузка</h3>
                <textarea rows={6} value={bulkInput} onChange={(e) => setBulkInput(e.target.value)} placeholder="write — писать" className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono text-slate-100 mb-4 resize-none" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setIsBulkAddOpen(false)} className="px-4 py-2 text-xs text-slate-400">Отмена</button>
                  <button onClick={handleBulkAddAuto} disabled={isBulkProcessing || !bulkInput.trim()} className="px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-xl flex items-center gap-2">Загрузить</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
