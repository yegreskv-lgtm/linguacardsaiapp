<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LinguaCards" />
  <title>LinguaCards AI — Умный тренажер слов</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f6ff',
              100: '#e0edff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          },
          animation: {
            'bounce-short': 'bounceShort 0.5s ease-in-out',
          },
          keyframes: {
            bounceShort: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-6px)' }
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- React & ReactDOM UMD + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
  </style>
</head>
<body class="h-full min-h-screen bg-slate-950 text-slate-100 flex flex-col selection:bg-brand-500 selection:text-white">
  
  <div id="root" class="flex-grow flex flex-col"></div>

  <!-- Firebase Modular SDK Imports for React -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    window.FirebaseSDK = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, setDoc, onSnapshot };
  </script>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const iconProps = { xmlns: "http://www.w3.org/2000/svg", width: "24", height: "24", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className };
      switch (name) {
        case 'sparkles': return <svg {...iconProps}><path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>;
        case 'settings': return <svg {...iconProps}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
        case 'layers': return <svg {...iconProps}><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 12.5"/><path d="m22 17.5-8.58 3.91a2 2 0 0 1-1.66 0L3.18 17.5"/></svg>;
        case 'book-open': return <svg {...iconProps}><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>;
        case 'trophy': return <svg {...iconProps}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>;
        case 'plus-circle': return <svg {...iconProps}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>;
        case 'wand-2': return <svg {...iconProps}><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.21 1.21 0 0 0 1.72 0L21.64 5.36a1.21 1.21 0 0 0 0-1.72z"/><path d="m14 7 3 3"/><path d="M5 6v1"/><path d="M19 17v1"/><path d="M10 2v1"/><path d="M7 8H6"/><path d="M21 12h-1"/></svg>;
        case 'key': return <svg {...iconProps}><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>;
        case 'trash-2': return <svg {...iconProps}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
        case 'shuffle': return <svg {...iconProps}><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l.8 1.1"/><path d="M14.4 14.2l.8 1.1c.8 1.1 2 1.7 3.3 1.7H22"/><path d="m18 18 4 4-4 4"/></svg>;
        case 'cloud': return <svg {...iconProps}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>;
        case 'clipboard': return <svg {...iconProps}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>;
        case 'alert-circle': return <svg {...iconProps}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
        case 'check-circle-2': return <svg {...iconProps}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
        case 'info': return <svg {...iconProps}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;
        case 'rotate-ccw': return <svg {...iconProps}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        case 'party-popper': return <svg {...iconProps}><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24 2.24"/><path d="M8 16 16 8"/><path d="m11 13 8 8"/></svg>;
        case 'mouse-pointer-click': return <svg {...iconProps}><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></svg>;
        case 'volume-2': return <svg {...iconProps}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
        case 'search': return <svg {...iconProps}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        case 'x': return <svg {...iconProps}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        case 'download': return <svg {...iconProps}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
        case 'upload': return <svg {...iconProps}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>;
        case 'list-plus': return <svg {...iconProps}><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg>;
        default: return null;
      }
    };

    const INITIAL_CARDS = [
      {
        id: "card-1",
        english: "Serendipity",
        russian: "Счастливая случайность",
        transcription: "[ˌserənˈdɪpəti]",
        exampleEn: "Finding this rare book was pure serendipity.",
        exampleRu: "Находка этой редкой книги была чистой случайностью.",
        createdAt: Date.now() - 500000
      }
    ];

    const SMART_DICTIONARY = {
      "ass": { en: "Ass", ru: "Осел / Упрямец", tr: "[æs]" },
      "talk": { en: "Talk", ru: "Разговаривать", tr: "[tɔːk]" },
      "say": { en: "Say", ru: "Говорить, сказать", tr: "[seɪ]" },
      "speak": { en: "Speak", ru: "Говорить", tr: "[spiːk]" },
      "teacher": { en: "Teacher", ru: "Учитель", tr: "[ˈtiːtʃər]" },
      "egg": { en: "Egg", ru: "Яйцо", tr: "[eɡ]" },
      "opportunity": { en: "Opportunity", ru: "Возможность", tr: "[ˌɒpəˈtjuːnəti]" },
      "success": { en: "Success", ru: "Успех", tr: "[səkˈses]" }
    };

    function App() {
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'lingua-cards-app';
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

      const [syncId, setSyncId] = useState(() => {
        const saved = localStorage.getItem('lingua_sync_id');
        if (saved) return saved;
        const generated = 'lingua_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('lingua_sync_id', generated);
        return generated;
      });

      const [inputSyncId, setInputSyncId] = useState('');
      const [isCloudConnected, setIsCloudConnected] = useState(false);

      const [deck, setDeck] = useState(() => {
        const saved = localStorage.getItem('lingua_deck');
        return saved ? JSON.parse(saved) : INITIAL_CARDS;
      });

      const [masteredCards, setMasteredCards] = useState(() => {
        const saved = localStorage.getItem('lingua_mastered');
        return saved ? JSON.parse(saved) : [];
      });

      const [sessionQueue, setSessionQueue] = useState([]);
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const [activeTab, setActiveTab] = useState('study');
      const [newWordInput, setNewWordInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [toast, setToast] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      
      const [isBulkAddOpen, setIsBulkAddOpen] = useState(false);
      const [bulkInput, setBulkInput] = useState('');
      const [isBulkProcessing, setIsBulkProcessing] = useState(false);
      const [editingCard, setEditingCard] = useState(null);

      // Инициализация Firebase Auth
      useEffect(() => {
        if (!firebaseConfig || !window.FirebaseSDK) return;
        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken } = window.FirebaseSDK;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) { console.error(e); }
        };
        initAuth();
      }, []);

      // Синхронизация в реальном времени через облако
      useEffect(() => {
        if (!firebaseConfig || !window.FirebaseSDK || !syncId) return;
        const { initializeApp, getFirestore, doc, onSnapshot, setDoc } = window.FirebaseSDK;
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, 'artifacts', appId, 'users', syncId, 'data', 'cloud_deck');

        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (Array.isArray(data.deck)) {
              setDeck(data.deck);
            }
            if (Array.isArray(data.mastered)) {
              setMasteredCards(data.mastered);
            }
            setIsCloudConnected(true);
          } else {
            setDoc(docRef, { deck, mastered: masteredCards, updatedAt: Date.now() }, { merge: true });
            setIsCloudConnected(true);
          }
        }, () => setIsCloudConnected(false));

        return () => unsubscribe();
      }, [syncId]);

      const saveToCloud = async (targetId, newDeck, newMastered) => {
        if (!targetId || !firebaseConfig || !window.FirebaseSDK) return;
        try {
          const { initializeApp, getFirestore, doc, setDoc } = window.FirebaseSDK;
          const app = initializeApp(firebaseConfig);
          const db = getFirestore(app);
          const docRef = doc(db, 'artifacts', appId, 'users', targetId, 'data', 'cloud_deck');
          await setDoc(docRef, { deck: newDeck, mastered: newMastered, updatedAt: Date.now() }, { merge: true });
        } catch (e) { console.error(e); }
      };

      useEffect(() => {
        localStorage.setItem('lingua_deck', JSON.stringify(deck));
        if (syncId) saveToCloud(syncId, deck, masteredCards);
      }, [deck]);

      useEffect(() => {
        localStorage.setItem('lingua_mastered', JSON.stringify(masteredCards));
        if (syncId) saveToCloud(syncId, deck, masteredCards);
      }, [masteredCards]);

      const handleConnectSyncId = (e) => {
        e.preventDefault();
        const cleanId = inputSyncId.trim();
        if (!cleanId) return;
        setSyncId(cleanId);
        localStorage.setItem('lingua_sync_id', cleanId);
        setInputSyncId('');
        showToast(`Успешно подключено к ключу: ${cleanId}! 🎉`, 'success');
      };

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const currentCard = useMemo(() => {
        if (sessionQueue.length === 0) return null;
        const cardId = sessionQueue[currentCardIndex] || sessionQueue[0];
        return deck.find(c => c.id === cardId) || null;
      }, [sessionQueue, currentCardIndex, deck]);

      const formatTranscription = (w) => {
        const cleaned = w.replace(/[^a-zA-Z]/g, '');
        if (!cleaned) return '[—]';
        return `[${cleaned.toLowerCase()}]`;
      };

      const processInputLine = async (rawInput) => {
        const line = rawInput.trim();
        if (!line) return null;

        const delimiterMatch = line.match(/\s*[-—=:|\t]\s*/);
        let part1 = line;
        let part2 = '';

        if (delimiterMatch) {
          const parts = line.split(delimiterMatch[0]);
          part1 = parts[0]?.trim() || '';
          part2 = parts.slice(1).join(' ').trim() || '';
        }

        let english = '';
        let russian = '';

        if (part2) {
          const isPart1Ru = /[а-яё]/i.test(part1);
          if (isPart1Ru) {
            russian = part1;
            english = part2;
          } else {
            english = part1;
            russian = part2;
          }
        } else {
          const lowerKey = part1.toLowerCase();
          if (SMART_DICTIONARY[lowerKey]) {
            const item = SMART_DICTIONARY[lowerKey];
            return {
              english: item.en,
              russian: item.ru,
              transcription: item.tr,
              exampleEn: `This is an example with ${item.en}.`,
              exampleRu: `Это пример со словом ${item.ru}.`
            };
          }

          const isRu = /[а-яё]/i.test(part1);
          english = part1;
          russian = part1;

          try {
            const langPair = isRu ? 'ru|en' : 'en|ru';
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(part1)}&langpair=${langPair}`);
            const data = await res.json();
            if (data?.responseData?.translatedText) {
              const translated = data.responseData.translatedText;
              if (isRu) {
                english = translated;
                russian = part1;
              } else {
                english = part1;
                russian = translated;
              }
            }
          } catch (e) { console.error(e); }
        }

        return {
          english: english.charAt(0).toUpperCase() + english.slice(1),
          russian: russian.charAt(0).toUpperCase() + russian.slice(1),
          transcription: formatTranscription(english),
          exampleEn: `Example sentence using "${english}".`,
          exampleRu: `Пример перевода: "${russian}".`
        };
      };

      const handleAddWordAutomatic = async (e) => {
        e?.preventDefault();
        const query = newWordInput.trim();
        if (!query) return;

        setIsGenerating(true);
        try {
          const data = await processInputLine(query);
          if (!data) return;

          const newCard = {
            id: 'card-' + Date.now(),
            ...data,
            createdAt: Date.now()
          };

          setDeck(prev => [newCard, ...prev]);
          setNewWordInput('');
          showToast(`Слово "${newCard.english}" добавлено! 🎉`, 'success');
        } catch (err) {
          showToast('Не удалось добавить слово', 'error');
        } finally {
          setIsGenerating(false);
        }
      };

      const handleBulkAddAuto = async () => {
        const rawLines = bulkInput.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        if (rawLines.length === 0) {
          showToast('Введите список слов', 'error');
          return;
        }

        setIsBulkProcessing(true);
        try {
          const newCards = [];
          for (let i = 0; i < rawLines.length; i++) {
            const data = await processInputLine(rawLines[i]);
            if (data) {
              newCards.push({
                id: 'card-' + (Date.now() + i),
                ...data,
                createdAt: Date.now() + i
              });
            }
          }

          setDeck(prev => [...newCards, ...prev]);
          setBulkInput('');
          setIsBulkAddOpen(false);
          showToast(`Успешно загружено ${newCards.length} слов! 🚀`, 'success');
        } catch (err) {
          showToast('Ошибка при массовой загрузке', 'error');
        } finally {
          setIsBulkProcessing(false);
        }
      };

      const handleSkip = () => {
        if (sessionQueue.length <= 1) return;
        setIsFlipped(false);
        setSessionQueue(prev => {
          const currentId = prev[currentCardIndex];
          const updated = prev.filter((_, idx) => idx !== currentCardIndex);
          return [...updated, currentId];
        });
      };

      const handleDone = () => {
        if (sessionQueue.length === 0) return;
        setIsFlipped(false);
        setSessionQueue(prev => prev.filter((_, idx) => idx !== currentCardIndex));
        showToast('Карточка пройдена! 👍', 'info');
      };

      const handleMastered = (cardToMaster = currentCard) => {
        if (!cardToMaster) return;
        setIsFlipped(false);
        if (!masteredCards.some(c => c.id === cardToMaster.id)) {
          setMasteredCards(prev => [cardToMaster, ...prev]);
        }
        showToast(`Слово "${cardToMaster.english}" перенесено в выученные и скрыто из учебы! 🎉`, 'success');
      };

      const handleRestoreCard = (card) => {
        setMasteredCards(prev => prev.filter(c => c.id !== card.id));
        setSessionQueue(prev => [...prev, card.id]);
        showToast('Слово возвращено в активную колоду учебы', 'info');
      };

      const handleResetSession = () => {
        const masteredIds = new Set(masteredCards.map(m => m.id));
        const activeIds = deck.filter(c => !masteredIds.has(c.id)).map(c => c.id);
        setSessionQueue(activeIds);
        setCurrentCardIndex(0);
        setIsFlipped(false);
        showToast('Сессия перезапущена!', 'info');
      };

      const handleShuffleSession = () => {
        if (sessionQueue.length <= 1) return;
        setIsFlipped(false);
        setSessionQueue(prev => {
          const shuffled = [...prev];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          return shuffled;
        });
        showToast('Карточки перемешаны! 🔀', 'info');
      };

      const handleSpeak = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.88;
        window.speechSynthesis.speak(utterance);
      };

        e.preventDefault();
        if (!editingCard) return;

        const updatedEnglish = editingCard.english.trim();
        const updatedRussian = editingCard.russian.trim();
        const updatedTranscription = formatTranscription(updatedEnglish);

        const updatedCard = {
          ...editingCard,
          english: updatedEnglish,
          russian: updatedRussian,
          transcription: updatedTranscription
        };

        setDeck(prev => prev.map(c => c.id === updatedCard.id ? updatedCard : c));
        setMasteredCards(prev => prev.map(c => c.id === updatedCard.id ? updatedCard : c));
        setEditingCard(null);
        showToast('Карточка успешно обновлена! ✏️', 'success');
      };

      const handleClearAllWords = () => {
        if (window.confirm('Вы уверены, что хотите удалить ВСЕ слова? Это действие нельзя отменить.')) {
          setDeck([]);
          setMasteredCards([]);
          setSessionQueue([]);
          showToast('Все слова удалены', 'info');
        }
      };

      const handleExportDeck = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ deck, masteredCards }, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `lingua_cards_backup.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Колода экспортирована!', 'success');
      };

      const handleImportDeck = (e) => {
        const fileReader = new FileReader();
        fileReader.readAsText(e.target.files[0], "UTF-8");
        fileReader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed.deck)) setDeck(parsed.deck);
            if (Array.isArray(parsed.masteredCards)) setMasteredCards(parsed.masteredCards);
            showToast('Колода импортирована!', 'success');

        };

      useEffect(() => {
        const masteredIds = new Set(masteredCards.map(m => m.id));
        const activeDeck = deck.filter(c => !masteredIds.has(c.id));
        
        setSessionQueue(prev => {
          const validIds = new Set(activeDeck.map(c => c.id));
          const filtered = prev.filter(id => validIds.has(id));
          if (filtered.length === 0 && activeDeck.length > 0) return activeDeck.map(c => c.id);
          return filtered;
        });
      }, [deck, masteredCards]);

      const filteredDeck = deck.filter(c => (c.english || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.russian || '').toLowerCase().includes(searchTerm.toLowerCase()));
      const filteredMastered = masteredCards.filter(c => (c.english || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.russian || '').toLowerCase().includes(searchTerm.toLowerCase()));

                  <button onClick={() => setActiveTab('mastered')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${activeTab === 'mastered' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>Выучено ({masteredCards.length})</button>
                  <button onClick={() => setActiveTab('settings')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${activeTab === 'settings' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>Настройки</button>

                            <div className="my-auto text-center px-2">

                              <p className="text-xs font-mono text-indigo-300 bg-indigo-950/60 px-3 py-1 rounded-lg inline-block mb-3 border border-indigo-800/40">{currentCard.transcription}</p>
                              <p className="text-xs text-slate-300 italic">"{currentCard.exampleEn}"</p>
                            </div>
                            <div className="text-center text-xs text-indigo-300/70">Нажмите обратно</div>
                          </div>

                      <div className="grid grid-cols-3 gap-3 w-full mt-6">
                        <button onClick={handleSkip} className="p-3 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex flex-col items-center"><span>Пропустить</span></button>
                        <button onClick={handleDone} className="p-3 rounded-2xl bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white text-xs font-semibold flex flex-col items-center"><span>Готово</span></button>
                        <button onClick={() => handleMastered(currentCard)} className="p-3 rounded-2xl bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white text-xs font-semibold flex flex-col items-center"><span>Выучил</span></button>
                      </div>
                    </div>
                  )
                )}
              </div>

            {activeTab === 'deck' && (
              <div className="space-y-4">
                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                  <h2 className="text-lg font-bold text-white">Все слова ({deck.length})</h2>
                  <input

                    onChange={(e) => setSearchTerm(e.target.value)}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">

                    return (

                        <div className="flex justify-between items-start">
                          <div>
                            <h3 className="text-base font-bold text-white flex items-center gap-2">
                              {card.english}
                              <button onClick={() => handleSpeak(card.english)} className="text-slate-500 hover:text-indigo-400">
                                <Icon name="volume-2" className="w-3.5 h-3.5" />

                            </h3>
                            <span className="text-xs font-mono text-slate-400">{card.transcription}</span>
                          </div>
                          <span className="text-sm font-medium text-blue-400">{card.russian}</span>
                        </div>
                        <div className="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-xs">

                            <button onClick={() => setEditingCard({ ...card })} className="text-slate-400 hover:text-blue-400 flex items-center gap-1" title="Редактировать">

                </div>
              </div>
            )}

            {activeTab === 'mastered' && (
              <div className="space-y-4">
                <div className="bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                  <h2 className="text-lg font-bold text-emerald-400">Выученные слова ({masteredCards.length})</h2>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">

                            <Icon name="volume-2" className="w-3.5 h-3.5" />

                        <span className="text-xs font-mono text-slate-400">{card.transcription}</span>
                        <span className="text-xs text-emerald-400 block mt-1">{card.russian}</span>
                      </div>
                      <button onClick={() => handleRestoreCard(card)} className="text-blue-400 hover:text-blue-300 text-xs font-medium">Вернуть в учебу</button>
                    </div>

                </div>
              </div>

            {activeTab === 'settings' && (
              <div className="max-w-md mx-auto w-full space-y-4 py-2">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
                  <div>
                    <h3 className="text-lg font-bold text-white mb-1 flex items-center gap-2">

                    <p className="text-xs text-slate-400">Свяжите ваш компьютер и телефон один раз с помощью ключа. После этого все слова ({deck.length}) будут синхронизироваться автоматически в реальном времени!</p>
                  </div>

                    <div className="flex gap-2">

                      value={editingCard.english}
                      onChange={(e) => setEditingCard({ ...editingCard, english: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Перевод на русский:</label>
                    <input
                      type="text"
                      required
                      value={editingCard.russian}
                      onChange={(e) => setEditingCard({ ...editingCard, russian: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setEditingCard(null)} className="px-3 py-2 text-xs text-slate-400">Отмена</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl">Сохранить</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isBulkAddOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 relative flex flex-col">
                <button onClick={() => setIsBulkAddOpen(false)} className="absolute top-4 right-4 text-slate-500 hover:text-slate-300"><Icon name="x" className="w-5 h-5" /></button>
                <h3 className="text-lg font-bold text-white mb-2">Массовая загрузка списком</h3>
                <p className="text-xs text-slate-400 mb-4">Вставляйте слова по одному в строчку (или парами через дефис, например: <code className="text-indigo-300">car - машина</code>). Транскрипция добавится автоматически!</p>
                
                <textarea
                  rows={6}
                  value={bulkInput}
                  onChange={(e) => setBulkInput(e.target.value)}
                  placeholder="car - машина&#10;house - дом&#10;running&#10;собака"
                  className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono text-slate-100 mb-4 resize-none"
                />

                <div className="flex justify-end gap-2">
                  <button onClick={() => setIsBulkAddOpen(false)} className="px-4 py-2 text-xs text-slate-400">Отмена</button>
                  <button
                    onClick={handleBulkAddAuto}
                    disabled={isBulkProcessing || !bulkInput.trim()}
                    className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl disabled:opacity-50 flex items-center gap-2"
                  >
                    {isBulkProcessing && <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>}
                    <span>{isBulkProcessing ? 'Обрабатываем список...' : 'Запустить авто-импорт'}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/90 backdrop-blur-xl border-t border-slate-800 flex items-center justify-around px-2 py-2 pb-safe">
            <button onClick={() => setActiveTab('study')} className={`flex flex-col items-center flex-1 py-1 ${activeTab === 'study' ? 'text-blue-400' : 'text-slate-500'}`}>
              <Icon name="layers" className="w-5 h-5 mb-1" /><span className="text-[10px]">Учеба</span>
            </button>
            <button onClick={() => setActiveTab('deck')} className={`flex flex-col items-center flex-1 py-1 ${activeTab === 'deck' ? 'text-blue-400' : 'text-slate-500'}`}>
              <Icon name="book-open" className="w-5 h-5 mb-1" /><span className="text-[10px]">Слова</span>
            </button>
            <button onClick={() => setActiveTab('mastered')} className={`flex flex-col items-center flex-1 py-1 ${activeTab === 'mastered' ? 'text-emerald-400' : 'text-slate-500'}`}>
              <Icon name="trophy" className="w-5 h-5 mb-1" /><span className="text-[10px]">Выучено</span>
            </button>
            <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center flex-1 py-1 ${activeTab === 'settings' ? 'text-blue-400' : 'text-slate-500'}`}>
              <Icon name="settings" className="w-5 h-5 mb-1" /><span className="text-[10px]">Настройки</span>
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
