      // Universal Reliable Copy to Clipboard Helper
      const copyToClipboard = (textToCopy, successMessage = 'Скопировано в буфер обмена!') => {
        if (!textToCopy) return;

        const fallbackExecCopy = (str) => {
          try {
            const textArea = document.createElement("textarea");
            textArea.value = str;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.width = "2em";
            textArea.style.height = "2em";
            textArea.style.padding = "0";
            textArea.style.border = "none";
            textArea.style.outline = "none";
            textArea.style.boxShadow = "none";
            textArea.style.background = "transparent";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            const successful = document.execCommand('copy');
            document.body.removeChild(textArea);
            if (successful) {
              showToast(successMessage, 'success');
            } else {
              showToast('Скопируйте вручную из поля ввода', 'info');
            }
          } catch (err) {
            console.error('Fallback execCommand failed:', err);
            showToast('Не удалось скопировать. Скопируйте ссылку вручную', 'error');
          }
        };

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(textToCopy)
            .then(() => showToast(successMessage, 'success'))
            .catch(() => fallbackExecCopy(textToCopy));
        } else {
          fallbackExecCopy(textToCopy);
        }
      };

        const params = new URLSearchParams(window.location.search);
        const urlSyncId = params.get('syncId') || params.get('sync');
        const urlApiKey = params.get('apiKey');

        if (urlSyncId) {
          setSyncId(urlSyncId);
          localStorage.setItem('lingua_sync_id', urlSyncId);
          showToast('Облачная синхронизация успешно подключена по ссылке! 📱', 'success');
        }

        if (urlApiKey) {
          setApiKey(urlApiKey);
          localStorage.setItem('lingua_gemini_api_key', urlApiKey);
        }

        if (urlSyncId || urlApiKey) {
          const cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }
      }, []);

      const shareableUrl = useMemo(() => {
        if (!syncId) return window.location.href;
        const baseUrl = window.location.origin + window.location.pathname;
        return `${baseUrl}?syncId=${encodeURIComponent(syncId)}`;
      }, [syncId]);

      useEffect(() => {
        if (!firebaseConfig || !window.FirebaseSDK) return;

        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseSDK;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("Firebase auth error:", e);
          }
        };

        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (user) => {
          setAuthUser(user);
          if (user) {
            const activeId = localStorage.getItem('lingua_sync_id') || user.uid;
            setSyncId(activeId);
            localStorage.setItem('lingua_sync_id', activeId);
          }
        });

        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!authUser || !syncId || !firebaseConfig || !window.FirebaseSDK) {
          setIsCloudActive(false);
          return;
        }

        const { initializeApp, getFirestore, doc, onSnapshot, collection } = window.FirebaseSDK;
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const docRef = doc(db, 'artifacts', appId, 'users', syncId, 'data', 'user_deck');

        const unsubscribeDeck = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (Array.isArray(data.deck)) setDeck(data.deck);
            if (Array.isArray(data.mastered)) setMasteredCards(data.mastered);
            setIsCloudActive(true);
          } else {
            saveToCloud(syncId, deck, masteredCards);
            setIsCloudActive(true);
          }
        }, (err) => {
          console.error("Firestore sync error:", err);
          setIsCloudActive(false);
        });

        const leaderboardRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
        const unsubscribeLeaderboard = onSnapshot(leaderboardRef, (snapshot) => {
          const list = [];
          snapshot.forEach((d) => {
            list.push({ id: d.id, ...d.data() });
          });
          list.sort((a, b) => (b.masteredCount || 0) - (a.masteredCount || 0));
          setLeaderboard(list);
        }, (err) => {
          console.error("Leaderboard fetch error:", err);
        });

        return () => {
          unsubscribeDeck();
          unsubscribeLeaderboard();
        };
      }, [authUser, syncId]);

      const saveToCloud = async (targetSyncId, newDeck, newMastered, nameToSave = userName) => {
        if (!authUser || !targetSyncId || !firebaseConfig || !window.FirebaseSDK) return;
        try {
          const { initializeApp, getFirestore, doc, setDoc } = window.FirebaseSDK;
          const app = initializeApp(firebaseConfig);
          const db = getFirestore(app);

          const deckRef = doc(db, 'artifacts', appId, 'users', targetSyncId, 'data', 'user_deck');
          await setDoc(deckRef, {
            deck: newDeck,
            mastered: newMastered,
            updatedAt: Date.now()
          }, { merge: true });

          const userDisplayName = nameToSave.trim() || `Ученик #${targetSyncId.slice(-4)}`;
          const leaderboardRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', targetSyncId);
          await setDoc(leaderboardRef, {
            username: userDisplayName,
            masteredCount: newMastered.length,
            activeCount: newDeck.length,
            totalCards: newDeck.length + newMastered.length,
            updatedAt: Date.now()
          }, { merge: true });

        } catch (e) {
          console.error("Cloud save failed:", e);
        }
      };

      useEffect(() => {
        localStorage.setItem('lingua_deck', JSON.stringify(deck));
        if (isCloudActive && syncId) {
          saveToCloud(syncId, deck, masteredCards);
        }
      }, [deck]);

      useEffect(() => {
        localStorage.setItem('lingua_mastered', JSON.stringify(masteredCards));
        if (isCloudActive && syncId) {
          saveToCloud(syncId, deck, masteredCards);
        }
      }, [masteredCards]);

      useEffect(() => {
        localStorage.setItem('lingua_user_name', userName);
        if (isCloudActive && syncId) {
          saveToCloud(syncId, deck, masteredCards, userName);
        }
      }, [userName]);

      useEffect(() => {
        if (deck.length > 0 && sessionQueue.length === 0) {
          setSessionQueue(deck.map(c => c.id));
          setCurrentCardIndex(0);
        }
      }, [deck]);

      const currentCard = useMemo(() => {
        if (sessionQueue.length === 0) return null;
        const id = sessionQueue[currentCardIndex % sessionQueue.length];
        return deck.find(c => c.id === id) || null;
      }, [sessionQueue, currentCardIndex, deck]);

      // Flashcard Session Navigation Handlers
      const handleFlip = () => setIsFlipped(prev => !prev);

      const handleNextCard = () => {
        setIsFlipped(false);
        if (sessionQueue.length > 0) {
          setCurrentCardIndex(prev => (prev + 1) % sessionQueue.length);
        }
      };

      const handleSkipCard = () => {
        handleNextCard();
      };

      const handleMastered = (cardToMaster = currentCard) => {
        if (!cardToMaster) return;
        setIsFlipped(false);
        setMasteredCards(prev => [...prev, cardToMaster]);
        setDeck(prev => prev.filter(c => c.id !== cardToMaster.id));
        setSessionQueue(prev => prev.filter(id => id !== cardToMaster.id));
        showToast(`Слово "${cardToMaster.english}" перенесено в выученные! 🏆`, 'success');
      };

      const handleRestoreCard = (cardToRestore) => {
        setMasteredCards(prev => prev.filter(c => c.id !== cardToRestore.id));
        setDeck(prev => [cardToRestore, ...prev]);
        setSessionQueue(prev => [cardToRestore.id, ...prev]);
        showToast(`Слово "${cardToRestore.english}" возвращено в колоду`, 'info');
      };

      // Text to Speech
      const handleSpeak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        }
      };

      const generateCardWithAI = async (inputWord) => {
        const activeKey = apiKey || DEFAULT_API_KEY;
        if (!activeKey) {
          throw new Error('API_KEY_REQUIRED');
        }

        const prompt = `You are an expert English lexicographer. Provide detailed information for the English or Russian word/phrase: "${inputWord}".
Respond with ONLY a valid JSON object with NO markdown formatting, NO backticks.
JSON structure:
{
  "english": "English word or phrase",
  "russian": "Russian translation",
  "transcription": "[/IPA transcription/]",
  "exampleEn": "Example English sentence using the word",
  "exampleRu": "Russian translation of the example sentence"
}`;

        // Updated Gemini API model endpoint to gemini-3.8-flash
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${activeKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || 'Ошибка ответа Gemini API');
        }

        const data = await response.json();
        let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

        const parsed = JSON.parse(rawText);
        return {
          id: `card-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
          english: parsed.english || inputWord,
          russian: parsed.russian || 'Перевод',
          transcription: parsed.transcription || '',
          exampleEn: parsed.exampleEn || '',
          exampleRu: parsed.exampleRu || '',
          createdAt: Date.now()
        };
      };

      const handleAddSingleWord = async (e) => {
        e.preventDefault();
        if (!newWordInput.trim()) return;

        setIsGenerating(true);
        try {
          const newCard = await generateCardWithAI(newWordInput.trim());
          setDeck(prev => [newCard, ...prev]);
          setSessionQueue(prev => [newCard.id, ...prev]);
          setNewWordInput('');
          showToast(`Карточка "${newCard.english}" создана через AI! ✨`, 'success');
        } catch (err) {
          if (err.message === 'API_KEY_REQUIRED') {
            setIsSettingsOpen(true);
            showToast('Пожалуйста, укажите Gemini API ключ в настройках ⚙️', 'error');
          } else {
            showToast(`Ошибка AI: ${err.message}`, 'error');
          }
        } finally {
          setIsGenerating(false);
        }
      };

      // Bulk Add Handlers
      const handleBulkAddFast = () => {
        if (!bulkInput.trim()) return;
        const lines = bulkInput.split('\n').map(l => l.trim()).filter(Boolean);
        const createdCards = [];

        for (const line of lines) {
          let en = line;
          let ru = 'Перевод';
          if (line.includes('-')) {
            const parts = line.split('-');
            en = parts[0].trim();
            ru = parts.slice(1).join('-').trim();
          } else if (line.includes('—')) {
            const parts = line.split('—');
            en = parts[0].trim();
            ru = parts.slice(1).join('—').trim();
          }

          createdCards.push({
            id: `card-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
            english: en,
            russian: ru,
            transcription: '',
            exampleEn: '',
            exampleRu: '',
            createdAt: Date.now()
          });
        }

        setDeck(prev => [...createdCards, ...prev]);
        setSessionQueue(prev => [...createdCards.map(c => c.id), ...prev]);
        setBulkInput('');
        setIsBulkAddOpen(false);
        showToast(`Успешно добавлено ${createdCards.length} карточек! ⚡`, 'success');
      };

      const handleBulkAddAI = async () => {
        if (!bulkInput.trim()) return;
        const lines = bulkInput.split('\n').map(l => l.trim()).filter(Boolean);
        setIsBulkProcessing(true);

        let successCount = 0;
        const newCards = [];

        for (const word of lines.slice(0, 10)) {
          try {
            const card = await generateCardWithAI(word);
            newCards.push(card);
            successCount++;
          } catch (e) {
            console.error("Bulk AI card failed for:", word, e);
          }
        }

        if (newCards.length > 0) {
          setDeck(prev => [...newCards, ...prev]);
          setSessionQueue(prev => [...newCards.map(c => c.id), ...prev]);
          setBulkInput('');
          setIsBulkAddOpen(false);
          showToast(`Добавлено ${successCount} карточек через AI! ✨`, 'success');
        } else {
          showToast('Не удалось сгенерировать карточки. Проверьте API ключ', 'error');
        }

        setIsBulkProcessing(false);
      };

      const handleAddManualCard = (e) => {
        e.preventDefault();
        if (!manualForm.english.trim() || !manualForm.russian.trim()) return;

        const newCard = {
          id: `card-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`,
          english: manualForm.english.trim(),
          russian: manualForm.russian.trim(),
          transcription: manualForm.transcription.trim(),
          exampleEn: manualForm.exampleEn.trim(),
          exampleRu: manualForm.exampleRu.trim(),
          createdAt: Date.now()
        };

        setDeck(prev => [newCard, ...prev]);
        setSessionQueue(prev => [newCard.id, ...prev]);
        setManualForm({ english: '', russian: '', transcription: '', exampleEn: '', exampleRu: '' });
        setIsManualAddOpen(false);
        showToast(`Карточка "${newCard.english}" создана вручную!`, 'success');
      };

      const handleExportDeck = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ deck, masteredCards }));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `lingua_cards_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Файл колоды скачан!', 'success');
      };

      const handleImportDeck = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (Array.isArray(parsed.deck)) setDeck(parsed.deck);
              if (Array.isArray(parsed.masteredCards)) setMasteredCards(parsed.masteredCards);
              showToast('Колода успешно импортирована!', 'success');
            } catch (err) {
              showToast('Ошибка при чтении файла backup.json', 'error');
            }
          };
        }
      };

      const filteredDeck = useMemo(() => {
        if (!searchTerm.trim()) return deck;
        const term = searchTerm.toLowerCase();
        return deck.filter(c => c.english.toLowerCase().includes(term) || c.russian.toLowerCase().includes(term));
      }, [deck, searchTerm]);

      const filteredMastered = useMemo(() => {
        if (!searchTerm.trim()) return masteredCards;
        const term = searchTerm.toLowerCase();
        return masteredCards.filter(c => c.english.toLowerCase().includes(term) || c.russian.toLowerCase().includes(term));
      }, [masteredCards, searchTerm]);

      return (
        <div className="flex-grow flex flex-col justify-between max-w-5xl mx-auto w-full p-4 md:p-6 space-y-6">
          {renderToast()}

          {/* Top App Header */}
          <header className="flex items-center justify-between border-b border-slate-800/80 pb-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-blue-500/20">
                L
              </div>
              <div>
                <h1 className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                  LinguaCards <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">AI</span>
                </h1>
                <p className="text-xs text-slate-400 flex items-center gap-1.5">
                  <span>Тренажер английских слов</span>
                  {isCloudActive && (
                    <span className="inline-flex items-center gap-1 text-[10px] text-emerald-400 bg-emerald-950/60 px-1.5 py-0.2 rounded border border-emerald-800/50">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Sync Active
                    </span>
                  )}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              {/* Navigation Tabs */}
              <nav className="flex items-center bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('study')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                    activeTab === 'study'
                      ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icon name="book-open" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Тренировка</span>
                </button>

                <button
                  onClick={() => setActiveTab('deck')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                    activeTab === 'deck'
                      ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icon name="layers" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Колода</span>
                  <span className="px-1.5 py-0.2 text-[10px] bg-slate-800 text-slate-300 rounded-full border border-slate-700">
                    {deck.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('mastered')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                    activeTab === 'mastered'
                      ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icon name="trophy" className="w-3.5 h-3.5 text-amber-400" />
                  <span className="hidden sm:inline">Выучено</span>
                  <span className="px-1.5 py-0.2 text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800/50 rounded-full">
                    {masteredCards.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('leaderboard')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                    activeTab === 'leaderboard'
                      ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <Icon name="crown" className="w-3.5 h-3.5 text-amber-400" />
                  <span className="hidden sm:inline">Рейтинг</span>
                  {leaderboard.length > 0 && (
                    <span className="px-1.5 py-0.2 text-[10px] bg-amber-500/20 text-amber-300 rounded-full border border-amber-500/30 font-semibold">
                      {leaderboard.length}
                    </span>
                  )}
                </button>
              </nav>

              <button
                onClick={() => setIsSettingsOpen(true)}
                className="p-2 bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white rounded-xl border border-slate-800 transition-all"
                title="Настройки и синхронизация"
              >
                <Icon name="settings" className="w-4 h-4" />
              </button>
            </div>
          </header>

          {/* Word Addition Controls */}
          <section className="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800 shadow-xl">
            <form onSubmit={handleAddSingleWord} className="flex flex-col sm:flex-row items-center gap-2">
              <div className="relative flex-1 w-full">
                <input
                  type="text"
                  value={newWordInput}
                  onChange={(e) => setNewWordInput(e.target.value)}
                  placeholder="Введите слово на английском или русском..."
                  className="w-full pl-3.5 pr-24 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all shadow-inner"
                />
                
                <button
                  type="button"
                  onClick={() => setIsBulkAddOpen(true)}
                  className="absolute right-2 top-2 text-[11px] font-medium text-indigo-400 hover:text-indigo-300 bg-indigo-950/60 hover:bg-indigo-900/80 px-2 py-1 rounded-lg border border-indigo-800/50 transition-all flex items-center gap-1"
                >
                  <Icon name="list-plus" className="w-3 h-3" />
                  <span>Массово</span>
                </button>
              </div>

              <div className="flex items-center gap-2 w-full sm:w-auto">
                <button
                  type="submit"
                  disabled={isGenerating || !newWordInput.trim()}
                  className="flex-1 sm:flex-none px-4 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-xs rounded-xl shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2 transition-all disabled:opacity-50"
                >
                  {isGenerating ? (
                    <>
                      <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                      <span>AI Генерирует...</span>
                    </>
                  ) : (
                    <>
                      <Icon name="wand-2" className="w-4 h-4" />
                      <span>✨ AI Карточка</span>
                    </>
                  )}
                </button>

                <button
                  type="button"
                  onClick={() => setIsManualAddOpen(true)}
                  className="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-xs rounded-xl border border-slate-700 transition-all flex items-center justify-center gap-1.5"
                  title="Добавить вручную"
                >
                  <Icon name="plus-circle" className="w-4 h-4" />
                  <span className="hidden md:inline">Вручную</span>
                </button>
              </div>
            </form>
          </section>

          {/* Dynamic Content Views */}
          <main className="flex-grow flex flex-col justify-center">
            
            {/* View 1: Study Mode */}
            {activeTab === 'study' && (
              <div className="flex flex-col items-center justify-center space-y-6">
                
                {deck.length === 0 ? (
                  <div className="text-center py-16 px-4 bg-slate-900/40 rounded-3xl border border-slate-800/80 max-w-md w-full">
                    <div className="w-16 h-16 rounded-3xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center mx-auto mb-4 border border-emerald-500/20">
                      <Icon name="award" className="w-8 h-8" />
                    </div>
                    <h3 className="text-xl font-bold text-white mb-2">Колода пуста! 🎉</h3>
                    <p className="text-slate-400 text-xs leading-relaxed mb-6">
                      Вы успешно выучили все карточки! Добавьте новые слова сверху или верните изученные из вкладки "Выучено".
                    </p>
                    <button
                      onClick={() => setActiveTab('mastered')}
                      className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-xs rounded-xl border border-slate-700 transition-all"
                    >
                      Посмотреть выученные слова ({masteredCards.length})
                    </button>
                  </div>
                ) : currentCard ? (
                  <div className="w-full max-w-md flex flex-col items-center space-y-5">
                    
                    {/* Session Progress Header */}
                    <div className="w-full flex items-center justify-between text-xs text-slate-400 px-1">
                      <span>Карточка {currentCardIndex + 1} из {sessionQueue.length}</span>
                      <button
                        onClick={() => handleMastered(currentCard)}
                        className="text-rose-400 hover:text-rose-300 flex items-center gap-1 transition-colors"
                      >
                        <Icon name="trash-2" className="w-3.5 h-3.5" />
                        <span>Убрать насовсем (Выучил)</span>
                      </button>
                    </div>

                    {/* 3D Flip Card */}
                    <div
                      onClick={handleFlip}
                      className="w-full h-80 perspective-1000 cursor-pointer group select-none"
                    >

                      type="button"
                      onClick={() => {
                        if (!customSyncInput.trim()) return;
                        let extractedId = customSyncInput.trim();
                        if (extractedId.includes('syncId=')) {
                          try {
                            const urlObj = new URL(extractedId);
                            extractedId = urlObj.searchParams.get('syncId') || extractedId;
                          } catch(e) {}
                        }
                        setSyncId(extractedId);
                        localStorage.setItem('lingua_sync_id', extractedId);
                        setCustomSyncInput('');
                        showToast('Код синхронизации обновлен!', 'success');
                      }}
                      className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition-all"
                    >
                      Подключить
                    </button>
                  </div>
                </div>

                <div className="space-y-3 mb-6">
                  <div className="flex items-center justify-between">
                    <h4 className="text-xs font-semibold text-slate-300">Ключ Google Gemini API</h4>
                    {DEFAULT_API_KEY && (
                      <span className="text-[10px] text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">
                        Встроен ключ
                      </span>
                    )}
                  </div>
                  <input
                    type="password"
                    value={tempApiKeyInput}
                    onChange={(e) => setTempApiKeyInput(e.target.value)}
                    placeholder={DEFAULT_API_KEY ? "Используется встроенный ключ" : "AIzaSy..."}
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500"
                  />
                  
                  <div className="flex items-center justify-between text-xs">
                    <a
                      href="https://aistudio.google.com/app/apikey"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center gap-1 text-blue-400 hover:underline text-[11px]"
                    >
                      <span>Получить бесплатный ключ в AI Studio</span>
                    </a>

                    <button
                      type="button"
                      onClick={() => {
                        setApiKey(tempApiKeyInput.trim());
                        setIsSettingsOpen(false);
                        showToast('API Ключ сохранен!', 'success');
                      }}
                      className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-all"
                    >
                      Сохранить
                    </button>
                  </div>
                </div>

                <div className="pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <button
                    type="button"
                    onClick={handleExportDeck}
                    className="w-full sm:w-auto px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl flex items-center justify-center gap-2 border border-slate-700"
                  >
                    <Icon name="download" className="w-4 h-4" />
                    <span>Скачать резервную копию</span>
                  </button>

                  <label className="w-full sm:w-auto px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl flex items-center justify-center gap-2 border border-slate-700 cursor-pointer">
                    <Icon name="upload" className="w-4 h-4" />
                    <span>Импортировать файл</span>
                    <input type="file" accept=".json" onChange={handleImportDeck} className="hidden" />
                  </label>
                </div>

              </div>
            </div>
          )}

          {/* Manual Card Add Modal */}
          {isManualAddOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
                <button
                  onClick={() => setIsManualAddOpen(false)}
                  className="absolute top-4 right-4 text-slate-500 hover:text-slate-300"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="flex items-center gap-3 mb-4">
                  <div className="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center border border-indigo-500/20">
                    <Icon name="edit-3" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-white">Добавить карточку вручную</h3>
                    <p className="text-xs text-slate-400">Без использования AI-генерации</p>
                  </div>
                </div>

                <form onSubmit={handleAddManualCard} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">
                        Слово на английском <span className="text-red-400">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        value={manualForm.english}
                        onChange={(e) => setManualForm(f => ({ ...f, english: e.target.value }))}
                        placeholder="e.g. Opportunity"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">
                        Перевод на русский <span className="text-red-400">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        value={manualForm.russian}
                        onChange={(e) => setManualForm(f => ({ ...f, russian: e.target.value }))}
                        placeholder="e.g. Возможность"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">
                      Транскрипция (опционально)
                    </label>
                    <input
                      type="text"
                      value={manualForm.transcription}
                      onChange={(e) => setManualForm(f => ({ ...f, transcription: e.target.value }))}
                      placeholder="e.g. [/ˌɒpəˈtjuːnəti/]"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">
                      Пример на английском (опционально)
                    </label>
                    <input
                      type="text"
                      value={manualForm.exampleEn}
                      onChange={(e) => setManualForm(f => ({ ...f, exampleEn: e.target.value }))}
                      placeholder="e.g. Take every opportunity to learn."
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">
                      Перевод примера (опционально)
                    </label>
                    <input
                      type="text"
                      value={manualForm.exampleRu}
                      onChange={(e) => setManualForm(f => ({ ...f, exampleRu: e.target.value }))}
                      placeholder="e.g. Используй любую возможность учиться."
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="pt-3 flex items-center justify-end gap-2 border-t border-slate-800/80">
                    <button
                      type="button"
                      onClick={() => setIsManualAddOpen(false)}
                      className="px-3 py-2 text-xs text-slate-400 hover:text-slate-200"
                    >
                      Отмена
                    </button>

                    <button
                      type="submit"
                      className="px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium text-xs rounded-xl transition-all shadow-md"
                    >
                      Создать карточку
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Bulk Words Modal */}
          {isBulkAddOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl relative max-h-[90vh] flex flex-col justify-between">
                
                <button
                  onClick={() => setIsBulkAddOpen(false)}
                  className="absolute top-4 right-4 text-slate-500 hover:text-slate-300"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div>
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center border border-indigo-500/20">
                      <Icon name="list-plus" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-white">Массовая загрузка слов</h3>
                      <p className="text-xs text-slate-400">Вставьте список слов или готовых пар с переводом</p>
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 mb-3 text-xs">
                    <span className="text-slate-500">Примеры:</span>
                    <button
                      type="button"
                      onClick={() => setBulkInput("Ambitious\nCompassion\nInevitable\nUnprecedented\nPhenomenon")}
                      className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-blue-300 rounded-lg border border-slate-700"
                    >
                      Список английских слов
                    </button>
                    <button
                      type="button"
                      onClick={() => setBulkInput("Adventure - Приключение\nChallenge - Вызов\nDestination - Пункт назначения\nOpportunity - Возможность")}
                      className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-lg border border-slate-700"
                    >
                      Готовые пары (Слово - Перевод)
                    </button>
                  </div>

                  <textarea
                    rows={7}
                    value={bulkInput}
                    onChange={(e) => setBulkInput(e.target.value)}
                    placeholder={`Вставьте список слов по одному на строку:\n\nSerendipity\nPerseverance\n\nили:\nApple - Яблоко\nBook - Книга`}
                    className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs sm:text-sm font-mono text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 resize-none shadow-inner"
                  />
                  
                  <p className="text-[11px] text-slate-400 mt-2">
                    💡 <strong>✨ AI Генерация</strong> переведет слова, создаст транскрипцию и примеры. <strong>⚡ Быстрый импорт</strong> мгновенно добавит список пар.
                  </p>
                </div>

                <div className="pt-4 mt-4 border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-2.5">
                  <button
                    type="button"
                    onClick={() => setIsBulkAddOpen(false)}
                    className="w-full sm:w-auto px-4 py-2 text-xs text-slate-400 hover:text-slate-200"
                  >
                    Отмена
                  </button>

                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <button
                      type="button"
                      onClick={handleBulkAddFast}
                      disabled={isBulkProcessing || !bulkInput.trim()}
                      className="flex-1 sm:flex-none px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition-all disabled:opacity-50"
                    >
                      ⚡ Быстрый импорт
                    </button>

                    <button
                      type="button"
                      onClick={handleBulkAddAI}
                      disabled={isBulkProcessing || !bulkInput.trim()}
                      className="flex-1 sm:flex-none px-4 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-semibold rounded-xl transition-all shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {isBulkProcessing ? (
                        <>
                          <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                          <span>AI Обработка...</span>
                        </>
                      ) : (
                        <>
                          <Icon name="wand-2" className="w-4 h-4" />
                          <span>✨ AI Генерация</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-slate-800/60 py-4 text-center text-xs text-slate-500">
            <div className="flex flex-col sm:flex-row items-center justify-between gap-2">
              <p>LinguaCards AI — Персональный тренажер английских слов</p>
              <p className="text-slate-600">Синхронизировано в облаке • Gemini AI & Web Speech API</p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
