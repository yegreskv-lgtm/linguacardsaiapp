    function App() {
      // Firebase Environment Constants
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'lingua-cards-app';
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

      // User authentication and Cloud Sync ID
      const [authUser, setAuthUser] = useState(null);
      const [syncId, setSyncId] = useState(() => localStorage.getItem('lingua_sync_id') || '');
      const [customSyncInput, setCustomSyncInput] = useState('');
      const [isCloudActive, setIsCloudActive] = useState(false);

      // 🔑 Вставьте ваш бесплатный ключ Gemini API между кавычками ниже, чтобы он работат у вас и ваших друзей сразу:
      const DEFAULT_API_KEY = "AQ.Ab8RN6ISBSPyMyTiUgv4LC9ZFNYBQu82KgCPHX2w6gH9KSKpow";

      // Flashcards state
      const [deck, setDeck] = useState(() => {
        const saved = localStorage.getItem('lingua_deck');
        return saved ? JSON.parse(saved) : INITIAL_CARDS;
      });

      const [masteredCards, setMasteredCards] = useState(() => {
        const saved = localStorage.getItem('lingua_mastered');
        return saved ? JSON.parse(saved) : [];
      });

      // API Key пользователя (использует личный ключ или встроенный по умолчанию)
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('lingua_gemini_api_key') || DEFAULT_API_KEY);

      // Session Queue
      const [sessionQueue, setSessionQueue] = useState([]);
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      // Navigation & Modals
      const [activeTab, setActiveTab] = useState('study');
      const [newWordInput, setNewWordInput] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [toast, setToast] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isManualAddOpen, setIsManualAddOpen] = useState(false);
      const [isBulkAddOpen, setIsBulkAddOpen] = useState(false);
      const [bulkInput, setBulkInput] = useState('');
      const [isBulkProcessing, setIsBulkProcessing] = useState(false);
      const [tempApiKeyInput, setTempApiKeyInput] = useState('');

      // PWA Installation state
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [isInstallable, setIsInstallable] = useState(false);

      const [manualForm, setManualForm] = useState({
        english: '',
        russian: '',
        transcription: '',
        exampleEn: '',
        exampleRu: ''
      });

      // PWA Manifest and Install Prompt setup
      useEffect(() => {
        const manifest = {
          name: "LinguaCards AI — Тренажер слов",
          short_name: "LinguaCards",
          description: "Умный тренажер английских слов с AI и синхронизацией",
          start_url: "./",
          display: "standalone",
          background_color: "#020617",
          theme_color: "#020617",
          icons: [
            {
              src: "https://cdn-icons-png.flaticon.com/512/3898/3898082.png",
              sizes: "512x512",
              type: "image/png",
              purpose: "any maskable"
            }
          ]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);

        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
          setIsInstallable(true);
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      const handleInstallApp = async () => {

        }
        setDeferredPrompt(null);
        setIsInstallable(false);
      };

      // Automatic link detection for phone setup via QR / Share Link
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlSyncId = params.get('syncId') || params.get('sync');
        const urlApiKey = params.get('apiKey');

        if (urlSyncId) {
          setSyncId(urlSyncId);
          localStorage.setItem('lingua_sync_id', urlSyncId);
          showToast('Облачная синхронизация успешно подключена по ссылке! 📱', 'success');
        }

        if (urlApiKey) {
          setApiKey(urlApiKey);
          localStorage.setItem('lingua_gemini_api_key', urlApiKey);
        }

        // Clean query params from URL bar without reloading page
        if (urlSyncId || urlApiKey) {
          const cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        }
      }, []);

      const shareableUrl = useMemo(() => {
        if (!syncId) return '';
        const baseUrl = window.location.origin + window.location.pathname;
        return `${baseUrl}?syncId=${encodeURIComponent(syncId)}`;
      }, [syncId]);

      useEffect(() => {
        if (!firebaseConfig || !window.FirebaseSDK) return;

        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseSDK;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("Firebase auth error:", e);
          }
        };

        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (user) => {
          setAuthUser(user);
          if (user) {
            const activeId = localStorage.getItem('lingua_sync_id') || user.uid;
            setSyncId(activeId);
            localStorage.setItem('lingua_sync_id', activeId);
          }
        });

        return () => unsubscribe();
      }, []);

      // Realtime Firestore Sync
      useEffect(() => {
        if (!authUser || !syncId || !firebaseConfig || !window.FirebaseSDK) {
          setIsCloudActive(false);
          return;
        }

        const { initializeApp, getFirestore, doc, onSnapshot } = window.FirebaseSDK;
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Strict Path according to Rule 1: /artifacts/{appId}/users/{userId}/data/user_deck
        const docRef = doc(db, 'artifacts', appId, 'users', syncId, 'data', 'user_deck');

        const unsubscribe = onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            if (Array.isArray(data.deck)) setDeck(data.deck);
            if (Array.isArray(data.mastered)) setMasteredCards(data.mastered);
            setIsCloudActive(true);
          } else {
            // First time cloud upload
            saveToCloud(syncId, deck, masteredCards);
            setIsCloudActive(true);
          }
        }, (err) => {
          console.error("Firestore sync error:", err);
          setIsCloudActive(false);
        });

        return () => unsubscribe();
      }, [authUser, syncId]);

      // Save helper to Cloud
      const saveToCloud = async (targetSyncId, newDeck, newMastered) => {
        if (!authUser || !targetSyncId || !firebaseConfig || !window.FirebaseSDK) return;

          const app = initializeApp(firebaseConfig);
          const db = getFirestore(app);
          const docRef = doc(db, 'artifacts', appId, 'users', targetSyncId, 'data', 'user_deck');

          await setDoc(docRef, {
            deck: newDeck,
            mastered: newMastered,
            updatedAt: Date.now()

          console.error("Cloud save failed:", e);

           const match = text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
           if (match) {
             return JSON.parse(match[0]);

           throw e;

          const userQuery = `Сгенерируй карточку для слова/фразы: "${query}". Если ввод на русском, переведи на английский. Если ввод на английском, переведи на русский. 
Формат строго JSON (никакого markdown):
{
  "english": "word in english",
  "russian": "translation",
  "transcription": "[/transcription/]",
  "exampleEn": "example sentence",
  "exampleRu": "example translation"
}`;
          
          const currentKey = (apiKey.trim() || DEFAULT_API_KEY.trim());
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`;

          const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            if (response.status === 400 || response.status === 403) {
              throw new Error('API_KEY_REQUIRED');
            }
            throw new Error(`Ошибка API: ${response.status}`);
          }

          const result = await response.json();
          const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (!jsonText) throw new Error('Не удалось получить ответ от AI');

          const parsed = parseJsonFix(jsonText);

          const newCard = {
            id: 'card-' + Date.now(),

            russian: parsed.russian || '—',
            transcription: parsed.transcription?.startsWith('[') ? parsed.transcription : `[${parsed.transcription || ''}]`,
            exampleEn: parsed.exampleEn || '',
            exampleRu: parsed.exampleRu || '',
            createdAt: Date.now()
          };

          setDeck(prev => [newCard, ...prev]);
          setSessionQueue(prev => [...prev, newCard.id]);
          setNewWordInput('');
          showToast(`Слово "${newCard.english}" успешно добавлено через AI! 🎉`, 'success');
        } catch (err) {
          console.error('Ошибка добавления:', err);

            showToast('Для работы AI нужен ваш ключ Gemini API. Укажите его в ⚙️ Настройки!', 'error');

            setIsSettingsOpen(true);

                russian: '—',
                transcription: '[]',

             setDeck(prev => [fallbackCard, ...prev]);

             showToast(`Добавлено без перевода (AI не ответил должным образом).`, 'info');

          setIsGenerating(false);
        }

      const handleAddManualCard = (e) => {

          const userQuery = `Сгенерируй массив карточек для следующих слов/фраз:\n${rawLines.join('\n')}\n\nФормат строго массив JSON:\n[\n  {\n    "english": "word",\n    "russian": "перевод",\n    "transcription": "[/.../]",\n    "exampleEn": "example",\n    "exampleRu": "пример"\n  }\n]`;

          const currentKey = (apiKey.trim() || DEFAULT_API_KEY.trim());
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`;

          const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            if (response.status === 400 || response.status === 403) {
              throw new Error('API_KEY_REQUIRED');
            }
            throw new Error(`Ошибка API: ${response.status}`);
          }

          const result = await response.json();
          const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (!jsonText) throw new Error('Не удалось получить ответ от AI');

          const parsedArray = parseJsonFix(jsonText);
          
          if (!Array.isArray(parsedArray) || parsedArray.length === 0) {
            throw new Error('Пустой ответ от AI');
          }

          const newCards = parsedArray.map((item, index) => ({
            id: 'card-' + (Date.now() + index),
            english: item.english || 'Word',
            russian: item.russian || '—',
            transcription: item.transcription?.startsWith('[') ? item.transcription : `[${item.transcription || ''}]`,
            exampleEn: item.exampleEn || '',
            exampleRu: item.exampleRu || '',
            createdAt: Date.now() + index
          }));

          setDeck(prev => [...newCards, ...prev]);
          setSessionQueue(prev => [...newCards.map(c => c.id), ...prev]);
          setBulkInput('');
          setIsBulkAddOpen(false);
          showToast(`Успешно создано ${newCards.length} карточек через AI! 🎉`, 'success');
        } catch (err) {
          console.error('Bulk AI error:', err);
          if (err.message === 'API_KEY_REQUIRED') {
            showToast('Для работы AI нужен ваш ключ Gemini API. Укажите его в ⚙️ Настройки!', 'error');
            setTempApiKeyInput(apiKey);
            setIsSettingsOpen(true);
          } else {
             // Fallback если AI не ответил массивом — делаем быстрый импорт
             handleBulkAddFast();
          }
        } finally {
          setIsBulkProcessing(false);
        }
      };

      const handleBulkAddFast = () => {
        const lines = bulkInput.split('\n').map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) {
          showToast('Введите хотя бы одну строку со словами', 'error');
          return;
        }

        const createdCards = [];
        lines.forEach((line, index) => {
          const delimiterMatch = line.match(/\s*[-—=:|\t]\s*/);
          let en = line;
          let ru = '—';

          if (delimiterMatch) {
            const parts = line.split(delimiterMatch[0]);
            en = parts[0]?.trim() || line;
            ru = parts.slice(1).join(' ').trim() || '—';
          }

          if (en) {
            createdCards.push({
              id: 'card-' + (Date.now() + index),
              english: en,
              russian: ru,
              transcription: '[—]',
              exampleEn: '',
              exampleRu: '',
              createdAt: Date.now() + index
            });
          }
        });

        if (createdCards.length > 0) {
          setDeck(prev => [...createdCards, ...prev]);
          setSessionQueue(prev => [...createdCards.map(c => c.id), ...prev]);
          setBulkInput('');
          setIsBulkAddOpen(false);
          showToast(`Загружено ${createdCards.length} карточек напрямую! 🚀`, 'success');
        }
      };

      const handleSkip = () => {
        if (sessionQueue.length <= 1) return;
        setIsFlipped(false);
        setSessionQueue(prev => {
          const currentId = prev[currentCardIndex];
          const updated = prev.filter((_, idx) => idx !== currentCardIndex);
          return [...updated, currentId];
        });
      };

      const handleDone = () => {
        if (sessionQueue.length === 0) return;
        setIsFlipped(false);
        setSessionQueue(prev => prev.filter((_, idx) => idx !== currentCardIndex));
        showToast('Карточка пройдена в этой сессии! 👍', 'info');
      };

      const handleMastered = (cardToMaster = currentCard) => {
        if (!cardToMaster) return;
        setIsFlipped(false);
        setDeck(prev => prev.filter(c => c.id !== cardToMaster.id));
        setMasteredCards(prev => [cardToMaster, ...prev]);
        setSessionQueue(prev => prev.filter(id => id !== cardToMaster.id));
        showToast(`Слово "${cardToMaster.english}" перенесено в выученные! 🎉`, 'success');
      };

      const handleRestoreCard = (card) => {
        setMasteredCards(prev => prev.filter(c => c.id !== card.id));
        setDeck(prev => [card, ...prev]);
        setSessionQueue(prev => [...prev, card.id]);
        showToast(`Слово "${card.english}" возвращено в колоду`, 'info');
      };

      const handleResetSession = () => {
        setSessionQueue(deck.map(c => c.id));
        setCurrentCardIndex(0);
        setIsFlipped(false);
        showToast('Сессия обучения перезапущена!', 'info');
      };

      const handleSpeak = (text) => {
        if (!('speechSynthesis' in window)) {
          showToast('Синтез речи не поддерживается браузером', 'error');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.88;

        const voices = window.speechSynthesis.getVoices();
        const englishVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha')));
        if (englishVoice) utterance.voice = englishVoice;

        window.speechSynthesis.speak(utterance);
      };

      // Export / Import Backup JSON
      const handleExportDeck = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ deck, masteredCards }, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `lingua_cards_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Колода успешно экспортирована в файл!', 'success');
      };

      const handleImportDeck = (e) => {
        const fileReader = new FileReader();
        fileReader.readAsText(e.target.files[0], "UTF-8");
        fileReader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed.deck)) setDeck(parsed.deck);
            if (Array.isArray(parsed.masteredCards)) setMasteredCards(parsed.masteredCards);
            showToast('Колода успешно импортирована!', 'success');
          } catch (err) {
            showToast('Ошибка при прочтении файла импорта', 'error');
          }
        };
      };

      useEffect(() => {

          if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
          if (isSettingsOpen || isManualAddOpen) return;
          if (activeTab !== 'study' || !currentCard) return;

          if (e.code === 'Space') {
            e.preventDefault();
            setIsFlipped(prev => !prev);
          } else if (e.code === 'ArrowRight') {
            e.preventDefault();
            handleDone();
          } else if (e.code === 'ArrowLeft') {
            e.preventDefault();
            handleSkip();
          } else if (e.code === 'KeyM' || e.code === 'Delete') {
            e.preventDefault();
            handleMastered();
          } else if (e.code === 'KeyS') {
            e.preventDefault();
            handleSpeak(currentCard.english);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeTab, currentCard, sessionQueue, currentCardIndex, isSettingsOpen, isManualAddOpen]);

      const filteredDeck = deck.filter(c => 
        c.english.toLowerCase().includes(searchTerm.toLowerCase()) || 
        c.russian.toLowerCase().includes(searchTerm.toLowerCase())
      );

        c.russian.toLowerCase().includes(searchTerm.toLowerCase())
      );

              toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-800/80' : 
              'bg-slate-800/90 text-blue-200 border-slate-700'
            }`}>
              <Icon name={toast.type === 'error' ? 'alert-circle' : toast.type === 'success' ? 'check-circle-2' : 'info'} className="w-5 h-5 shrink-0" />
              <span className="text-xs sm:text-sm font-medium">{toast.message}</span>
            </div>
          )}

          {}

                  </h1>

                  >

                        <div className="p-2 bg-white rounded-lg shrink-0 shadow-md">
                          <img
                            src={`https://api.qrserver.com/v1/create-qr-code/?size=110x110&data=${encodeURIComponent(shareableUrl)}`}
                            alt="QR Code for Phone Sync"
                            className="w-24 h-24 block"
                          />
                        </div>
                      )}

                      <div className="space-y-2 text-center sm:text-left">
                        <p className="text-[11px] text-slate-300 leading-snug">
                          <strong>Отсканируйте QR-код</strong> камерой телефона или скопируйте прямую ссылку, чтобы сразу открыть синхронизированную версию:
                        </p>

                        <button
                          type="button"
                          onClick={() => {
                            navigator.clipboard.writeText(shareableUrl);
                            showToast('Прямая ссылка скопирована! Отправьте её себе на телефон.', 'success');
                          }}
                          className="w-full sm:w-auto px-3.5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-medium rounded-lg shadow-md transition-all flex items-center justify-center gap-1.5"
                        >
                          <Icon name="copy" className="w-3.5 h-3.5" />
                          <span>Скопировать прямую ссылку</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 pt-2 border-t border-slate-800">
                    <input
                      type="text"
                      value={customSyncInput}
                      onChange={(e) => setCustomSyncInput(e.target.value)}
                      placeholder="Вставьте Sync ID или ссылку с другого устройства..."
                      className="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-blue-500"
                    />
                    <button
                      type="button"
                      onClick={() => {
                        if (!customSyncInput.trim()) return;
                        let extractedId = customSyncInput.trim();
                        if (extractedId.includes('syncId=')) {
                          try {
                            const urlObj = new URL(extractedId);
                            extractedId = urlObj.searchParams.get('syncId') || extractedId;
                          } catch(e) {}
                        }
                        setSyncId(extractedId);
                        localStorage.setItem('lingua_sync_id', extractedId);
                        setCustomSyncInput('');
                        showToast('Код синхронизации обновлен!', 'success');
                      }}
                      className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium rounded-lg transition-all"
                    >
                      Подключить
                    </button>
                  </div>
                </div>

                {/* Section 2: Gemini API Key */}
                <div className="space-y-3 mb-6">
                  <div className="flex items-center justify-between">
                    <h4 className="text-xs font-semibold text-slate-300">Ключ Google Gemini API (для AI карточек)</h4>
                    {DEFAULT_API_KEY && (
                      <span className="text-[10px] text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">
                        Встроен общий ключ
                      </span>
                    )}
                  </div>
                  <input
                    type="password"
                    value={tempApiKeyInput}
                    onChange={(e) => setTempApiKeyInput(e.target.value)}
                    placeholder={DEFAULT_API_KEY ? "Используется встроенный ключ (можно указывать свой)" : "AIzaSy..."}
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500"
                  />
                  
                  <div className="flex items-center justify-between text-xs">
                    <a
                      href="https://aistudio.google.com/app/apikey"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-flex items-center gap-1 text-blue-400 hover:underline"
                    >
                      <span>Получить бесплатный ключ в AI Studio</span>
                      <Icon name="external-link" className="w-3 h-3" />
                    </a>

                    <button
                      type="button"
                      onClick={() => {
                        setApiKey(tempApiKeyInput.trim());
                        setIsSettingsOpen(false);
                        showToast('API Ключ сохранен!', 'success');
                      }}
                      className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-all"
                    >
                      Сохранить ключ
                    </button>
                  </div>
                </div>

                {/* Section 3: Backup File Import / Export */}
                <div className="pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <button
                    type="button"
                    onClick={handleExportDeck}
                    className="w-full sm:w-auto px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl flex items-center justify-center gap-2 border border-slate-700"
                  >
                    <Icon name="download" className="w-4 h-4" />
                    <span>Скачать файл колоды</span>
                  </button>

                  <label className="w-full sm:w-auto px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl flex items-center justify-center gap-2 border border-slate-700 cursor-pointer">
                    <Icon name="upload" className="w-4 h-4" />
                    <span>Импортировать файл</span>
                    <input type="file" accept=".json" onChange={handleImportDeck} className="hidden" />
                  </label>
                </div>

              </div>
            </div>
          )}

          {/* Modal: Manual Card Creation */}
          {isManualAddOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
                <button
                  onClick={() => setIsManualAddOpen(false)}
                  className="absolute top-4 right-4 text-slate-500 hover:text-slate-300"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="flex items-center gap-3 mb-4">
                  <div className="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center border border-indigo-500/20">
                    <Icon name="edit-3" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-white">Добавить карточку вручную</h3>
                    <p className="text-xs text-slate-400">Без использования AI-генерации</p>
                  </div>
                </div>

                <form onSubmit={handleAddManualCard} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">
                        Слово на английском <span className="text-red-400">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        value={manualForm.english}
                        onChange={(e) => setManualForm(f => ({ ...f, english: e.target.value }))}
                        placeholder="e.g. Opportunity"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">
                        Перевод на русский <span className="text-red-400">*</span>
                      </label>
                      <input
                        type="text"
                        required
                        value={manualForm.russian}
                        onChange={(e) => setManualForm(f => ({ ...f, russian: e.target.value }))}
                        placeholder="e.g. Возможность"
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">
                      Транскрипция (опционально)
                    </label>
                    <input
                      type="text"
                      value={manualForm.transcription}
                      onChange={(e) => setManualForm(f => ({ ...f, transcription: e.target.value }))}
                      placeholder="e.g. [/ˌɒpəˈtjuːnəti/]"
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">
                      Пример на английском (опционально)
                    </label>
                    <input
                      type="text"
                      value={manualForm.exampleEn}
                      onChange={(e) => setManualForm(f => ({ ...f, exampleEn: e.target.value }))}
                      placeholder="e.g. Take every opportunity to learn."
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">
                      Перевод примера (опционально)
                    </label>
                    <input
                      type="text"
                      value={manualForm.exampleRu}
                      onChange={(e) => setManualForm(f => ({ ...f, exampleRu: e.target.value }))}
                      placeholder="e.g. Используй любую возможность учиться."
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>

                  <div className="pt-3 flex items-center justify-end gap-2 border-t border-slate-800/80">
                    <button
                      type="button"
                      onClick={() => setIsManualAddOpen(false)}
                      className="px-3 py-2 text-xs text-slate-400 hover:text-slate-200"
                    >
                      Отмена
                    </button>

                    <button
                      type="submit"
                      className="px-4 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium text-xs rounded-xl transition-all shadow-md"
                    >
                      Создать карточку
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Bulk Upload Words */}
          {isBulkAddOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl relative max-h-[90vh] flex flex-col justify-between">
                
                <button
                  onClick={() => setIsBulkAddOpen(false)}
                  className="absolute top-4 right-4 text-slate-500 hover:text-slate-300"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div>
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center border border-indigo-500/20">
                      <Icon name="list-plus" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-lg font-bold text-white">Массовая загрузка слов</h3>
                      <p className="text-xs text-slate-400">Вставьте список слов или готовых пар с переводом</p>
                    </div>
                  </div>

                  {/* Sample presets helper */}
                  <div className="flex flex-wrap items-center gap-2 mb-3 text-xs">
                    <span className="text-slate-500">Примеры:</span>
                    <button
                      type="button"
                      onClick={() => setBulkInput("Ambitious\nCompassion\nInevitable\nUnprecedented\nPhenomenon")}
                      className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-blue-300 rounded-lg border border-slate-700"
                    >
                      Список английских слов
                    </button>
                    <button
                      type="button"
                      onClick={() => setBulkInput("Adventure - Приключение\nChallenge - Вызов\nDestination - Пункт назначения\nOpportunity - Возможность")}
                      className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-lg border border-slate-700"
                    >
                      Готовые пары (Слово - Перевод)
                    </button>
                  </div>

                  <textarea
                    rows={7}
                    value={bulkInput}
                    onChange={(e) => setBulkInput(e.target.value)}
                    placeholder={`Вставьте список слов по одному на строку, например:\n\nSerendipity\nPerseverance\n\nили в формате:\nApple - Яблоко\nBook - Книга`}
                    className="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-xs sm:text-sm font-mono text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 resize-none shadow-inner"
                  />
                  
                  <p className="text-[11px] text-slate-400 mt-2">
                    💡 <strong>✨ AI Генерация</strong> переведет слова, создаст транскрипцию и примеры. <strong>⚡ Быстрый импорт</strong> мгновенно добавит список пар вида <code className="text-indigo-300 bg-slate-950 px-1 py-0.5 rounded">Слово - Перевод</code>.
                  </p>
                </div>

                <div className="pt-4 mt-4 border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-between gap-2.5">
                  <button
                    type="button"
                    onClick={() => setIsBulkAddOpen(false)}
                    className="w-full sm:w-auto px-4 py-2 text-xs text-slate-400 hover:text-slate-200"
                  >
                    Отмена
                  </button>

                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <button
                      type="button"
                      onClick={handleBulkAddFast}
                      disabled={isBulkProcessing || !bulkInput.trim()}
                      className="flex-1 sm:flex-none px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition-all disabled:opacity-50"
                    >
                      ⚡ Быстрый импорт
                    </button>

                    <button
                      type="button"
                      onClick={handleBulkAddAI}
                      disabled={isBulkProcessing || !bulkInput.trim()}
                      className="flex-1 sm:flex-none px-4 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-semibold rounded-xl transition-all shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {isBulkProcessing ? (
                        <>
                          <div className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                          <span>AI Обработка...</span>
                        </>
                      ) : (
                        <>
                          <Icon name="wand-2" className="w-4 h-4" />
                          <span>✨ AI Генерация</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

          <footer className="border-t border-slate-800/60 py-4 px-4 text-center text-xs text-slate-500 bg-slate-950">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <p>LinguaCards AI — Персональный тренажер английских слов</p>
              <p className="text-slate-600">Синхронизировано в облаке • Gemini AI & Web Speech API</p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
