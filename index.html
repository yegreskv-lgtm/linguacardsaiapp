  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_API_KEY = "AQ.Ab8RN6ISBSPyMyTiUgv4LC9ZFNYBQu82KgCPHX2w6gH9KSKpow";

    // 100 слов для каждой из 4 тем
    const travelStr = "flight|полет,plane|самолет,ticket|билет,airport|аэропорт,passport|паспорт,luggage|багаж,bag|сумка,suitcase|чемодан,gate|выход на посадку,seat|место,passenger|пассажир,customs|таможня,visa|виза,map|карта,hotel|отель,reservation|бронь,reception|ресепшн,key|ключ,room|комната,bed|кровать,breakfast|завтрак,tour|тур,guide|гид,museum|музей,monument|памятник,camera|камера,photo|фото,souvenir|сувенир,train|поезд,station|станция,bus|автобус,taxi|такси,subway|метро,tram|трамвай,stop|остановка,platform|платформа,departure|отправление,arrival|прибытие,delay|задержка,cancel|отмена,board|посадка,ride|поездка,drive|вести машину,rent|аренда,car|машина,bike|велосипед,boat|лодка,ship|корабль,cruise|круиз,port|порт,ocean|океан,sea|море,beach|пляж,sand|песок,sun|солнце,island|остров,mountain|гора,lake|озеро,river|река,forest|лес,nature|природа,city|город,town|городок,village|деревня,street|улица,square|площадь,bridge|мост,building|здание,tower|башня,church|церковь,temple|храм,market|рынок,shop|магазин,buy|покупать,pay|платить,cash|наличные,card|карта,price|цена,expensive|дорогой,cheap|дешевый,free|бесплатно,safe|безопасный,dangerous|опасный,help|помощь,police|полиция,doctor|врач,hospital|больница,pharmacy|аптека,medicine|лекарство,sick|больной,tired|уставший,happy|счастливый,enjoy|наслаждаться,trip|поездка,holiday|праздник,vacation|отпуск,travel|путешествовать,explore|исследовать,discover|открывать,pack|собирать вещи,leave|покидать";
    const restaurantStr = "restaurant|ресторан,cafe|кафе,bar|бар,table|стол,chair|стул,menu|меню,waiter|официант,waitress|официантка,chef|шеф-повар,cook|повар,order|заказ,dish|блюдо,plate|тарелка,bowl|миска,glass|стакан,cup|чашка,fork|вилка,knife|нож,spoon|ложка,napkin|салфетка,breakfast|завтрак,lunch|обед,dinner|ужин,snack|перекус,appetizer|закуска,soup|суп,salad|салат,main|основное блюдо,meat|мясо,steak|стейк,chicken|курица,fish|рыба,seafood|морепродукты,pasta|паста,pizza|пицца,rice|рис,bread|хлеб,butter|масло,cheese|сыр,vegetable|овощ,potato|картофель,tomato|помидор,onion|лук,garlic|чеснок,sauce|соус,pepper|перец,salt|соль,sugar|сахар,dessert|десерт,cake|торт,ice cream|мороженое,chocolate|шоколад,fruit|фрукт,apple|яблоко,banana|банан,orange|апельсин,berry|ягода,drink|напиток,water|вода,tea|чай,coffee|кофе,juice|сок,milk|молоко,beer|пиво,wine|вино,alcohol|алкоголь,bottle|бутылка,ice|лед,hot|горячий,cold|холодный,sweet|сладкий,sour|кислый,spicy|острый,bitter|горький,salty|соленый,fresh|свежий,tasty|вкусный,delicious|очень вкусный,bad|плохой,hungry|голодный,thirsty|испытывающий жажду,full|сытый,diet|диета,vegetarian|вегетарианец,vegan|веган,allergy|аллергия,bill|счет,tip|чаевые,pay|платить,receipt|чек,cash|наличные,card|карта,reserve|бронировать,seat|место,ready|готовый,serve|подавать,eat|есть,drink|пить,taste|пробовать";
    const foodOrderStr = "food|еда,order|заказ,delivery|доставка,menu|меню,cart|корзина,checkout|касса,address|адрес,location|локация,time|время,fast|быстрый,slow|медленный,hot|горячий,warm|теплый,cold|холодный,fresh|свежий,package|посылка,box|коробка,bag|пакет,app|приложение,rating|рейтинг,review|отзыв,star|звезда,tasty|вкусный,delicious|очень вкусный,awful|ужасный,spice|специя,sauce|соус,ketchup|кетчуп,mayo|майонез,mustard|горчица,burger|бургер,fries|картошка фри,pizza|пицца,sushi|суши,roll|ролл,wok|вок,noodle|лапша,soup|суп,salad|салат,meat|мясо,beef|говядина,pork|свинина,chicken|курица,fish|рыба,vegan|веганский,healthy|полезный,diet|диетический,raw|сырой,baked|запеченный,fried|жареный,boiled|вареный,grilled|на гриле,sweet|сладкий,cake|торт,pie|пирог,donut|пончик,cookie|печенье,drink|напиток,soda|газировка,cola|кола,water|вода,juice|сок,ice|лед,size|размер,small|маленький,medium|средний,large|большой,extra|дополнительный,add|добавить,remove|убрать,total|итог,price|цена,cost|стоимость,discount|скидка,promo|промо,code|код,coupon|купон,pay|платить,card|карта,cash|наличные,change|сдача,courier|курьер,tip|чаевые,contact|контакт,call|звонок,text|сообщение,wait|ждать,arrive|прибывать,eat|есть,share|делиться,enjoy|наслаждаться,taste|вкус,flavor|аромат,portion|порция,piece|кусок,slice|ломтик,bite|укус,hungry|голодный,meal|прием пищи,snack|перекус";
    const homeStr = "home|дом,apartment|квартира,flat|квартира,house|дом,room|комната,door|дверь,window|окно,wall|стена,floor|пол,ceiling|потолок,roof|крыша,stairs|лестница,elevator|лифт,balcony|балкон,hall|прихожая,corridor|коридор,living room|гостиная,bedroom|спальня,kitchen|кухня,bathroom|ванная,toilet|туалет,garage|гараж,garden|сад,yard|двор,furniture|мебель,sofa|диван,armchair|кресло,chair|стул,table|стол,desk|письменный стол,bed|кровать,mattress|матрас,pillow|подушка,blanket|одеяло,closet|шкаф,wardrobe|гардероб,shelf|полка,mirror|зеркало,lamp|лампа,light|свет,switch|выключатель,socket|розетка,plug|вилка,rug|коврик,carpet|ковер,curtain|занавеска,blind|жалюзи,plant|растение,pot|горшок,picture|картина,frame|рамка,clock|часы,tv|телевизор,remote|пульт,radio|радио,computer|компьютер,laptop|ноутбук,phone|телефон,charger|зарядка,wifi|вай-фай,router|роутер,appliance|прибор,fridge|холодильник,freezer|морозильник,oven|духовка,stove|плита,microwave|микроволновка,sink|раковина,tap|кран,water|вода,pipe|труба,washing machine|стиральная машина,iron|утюг,vacuum cleaner|пылесос,broom|метла,mop|швабра,bucket|ведро,trash bin|мусорка,towel|полотенце,soap|мыло,shampoo|шампунь,brush|щетка,paste|паста,paper|бумага,key|ключ,lock|замок,ring|звонить,bell|звонок,neighbor|сосед,rent|аренда,mortgage|ипотека,quiet|тихий,loud|громкий,clean|чистый,dirty|грязный,cozy|уютный,spacious|просторный,tiny|крошечный,messy|неопрятный,tidy|аккуратный";

    const parseTheme = (str, prefix) => str.split(',').map((pair, i) => {
      const [en, ru] = pair.split('|');
      return { id: `${prefix}_${i}`, english: en, russian: ru, phonetic: '', example: `This is a ${en}.`, status: 'archived' };
    });

    const TOPICS = [
      { id: 'travel', title: '✈️ Путешествие', description: 'Аэропорт, билеты, транспорт', words: parseTheme(travelStr, 'trav') },
      { id: 'restaurant', title: '🍽 Ресторан', description: 'Заказ блюд, меню, общение с официантом', words: parseTheme(restaurantStr, 'rest') },
      { id: 'food', title: '🛒 Питание и заказ еды', description: 'Продукты, доставка, вкусы', words: parseTheme(foodOrderStr, 'food') },
      { id: 'home', title: '🏠 Описание дома', description: 'Квартира, мебель, быт', words: parseTheme(homeStr, 'home') }
    ];

    function App() {
      // Инициализация глобальной библиотеки слов (пользовательская БД)
      const [allWords, setAllWords] = useState(() => {
        const saved = localStorage.getItem('lc_all_words');
        if (saved) return JSON.parse(saved);
        // Базовые слова для новичка
        return [
          { id: 'start1', english: 'Morning', russian: 'Утро', phonetic: 'ˈmɔːrnɪŋ', example: 'I wake up early in the morning.', status: 'learning' },
          { id: 'start2', english: 'Road', russian: 'Дорога', phonetic: 'roʊd', example: 'The road is very long.', status: 'learning' }
        ];
      });

      // Сессия карточек для изучения
      const [sessionQueue, setSessionQueue] = useState([]);
      const [isFlipped, setIsFlipped] = useState(false);
      
      const [activeTab, setActiveTab] = useState('cards'); // cards, library, topics, friends
      const [libraryTab, setLibraryTab] = useState('learning'); // learning, learned

      const [userId, setUserId] = useState(() => localStorage.getItem('lc_uid') || 'user_' + Math.random().toString(36).substr(2, 6));
      const [userName, setUserName] = useState(() => localStorage.getItem('lc_uname') || '');
      const [showOnboarding, setShowOnboarding] = useState(!localStorage.getItem('lc_registered'));
      const [showSettings, setShowSettings] = useState(false);
      const [showQuickAdd, setShowQuickAdd] = useState(false);
      const [previewTopic, setPreviewTopic] = useState(null);
      const [activeWordModal, setActiveWordModal] = useState(null);
      
      const [importText, setImportText] = useState('');
      const [isImporting, setIsImporting] = useState(false);
      
      // Друзья
      const [following, setFollowing] = useState(() => JSON.parse(localStorage.getItem('lc_following') || '[]'));
      const [viewFriend, setViewFriend] = useState(null); // ID друга для просмотра его библиотеки

      const apiKey = DEFAULT_API_KEY;

      // Синхронизация с LocalStorage
      useEffect(() => {
        localStorage.setItem('lc_all_words', JSON.stringify(allWords));
      }, [allWords]);

      useEffect(() => {
        localStorage.setItem('lc_uid', userId);
        localStorage.setItem('lc_uname', userName);
        localStorage.setItem('lc_following', JSON.stringify(following));
      }, [userId, userName, following]);

      // Подготовка сессии карточек
      useEffect(() => {
        if (sessionQueue.length === 0) {
          const learningWords = allWords.filter(w => w.status === 'learning').map(w => w.id);
          // Перемешиваем при загрузке
          setSessionQueue(learningWords.sort(() => Math.random() - 0.5));
        }
      }, [allWords, activeTab]);

      // QR-код и URL синхронизация
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const syncId = params.get('sync');
        if (syncId && syncId !== userId) {
          setUserId(syncId);
          alert('✅ Устройства успешно синхронизированы!');
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }, [userId]);

      useEffect(() => {
        if (showSettings) {
          setTimeout(() => {
            const qrContainer = document.getElementById('qrcode-container');
            if (qrContainer) {
              qrContainer.innerHTML = '';
              new QRCode(qrContainer, {
                text: `${window.location.origin}${window.location.pathname}?sync=${userId}`,
                width: 140, height: 140, colorDark: "#000", colorLight: "#fff", correctLevel: QRCode.CorrectLevel.H
              });
            }
          }, 200);
        }
      }, [showSettings, userId]);

      // --- ЛОГИКА КАРТОЧЕК (4 кнопки) ---
      const handleSkip = () => {
        // Пропустить: переносим в конец очереди
        setIsFlipped(false);
        setTimeout(() => {
          setSessionQueue(prev => {
            const newQ = [...prev];
            newQ.push(newQ.shift());
            return newQ;
          });
        }, 150);
      };

      const handleDoneSession = () => {
        // Готово (в этой сессии): убираем из очереди, но статус остается learning
        setIsFlipped(false);
        setTimeout(() => {
          setSessionQueue(prev => prev.slice(1));
        }, 150);
      };

      const handleLearned = () => {
        // Выучил насовсем: меняем статус, убираем из очереди
        const wordId = sessionQueue[0];
        setIsFlipped(false);
        setAllWords(prev => prev.map(w => w.id === wordId ? { ...w, status: 'learned' } : w));
        setTimeout(() => {
          setSessionQueue(prev => prev.slice(1));
        }, 150);
      };

      const handleShuffle = () => {
        // Перемешать текущую колоду
        setIsFlipped(false);
        setTimeout(() => {
          setSessionQueue(prev => [...prev].sort(() => Math.random() - 0.5));
        }, 150);
      };

      // --- ПРОИЗНОШЕНИЕ (Text-To-Speech & Speech Recognition) ---
      const playAudio = (text) => {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        window.speechSynthesis.speak(utter);
      };

      const checkMic = (expectedWord) => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Ваш браузер не поддерживает микрофон для проверки речи.");
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.start();
        
        // Визуальная обратная связь для пользователя
        const btn = document.getElementById('mic-btn');
        if(btn) btn.classList.add('animate-pulse', 'bg-red-500');

        recognition.onresult = (event) => {
          if(btn) btn.classList.remove('animate-pulse', 'bg-red-500');
          const spoken = event.results[0][0].transcript.toLowerCase().replace(/[^a-z\s]/g, '').trim();
          const target = expectedWord.toLowerCase().replace(/[^a-z\s]/g, '').trim();
          
          if (spoken === target || spoken.includes(target) || target.includes(spoken)) {
            alert(`✅ Отлично! Вы сказали правильно: "${spoken}"`);
          } else {
            alert(`❌ Вы сказали: "${spoken}". Ожидалось: "${target}". Попробуйте еще раз!`);
          }
        };
        recognition.onerror = () => {
          if(btn) btn.classList.remove('animate-pulse', 'bg-red-500');
          alert("Не удалось распознать речь. Попробуйте сказать громче.");
        };
      };

      // --- КЛИКАБЕЛЬНЫЕ СЛОВА & ДОБАВЛЕНИЕ ---
      const handleTokenClick = (rawWord) => {
        const cleanWord = rawWord.replace(/[^a-zA-Z]/g, '');
        if (!cleanWord) return;
        setActiveWordModal({ word: cleanWord, loading: true, translation: '' });
        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Translate English word "${cleanWord}" to Russian in 1-2 words.` }] }]
          })
        })
        .then(r => r.json())
        .then(data => {
          const trans = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Перевод не найден';
          setActiveWordModal({ word: cleanWord, loading: false, translation: trans.trim() });
        })
        .catch(() => setActiveWordModal({ word: cleanWord, loading: false, translation: 'Ошибка сети' }));
      };

      const addModalWordToLibrary = () => {
        if (!activeWordModal) return;
        const newWord = {
          id: 'w_' + Date.now(),
          english: activeWordModal.word,
          russian: activeWordModal.translation,
          phonetic: '',
          example: `I am learning the word ${activeWordModal.word}.`,
          status: 'learning'
        };
        setAllWords(prev => [newWord, ...prev]);
        setSessionQueue(prev => [newWord.id, ...prev]);
        setActiveWordModal(null);
        alert(`Слово "${activeWordModal.word}" добавлено в изучаемые!`);
      };

      const toggleWordStatus = (wordId, newStatus) => {
        setAllWords(prev => prev.map(w => w.id === wordId ? { ...w, status: newStatus } : w));
        if (newStatus === 'learning') {
          if (!sessionQueue.includes(wordId)) setSessionQueue(prev => [wordId, ...prev]);
        } else {
          setSessionQueue(prev => prev.filter(id => id !== wordId));
        }
      };

      // --- УМНЫЙ ИМПОРТ ---
      const handleSmartImport = () => {
        if (!importText.trim()) return;
        setIsImporting(true);
        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Extract words from text, translate them. Generate flashcards with simple everyday sentences. Return JSON array format: [{"english":"word","russian":"перевод","phonetic":"transcription","example":"simple sentence"}]. Text: ${importText}` }] }]
          })
        })
        .then(r => r.json())
        .then(data => {
          setIsImporting(false);
          const txt = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
          const cleanJson = txt.replace(/```json/g, '').replace(/```/g, '').trim();
          const newWords = JSON.parse(cleanJson).map((w, i) => ({ ...w, id: 'imp_'+Date.now()+i, status: 'learning' }));
          setAllWords(prev => [...newWords, ...prev]);
          setSessionQueue(prev => [...newWords.map(w => w.id), ...prev]);
          alert(`✅ Добавлено ${newWords.length} слов!`);
          setImportText('');
          setShowQuickAdd(false);
          setActiveTab('cards');
        })
        .catch(() => { setIsImporting(false); alert('Ошибка импорта.'); });
      };


      // Активная карточка
      const currentCard = sessionQueue.length > 0 ? allWords.find(w => w.id === sessionQueue[0]) : null;

      // Экран входа
      if (showOnboarding && !userName) {
        return (
          <div className="fixed inset-0 bg-[#090d16] z-50 flex flex-col items-center justify-center p-6 text-center">
            <div className="max-w-md w-full bg-gray-900 border border-gray-800 p-8 rounded-3xl space-y-6 shadow-2xl">
              <div className="w-16 h-16 bg-brand-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl font-bold">✨</div>
              <h1 className="text-2xl font-bold text-white">Добро пожаловать!</h1>
              <input type="text" placeholder="Ваше имя (например, Сергей)" id="onboardName" className="w-full px-4 py-4 bg-gray-800 border border-gray-700 rounded-2xl text-white outline-none focus:border-brand-500 text-lg" />
              <button onClick={() => {
                  const val = document.getElementById('onboardName').value.trim();
                  if (val) { setUserName(val); setShowOnboarding(false); localStorage.setItem('lc_registered', 'true'); }
                }} className="w-full py-4 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-2xl shadow-lg">Начать</button>
            </div>
          </div>
        );
      }

      return (
        <div className="app-container max-w-md mx-auto w-full bg-[#090d16]">
          
          {/* ПРОСТАЯ ШАПКА НАВЕРХУ */}
          <header className="sticky top-0 z-40 bg-[#090d16]/95 backdrop-blur-xl border-b border-gray-800/80 safe-header px-4 pb-3 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-sm">L</div>
              <span className="font-bold text-lg text-gray-100">LinguaCards</span>
            </div>
            <button onClick={() => setShowSettings(true)} className="p-2 bg-gray-800 rounded-xl text-gray-300 hover:text-white">⚙️</button>
          </header>

          <main className="p-4 flex-1 flex flex-col overflow-y-auto pb-24">
            
            {/* ТАБ 1: КАРТОЧКИ */}
            {activeTab === 'cards' && (
              <div className="flex-1 flex flex-col justify-center">
                {currentCard ? (
                  <>
                    <div onClick={() => setIsFlipped(!isFlipped)} className="card-flip w-full cursor-pointer min-h-[360px]">
                      <div className={`card-inner relative w-full h-full rounded-3xl bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700/60 p-6 flex flex-col justify-between shadow-2xl ${isFlipped ? 'card-flipped' : ''}`}>
                        
                        <div className="card-front absolute inset-0 p-6 flex flex-col justify-between items-center text-center">
                          <div className="w-full flex justify-between items-center">
                             <span className="text-xs text-gray-400 font-semibold bg-gray-800 px-3 py-1 rounded-full">Осталось: {sessionQueue.length}</span>
                             <span className="text-xs text-brand-400 font-semibold bg-brand-900/20 px-3 py-1 rounded-full">НАЖМИТЕ ДЛЯ ПЕРЕВОДА 🔄</span>
                          </div>
                          <div className="my-auto w-full">
                            <h2 className="text-4xl font-extrabold text-white mb-2">{currentCard.english}</h2>
                            {currentCard.phonetic && <p className="text-base text-gray-400">[{currentCard.phonetic}]</p>}
                            
                            {/* Кнопки аудио и микрофона на карточке */}
                            <div className="flex space-x-4 mt-6 justify-center">
                              <button onClick={(e) => { e.stopPropagation(); playAudio(currentCard.english); }} className="w-12 h-12 flex items-center justify-center bg-gray-700 hover:bg-gray-600 rounded-full text-xl shadow-lg transition-transform active:scale-95">🔊</button>
                              <button id="mic-btn" onClick={(e) => { e.stopPropagation(); checkMic(currentCard.english); }} className="w-12 h-12 flex items-center justify-center bg-brand-600 hover:bg-brand-500 rounded-full text-xl shadow-lg transition-transform active:scale-95">🎤</button>
                            </div>
                          </div>
                        </div>
                        
                        <div className="card-back absolute inset-0 p-6 flex flex-col justify-between items-center text-center">
                          <div className="text-xs text-emerald-400 font-bold bg-emerald-900/20 px-3 py-1 rounded-full mb-4">ПЕРЕВОД & ПРИМЕР</div>
                          <div className="my-auto w-full">
                            <h3 className="text-3xl font-bold text-white mb-4">{currentCard.russian}</h3>
                            {currentCard.example && (
                              <div className="p-4 bg-gray-950/80 rounded-2xl border border-gray-700/50 shadow-inner">
                                <div className="text-lg text-gray-200 leading-relaxed font-medium">
                                  {currentCard.example.split(/\s+/).map((word, idx) => (
                                    <span key={idx} onClick={(e) => { e.stopPropagation(); handleTokenClick(word); }} className="inline-block hover:text-brand-400 hover:bg-brand-900/30 px-1 py-0.5 rounded cursor-pointer transition-colors">
                                      {word}{' '}
                                    </span>
                                  ))}
                                </div>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>
                    
                    {/* Четыре кнопки управления сессией */}
                    <div className="grid grid-cols-2 gap-3 mt-6">
                      <button onClick={handleSkip} className="py-3 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-2xl border border-gray-700 text-sm">Пропустить</button>
                      <button onClick={handleShuffle} className="py-3 bg-gray-800 hover:bg-gray-700 text-brand-300 font-bold rounded-2xl border border-gray-700 text-sm">Перемешать 🔀</button>
                      <button onClick={handleDoneSession} className="py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg text-sm">Готово (сессия) ✓</button>
                      <button onClick={handleLearned} className="py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl shadow-lg text-sm">Выучил (насовсем) 🌟</button>
                    </div>
                  </>
                ) : (
                  <div className="text-center py-20">
                    <div className="text-6xl mb-4">🎉</div>
                    <h2 className="text-2xl font-bold text-white mb-2">Сессия завершена!</h2>
                    <p className="text-gray-400 mb-6">Вы повторили все слова из текущей очереди.</p>
                    <button onClick={() => {
                      const learningWords = allWords.filter(w => w.status === 'learning').map(w => w.id);
                      setSessionQueue(learningWords.sort(() => Math.random() - 0.5));
                    }} className="px-6 py-3 bg-brand-600 text-white font-bold rounded-2xl">Начать заново 🔄</button>
                  </div>
                )}
              </div>
            )}

            {/* ТАБ 2: БИБЛИОТЕКА СЛОВ (Импорт + Списки) */}
            {activeTab === 'library' && (
              <div className="space-y-4">
                <h2 className="text-2xl font-bold text-white">Моя библиотека</h2>
                
                {/* Строка быстрого импорта */}
                <div className="p-4 bg-gray-900 border border-gray-800 rounded-3xl">
                  <p className="text-xs text-gray-400 mb-2">Добавить слова (по одному или пачкой):</p>
                  <div className="flex space-x-2">
                    <input type="text" value={importText} onChange={e=>setImportText(e.target.value)} placeholder="Например: apple, book..." className="flex-1 bg-gray-800 text-white px-4 py-3 rounded-2xl outline-none text-sm border border-gray-700 focus:border-brand-500" />
                    <button onClick={handleSmartImport} disabled={isImporting} className="px-4 bg-brand-600 text-white rounded-2xl font-bold text-sm shadow-lg shrink-0">
                      {isImporting ? '⏳' : '➕ AI'}
                    </button>
                  </div>
                </div>

                {/* Вкладки библиотеки */}
                <div className="flex space-x-2 bg-gray-900 p-1 rounded-2xl border border-gray-800">
                  <button onClick={() => setLibraryTab('learning')} className={`flex-1 py-2 text-sm font-bold rounded-xl transition-colors ${libraryTab === 'learning' ? 'bg-brand-600 text-white' : 'text-gray-400'}`}>Изучаю ({allWords.filter(w=>w.status==='learning').length})</button>
                  <button onClick={() => setLibraryTab('learned')} className={`flex-1 py-2 text-sm font-bold rounded-xl transition-colors ${libraryTab === 'learned' ? 'bg-emerald-600 text-white' : 'text-gray-400'}`}>Выучил ({allWords.filter(w=>w.status==='learned').length})</button>
                </div>

                {/* Список слов */}
                <div className="space-y-2 max-h-[50vh] overflow-y-auto pr-1">
                  {allWords.filter(w => w.status === libraryTab).map(w => (
                    <div key={w.id} className="flex justify-between items-center bg-gray-900 p-3 rounded-2xl border border-gray-800">
                      <div>
                        <div className="text-white font-bold">{w.english} <span className="text-xs text-gray-500 font-normal">[{w.phonetic}]</span></div>
                        <div className="text-brand-400 text-xs">{w.russian}</div>
                      </div>
                      <div className="flex space-x-2">
                        {libraryTab === 'learned' ? (
                          <button onClick={()=>toggleWordStatus(w.id, 'learning')} className="w-8 h-8 flex items-center justify-center bg-gray-800 rounded-lg text-gray-300 hover:text-white" title="Вернуть в изучение">🔙</button>
                        ) : (
                          <button onClick={()=>toggleWordStatus(w.id, 'learned')} className="w-8 h-8 flex items-center justify-center bg-emerald-900/30 text-emerald-400 rounded-lg hover:bg-emerald-600 hover:text-white" title="Отметить как выученное">✓</button>
                        )}
                        <button onClick={()=>{
                          if(confirm('Удалить слово навсегда?')) setAllWords(prev => prev.filter(x => x.id !== w.id));
                        }} className="w-8 h-8 flex items-center justify-center bg-gray-800 rounded-lg text-red-400 hover:bg-red-500 hover:text-white" title="Удалить">✕</button>
                      </div>
                    </div>
                  ))}
                  {allWords.filter(w => w.status === libraryTab).length === 0 && (
                    <p className="text-center text-gray-500 py-4 text-sm">Список пуст</p>
                  )}
                </div>
              </div>
            )}

            {/* ТАБ 3: ТЕМЫ (4 темы по 100 слов) */}
            {activeTab === 'topics' && (
              <div className="space-y-4">
                <h2 className="text-2xl font-bold text-white mb-4">📂 Подборки (по 100 слов)</h2>
                {TOPICS.map(col => (
                  <div key={col.id} className="p-5 bg-gray-900 border border-gray-800 rounded-3xl space-y-3 shadow-lg">
                    <h3 className="text-lg font-bold text-brand-400">{col.title}</h3>
                    <p className="text-sm text-gray-400 leading-snug">{col.description}</p>
                    <button onClick={() => setPreviewTopic(col)} className="w-full py-3 bg-gray-800 hover:bg-gray-700 rounded-2xl text-sm font-semibold text-white border border-gray-700 transition-colors">
                      Посмотреть слова ({col.words.length})
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* ТАБ 4: ДРУЗЬЯ (Рейтинг и просмотр библиотек) */}
            {activeTab === 'friends' && (
              <div className="space-y-4 flex-1 flex flex-col">
                <h2 className="text-2xl font-bold text-white">👥 Друзья</h2>
                <div className="p-4 bg-gray-900 border border-gray-800 rounded-3xl space-y-3 shadow-lg">
                  <div className="flex justify-between items-center text-sm mb-2">
                    <span className="text-gray-300 font-semibold">Ваш ID: <code className="text-brand-400 text-xs bg-gray-800 px-2 py-1 rounded">{userId}</code></span>
                  </div>
                  <div className="flex justify-between text-sm text-gray-400">
                    <span>Всего слов: <strong className="text-white">{allWords.length}</strong></span>
                    <span>Выучено: <strong className="text-emerald-400">{allWords.filter(w=>w.status==='learned').length}</strong></span>
                  </div>
                  <button onClick={() => {
                    const link = `${window.location.origin}${window.location.pathname}?sync=${userId}`;
                    navigator.clipboard.writeText(link);
                    alert('Ссылка для друга скопирована!');
                  }} className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white text-sm font-bold rounded-2xl shadow-lg mt-2">🔗 Поделиться прогрессом</button>
                </div>

                <h3 className="text-lg font-bold text-white mt-4">Рейтинг</h3>
                {/* Имитация друзей для демонстрации */}
                <div className="space-y-2">
                  <div onClick={() => setViewFriend({name: 'Алексей', total: 120, learned: 45})} className="bg-gray-900 p-4 rounded-2xl border border-gray-800 flex justify-between items-center cursor-pointer hover:bg-gray-800">
                    <div>
                      <div className="font-bold text-white">Алексей 🥇</div>
                      <div className="text-xs text-gray-400">Всего: 120 | Выучил: 45</div>
                    </div>
                    <div className="text-brand-400 text-sm">Смотреть ➔</div>
                  </div>
                  <div onClick={() => setViewFriend({name: 'Маруся', total: 85, learned: 20})} className="bg-gray-900 p-4 rounded-2xl border border-gray-800 flex justify-between items-center cursor-pointer hover:bg-gray-800">
                    <div>
                      <div className="font-bold text-white">Маруся 🥈</div>
                      <div className="text-xs text-gray-400">Всего: 85 | Выучил: 20</div>
                    </div>
                    <div className="text-brand-400 text-sm">Смотреть ➔</div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* НИЖНЕЕ МЕНЮ (Bottom Tab Bar) */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#090d16]/95 backdrop-blur-xl border-t border-gray-800/80 safe-bottom px-2 py-2 flex items-center justify-around">
            <button onClick={() => setActiveTab('cards')} className={`flex flex-col items-center p-2 rounded-xl w-16 transition-colors ${activeTab === 'cards' ? 'text-brand-500' : 'text-gray-500 hover:text-gray-300'}`}>
              <span className="text-2xl mb-1">🎴</span><span className="text-[10px] font-bold">Тренажер</span>
            </button>
            <button onClick={() => setActiveTab('library')} className={`flex flex-col items-center p-2 rounded-xl w-16 transition-colors ${activeTab === 'library' ? 'text-brand-500' : 'text-gray-500 hover:text-gray-300'}`}>
              <span className="text-2xl mb-1">📚</span><span className="text-[10px] font-bold">Слова</span>
            </button>
            <button onClick={() => setActiveTab('topics')} className={`flex flex-col items-center p-2 rounded-xl w-16 transition-colors ${activeTab === 'topics' ? 'text-brand-500' : 'text-gray-500 hover:text-gray-300'}`}>
              <span className="text-2xl mb-1">📂</span><span className="text-[10px] font-bold">Темы</span>
            </button>
            <button onClick={() => setActiveTab('friends')} className={`flex flex-col items-center p-2 rounded-xl w-16 transition-colors ${activeTab === 'friends' ? 'text-brand-500' : 'text-gray-500 hover:text-gray-300'}`}>
              <span className="text-2xl mb-1">👥</span><span className="text-[10px] font-bold">Друзья</span>
            </button>
          </nav>

          {/* КНОПКА ПЛЮС НА ГЛАВНОМ ЭКРАНЕ (+) */}
          {activeTab === 'cards' && (
            <button onClick={() => { setActiveTab('library'); document.querySelector('input').focus(); }} className="fixed bottom-24 right-6 w-16 h-16 bg-brand-600 hover:bg-brand-500 rounded-full shadow-[0_4px_20px_rgba(99,102,241,0.5)] flex items-center justify-center text-4xl text-white z-30 pb-1 transition-transform active:scale-95">
              +
            </button>
          )}

          {/* Модалка Предпросмотра Тем */}
          {previewTopic && (
            <div className="fixed inset-0 bg-[#090d16]/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-700 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
                <h3 className="text-xl font-bold text-white mb-2">{previewTopic.title}</h3>
                <div className="max-h-60 overflow-y-auto space-y-2 pr-2">
                  {previewTopic.words.map((w, i) => (
                    <div key={i} className="flex justify-between items-center text-sm p-3 bg-gray-800 rounded-xl">
                      <span className="font-bold text-white">{w.english}</span>
                      <span className="text-gray-400">{w.russian}</span>
                    </div>
                  ))}
                </div>
                <div className="flex space-x-3 pt-4">
                  <button onClick={() => setPreviewTopic(null)} className="flex-1 py-3 bg-gray-800 hover:bg-gray-700 text-sm text-gray-300 rounded-2xl font-medium transition-colors">Закрыть</button>
                  <button onClick={() => {
                      const newWords = previewTopic.words.map(w => ({...w, id: Date.now() + Math.random(), status: 'learning'}));
                      setAllWords(prev => [...newWords, ...prev]);
                      setSessionQueue(prev => [...newWords.map(w=>w.id), ...prev]);
                      alert('100 слов добавлены в вашу библиотеку для изучения!');
                      setPreviewTopic(null);
                      setActiveTab('cards');
                  }} className="flex-1 py-3 bg-brand-600 hover:bg-brand-500 text-sm text-white font-bold rounded-2xl shadow-lg transition-colors">
                    Добавить все
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Модалка просмотра друга */}
          {viewFriend && (
            <div className="fixed inset-0 bg-[#090d16]/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-700 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
                <h3 className="text-xl font-bold text-white mb-2">Библиотека: {viewFriend.name}</h3>
                <p className="text-xs text-gray-400">Демонстрация. В реальном приложении здесь подгружаются карточки друга из облака.</p>
                <div className="max-h-40 overflow-y-auto space-y-2 pr-2 bg-gray-950/50 p-2 rounded-xl">
                  <div className="text-sm p-2 bg-gray-800 rounded-lg text-white">Apple - Яблоко</div>
                  <div className="text-sm p-2 bg-gray-800 rounded-lg text-white">Car - Машина</div>
                  <div className="text-sm p-2 bg-gray-800 rounded-lg text-white">Travel - Путешествие</div>
                </div>
                <button onClick={() => setViewFriend(null)} className="w-full py-3 bg-gray-800 hover:bg-gray-700 text-sm text-white font-bold rounded-2xl transition-colors">Закрыть</button>
              </div>
            </div>
          )}

          {/* ⚙️ НАСТРОЙКИ & QR-КОД */}
          {showSettings && (
            <div className="fixed inset-0 bg-[#090d16]/95 backdrop-blur-xl z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-700 p-6 rounded-3xl max-w-sm w-full space-y-6 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-xl font-bold text-white">⚙️ Настройки</h3>
                  <button onClick={() => setShowSettings(false)} className="w-8 h-8 flex items-center justify-center bg-gray-800 rounded-full text-gray-400 hover:text-white transition-colors">✕</button>
                </div>
                <div className="space-y-2">
                  <label className="text-sm font-medium text-gray-400">Ваше имя:</label>
                  <input type="text" value={userName} onChange={e => setUserName(e.target.value)} className="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-2xl text-white text-base outline-none focus:border-brand-500" />
                </div>
                <div className="pt-4 text-center border-t border-gray-800">
                  <label className="text-sm font-bold text-white block mb-4">Синхронизация устройств</label>
                  <p className="text-xs text-gray-400 mb-4 leading-relaxed">Отсканируйте QR-код смартфоном, чтобы подтянуть карточки.</p>
                  <div className="bg-white p-3 rounded-2xl inline-block shadow-lg mx-auto">
                    <div id="qrcode-container"></div>
                  </div>
                </div>
                <button onClick={() => setShowSettings(false)} className="w-full py-4 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-2xl text-base shadow-lg transition-transform active:scale-95 mt-4">Готово</button>
              </div>
            </div>
          )}

          {/* Модалка для клика по отдельному слову */}
          {activeWordModal && (
            <div className="fixed inset-0 bg-[#090d16]/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-brand-500/50 p-6 rounded-3xl max-w-xs w-full text-center space-y-4 shadow-[0_0_40px_rgba(99,102,241,0.2)]">
                <h4 className="text-3xl font-extrabold text-white">{activeWordModal.word}</h4>
                {activeWordModal.loading ? (
                  <div className="text-sm text-brand-400 animate-pulse font-medium">Перевожу...</div>
                ) : (
                  <p className="text-xl text-emerald-400 font-bold">{activeWordModal.translation}</p>
                )}
                <div className="flex space-x-3 pt-4">
                  <button onClick={() => setActiveWordModal(null)} className="flex-1 py-3 bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-medium rounded-2xl transition-colors">Закрыть</button>
                  <button onClick={addModalWordToLibrary} className="flex-1 py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold text-sm rounded-2xl shadow-lg transition-transform active:scale-95">Добавить</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
