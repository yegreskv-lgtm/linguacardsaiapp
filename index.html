<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LinguaCards AI — Тренажер английских слов</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LinguaCards" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      background-color: #090d16;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    .safe-top { padding-top: max(12px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(20px, env(safe-area-inset-bottom)); }
    .card-flip { perspective: 1000px; }
    .card-inner {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; }
    .card-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_API_KEY = "AQ.Ab8RN6ISBSPyMyTiUgv4LC9ZFNYBQu82KgCPHX2w6gH9KSKpow";
    
    const INITIAL_COLLECTIONS = [
      {
        id: 'travel',
        title: '✈️ Путешествия & Аэропорт',
        description: 'Перелеты, отели, таможня и ориентация',
        levels: {
          beginner: [
            { id: 't1', english: 'Passport', russian: 'Паспорт', phonetic: 'ˈpæspɔːrt', example: 'Show your passport at check-in.' },
            { id: 't2', english: 'Ticket', russian: 'Билет', phonetic: 'ˈtɪkɪt', example: 'I booked a round-trip ticket.' }
          ],
          intermediate: [
            { id: 't3', english: 'Accommodation', russian: 'Жилье', phonetic: 'əˌkɑːməˈdeɪʃn', example: 'We found affordable accommodation.' }
          ],
          advanced: [
            { id: 't4', english: 'Layover', russian: 'Пересадка', phonetic: 'ˈleɪoʊvər', example: 'We had a layover in Istanbul.' }
          ]
        }
      },
      {
        id: 'expeditions',
        title: '🏕 Оффроуд и Экспедиции',
        description: 'Слова для автопутешествий, кемпинга и треккинга',
        levels: {
          beginner: [
            { id: 'e1', english: 'Tent', russian: 'Палатка', phonetic: 'tent', example: 'We pitched the roof tent.' },
            { id: 'e2', english: 'Tire', russian: 'Шина', phonetic: 'ˈtaɪər', example: 'I need to deflate the tires.' }
          ],
          intermediate: [
            { id: 'e3', english: 'Suspension', russian: 'Подвеска', phonetic: 'səˈspenʃn', example: 'We upgraded the shock absorbers.' },
            { id: 'e4', english: 'Navigation', russian: 'Навигация', phonetic: 'ˌnævɪˈɡeɪʃn', example: 'Satellite internet helps with navigation.' }
          ],
          advanced: [
            { id: 'e5', english: 'Overlanding', russian: 'Автопутешествие', phonetic: 'ˈoʊvərlændɪŋ', example: 'Overlanding across Central Asia requires preparation.' }
          ]
        }
      },
      {
        id: 'dining',
        title: '🍕 Рестораны & Еда',
        description: 'Заказ блюд, кафе и меню',
        levels: {
          beginner: [
            { id: 'd1', english: 'Menu', russian: 'Меню', phonetic: 'ˈmenjuː', example: 'Could we have the menu please?' },
            { id: 'd2', english: 'Bill', russian: 'Счет', phonetic: 'bɪl', example: 'Can I pay the bill by card?' }
          ],
          intermediate: [
            { id: 'd3', english: 'Appetizer', russian: 'Закуска', phonetic: 'ˈæpɪtaɪzər', example: 'We ordered soup as an appetizer.' }
          ],
          advanced: [
            { id: 'd4', english: 'Cuisine', russian: 'Кухня', phonetic: 'kwɪˈziːn', example: 'This restaurant offers authentic cuisine.' }
          ]
        }
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('cards'); 
      const [cards, setCards] = useState([
        { id: '1', english: 'Serendipity', russian: 'Счастливая случайность', phonetic: 'ˌserənˈdɪpəti', example: 'Finding this peaceful place was pure serendipity.' }
      ]);
      const [learnedIds, setLearnedIds] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [apiKey, setApiKey] = useState(DEFAULT_API_KEY);
      
      const [userId, setUserId] = useState(() => localStorage.getItem('lc_uid') || 'user_' + Math.random().toString(36).substr(2, 6));
      const [userName, setUserName] = useState(() => localStorage.getItem('lc_uname') || '');
      const [following, setFollowing] = useState(() => JSON.parse(localStorage.getItem('lc_following') || '[]'));
      
      const [showOnboarding, setShowOnboarding] = useState(!localStorage.getItem('lc_registered'));
      const [showSettings, setShowSettings] = useState(false);
      const [previewTopic, setPreviewTopic] = useState(null);
      const [activeWordModal, setActiveWordModal] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      
      // Import
      const [importText, setImportText] = useState('');
      const [isImporting, setIsImporting] = useState(false);

      // Speech
      const [voices, setVoices] = useState([]);
      const [selectedVoice, setSelectedVoice] = useState('');
      const [speechStatus, setSpeechStatus] = useState('Нажмите для проверки');

      useEffect(() => {
        localStorage.setItem('lc_uid', userId);
        localStorage.setItem('lc_uname', userName);
        localStorage.setItem('lc_following', JSON.stringify(following));
      }, [userId, userName, following]);

      useEffect(() => {
        const loadVoices = () => {
          const vList = window.speechSynthesis.getVoices();
          setVoices(vList);
          if (vList.length && !selectedVoice) {
            const def = vList.find(v => v.lang.includes('en')) || vList[0];
            setSelectedVoice(def.name);
          }
        };
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }, []);

      const handleTokenClick = (word) => {
        const cleanWord = word.replace(/[^a-zA-Z]/g, '');
        if (!cleanWord) return;
        setActiveWordModal({ word: cleanWord, loading: true, translation: '' });
        
        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Translate English word "${cleanWord}" to Russian briefly (1-2 words only).` }] }]
          })
        })
        .then(r => r.json())
        .then(data => {
          const trans = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Перевод';
          setActiveWordModal({ word: cleanWord, loading: false, translation: trans.trim() });
        })
        .catch(() => setActiveWordModal({ word: cleanWord, loading: false, translation: 'Ошибка' }));
      };

      const addModalWordToDeck = () => {
        if (!activeWordModal) return;
        setCards(prev => [{
          id: Date.now().toString(),
          english: activeWordModal.word,
          russian: activeWordModal.translation,
          phonetic: '',
          example: `Context: ${activeWordModal.word}`
        }, ...prev]);
        setActiveWordModal(null);
      };

      const generateMoreWords = (col, lvl) => {
        setIsGenerating(true);
        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Generate 20 English vocabulary words for topic "${col.title}" with level "${lvl}". Return ONLY valid JSON array format like [{"english":"word","russian":"перевод","phonetic":"transcription","example":"sentence"}].` }] }]
          })
        })
        .then(r => r.json())
        .then(data => {
          setIsGenerating(false);
          const txt = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
          const cleanJson = txt.replace(/```json/g, '').replace(/```/g, '').trim();
          const newWords = JSON.parse(cleanJson);
          setCards(prev => [...newWords.map((w, i) => ({ ...w, id: Date.now() + i })), ...prev]);
          alert(`Успешно добавлено 20 новых слов!`);
          setPreviewTopic(null);
        })
        .catch(() => { setIsGenerating(false); alert('Ошибка генерации.'); });
      };

      const handleSmartImport = () => {
        if (!importText.trim()) return;
        setIsImporting(true);
        fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Extract all words or phrases from this mixed Russian/English text, translate them appropriately to build English flashcards. Return ONLY valid JSON array format like [{"english":"word","russian":"перевод","phonetic":"transcription","example":"context sentence"}]. Text: ${importText}` }] }]
          })
        })
        .then(r => r.json())
        .then(data => {
          setIsImporting(false);
          const txt = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
          const cleanJson = txt.replace(/```json/g, '').replace(/```/g, '').trim();
          const newWords = JSON.parse(cleanJson);
          setCards(prev => [...newWords.map((w, i) => ({ ...w, id: 'imp_'+Date.now() + i })), ...prev]);
          alert(`Импортировано ${newWords.length} слов!`);
          setImportText('');
        })
        .catch(() => { setIsImporting(false); alert('Ошибка импорта.'); });
      };

      const currentCard = cards[currentIndex] || cards[0];

      if (showOnboarding && !userName) {
        return (
          <div className="fixed inset-0 bg-[#090d16] z-50 flex flex-col items-center justify-center p-6 text-center">
            <div className="max-w-md w-full bg-gray-900 border border-gray-800 p-6 rounded-3xl space-y-4 shadow-2xl">
              <div className="w-14 h-14 bg-brand-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold">✨</div>
              <h1 className="text-2xl font-bold text-white">Добро пожаловать в LinguaCards!</h1>
              <p className="text-sm text-gray-400">Введите ваше имя, чтобы начать обучение и соревноваться с друзьями.</p>
              <input 
                type="text" 
                placeholder="Ваше имя (например, Сергей)" 
                id="onboardName"
                className="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white outline-none focus:border-brand-500"
              />
              <button 
                onClick={() => {
                  const val = document.getElementById('onboardName').value.trim();
                  if (val) {
                    setUserName(val);
                    setShowOnboarding(false);
                    localStorage.setItem('lc_registered', 'true');
                  }
                }}
                className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg"
              >
                Начать обучение
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="flex-1 flex flex-col max-w-md mx-auto w-full pb-24 h-screen">
          <header className="sticky top-0 z-40 bg-[#090d16]/95 backdrop-blur-md border-b border-gray-800/80 safe-top px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white font-bold text-sm">L</div>
              <span className="font-bold text-sm text-gray-100 truncate">LinguaCards</span>
            </div>

            <nav className="flex items-center space-x-1 bg-gray-900/90 p-1 rounded-xl border border-gray-800 text-xs shrink-0">
              <button onClick={() => setActiveTab('cards')} className={`px-2 py-1.5 rounded-lg transition ${activeTab === 'cards' ? 'bg-brand-600 text-white' : 'text-gray-400'}`}>🎴</button>
              <button onClick={() => setActiveTab('topics')} className={`px-2 py-1.5 rounded-lg transition ${activeTab === 'topics' ? 'bg-brand-600 text-white' : 'text-gray-400'}`}>📚</button>
              <button onClick={() => setActiveTab('import')} className={`px-2 py-1.5 rounded-lg transition ${activeTab === 'import' ? 'bg-brand-600 text-white' : 'text-gray-400'}`}>➕</button>
              <button onClick={() => setActiveTab('speech')} className={`px-2 py-1.5 rounded-lg transition ${activeTab === 'speech' ? 'bg-brand-600 text-white' : 'text-gray-400'}`}>🎤</button>
              <button onClick={() => setActiveTab('leaderboard')} className={`px-2 py-1.5 rounded-lg transition ${activeTab === 'leaderboard' ? 'bg-brand-600 text-white' : 'text-gray-400'}`}>🏆</button>
            </nav>

            <button onClick={() => setShowSettings(true)} className="p-2 text-gray-400 hover:text-white rounded-lg shrink-0">⚙️</button>
          </header>

          <main className="p-4 flex-1 flex flex-col overflow-y-auto">
            {activeTab === 'cards' && currentCard && (
              <div className="flex-1 flex flex-col justify-center my-auto">
                <div onClick={() => setIsFlipped(!isFlipped)} className="card-flip w-full cursor-pointer min-h-[320px]">
                  <div className={`card-inner relative w-full h-full rounded-2xl bg-gradient-to-b from-gray-800/90 to-gray-900 border border-gray-700/60 p-6 flex flex-col justify-between shadow-2xl ${isFlipped ? 'card-flipped' : ''}`}>
                    <div className="card-front absolute inset-0 p-6 flex flex-col justify-between">
                      <div className="text-xs text-gray-400 font-semibold tracking-wider">НАЖМИТЕ ДЛЯ ПЕРЕВОДА 🔄</div>
                      <div className="text-center my-auto">
                        <h2 className="text-3xl font-extrabold text-white">{currentCard.english}</h2>
                        {currentCard.phonetic && <p className="text-sm text-brand-400 mt-2">[{currentCard.phonetic}]</p>}
                      </div>
                      <div className="text-xs text-gray-500 text-center">Карточка {currentIndex + 1} из {cards.length}</div>
                    </div>
                    <div className="card-back absolute inset-0 p-6 flex flex-col justify-between">
                      <div className="text-xs text-brand-400 font-bold">ПЕРЕВОД & ПРИМЕР</div>
                      <div className="text-center my-auto">
                        <h3 className="text-2xl font-bold text-emerald-400">{currentCard.russian}</h3>
                        {currentCard.example && (
                          <div className="mt-4 p-3 bg-gray-950/60 rounded-xl border border-gray-800 text-sm text-gray-300">
                            {currentCard.example.split(' ').map((w, idx) => (
                              <span key={idx} onClick={(e) => { e.stopPropagation(); handleTokenClick(w); }} className="inline-block hover:text-brand-400 hover:underline cursor-pointer px-0.5">
                                {w}{' '}
                              </span>
                            ))}
                          </div>
                        )}
                      </div>
                      <div className="text-xs text-gray-500 text-center">Нажмите слово для перевода</div>
                    </div>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3 mt-6">
                  <button onClick={() => setCurrentIndex((currentIndex + 1) % cards.length)} className="py-3 bg-gray-800 hover:bg-gray-700 text-gray-200 font-semibold rounded-xl border border-gray-700">Пропустить</button>
                  <button onClick={() => { setLearnedIds([...learnedIds, currentCard.id]); setCurrentIndex((currentIndex + 1) % cards.length); }} className="py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg">✓ Выучил</button>
                </div>
              </div>
            )}

            {activeTab === 'topics' && (
              <div className="space-y-4">
                <h2 className="text-lg font-bold text-white">📚 Подборки по темам и уровням</h2>
                {INITIAL_COLLECTIONS.map(col => (
                  <div key={col.id} className="p-4 bg-gray-900 border border-gray-800 rounded-2xl space-y-3">
                    <h3 className="font-bold text-brand-400">{col.title}</h3>
                    <p className="text-xs text-gray-400">{col.description}</p>
                    <div className="grid grid-cols-3 gap-2 pt-1">
                      {['beginner', 'intermediate', 'advanced'].map(lvl => (
                        <button key={lvl} onClick={() => setPreviewTopic({ col, lvl })} className="py-2 px-1 bg-gray-800 hover:bg-brand-600 rounded-lg text-xs font-semibold text-center border border-gray-700">
                          {lvl === 'beginner' ? '🟢 A1-A2' : lvl === 'intermediate' ? '🟡 B1-B2' : '🔴 C1-C2'}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'import' && (
              <div className="space-y-4 flex-1 flex flex-col">
                <h2 className="text-lg font-bold text-white">➕ Умный импорт слов</h2>
                <p className="text-xs text-gray-400">Вставьте текст или список слов на русском/английском. AI автоматически переведет их и создаст карточки с примерами.</p>
                <textarea 
                  className="flex-1 w-full bg-gray-900 border border-gray-800 rounded-2xl p-4 text-white resize-none outline-none focus:border-brand-500 text-sm"
                  placeholder="Например: &#10;dog&#10;кошка&#10;I want to learn words about off-road driving..."
                  value={importText}
                  onChange={(e) => setImportText(e.target.value)}
                ></textarea>
                <button 
                  onClick={handleSmartImport} 
                  disabled={isImporting}
                  className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg disabled:opacity-50"
                >
                  {isImporting ? 'Распознавание AI...' : 'Импортировать карточки ✨'}
                </button>
              </div>
            )}

            {activeTab === 'speech' && (
              <div className="space-y-4 my-auto text-center">
                <h2 className="text-lg font-bold text-white">🎤 Тренажер произношения</h2>
                <div className="p-6 bg-gray-900 border border-gray-800 rounded-2xl space-y-4">
                  <div className="text-xl font-bold text-brand-400">{currentCard.russian}</div>
                  <button onClick={() => {
                    const utter = new SpeechSynthesisUtterance(currentCard.english);
                    if(selectedVoice) {
                        const v = window.speechSynthesis.getVoices().find(vx => vx.name === selectedVoice);
                        if(v) utter.voice = v;
                    }
                    window.speechSynthesis.speak(utter);
                  }} className="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs rounded-xl font-bold">🔊 Послушать оригинал</button>
                  <p className="text-xs text-gray-300">{speechStatus}</p>
                </div>
              </div>
            )}

            {activeTab === 'leaderboard' && (
              <div className="space-y-4">
                <h2 className="text-lg font-bold text-white">🏆 Рейтинг друзей</h2>
                <div className="p-4 bg-gray-900 border border-gray-800 rounded-2xl space-y-3">
                  <div className="flex justify-between items-center text-sm">
                    <span className="text-gray-300 font-semibold">Ваш ID: <code className="text-brand-400">{userId}</code></span>
                    <span className="text-emerald-400 font-bold">{learnedIds.length} выучено</span>
                  </div>
                  <button onClick={() => {
                    const link = `${window.location.origin}?follow=${userId}`;
                    navigator.clipboard.writeText(link);
                    alert('Ссылка для друга скопирована!');
                  }} className="w-full py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold rounded-xl">🔗 Скопировать ссылку приглашения</button>
                </div>
              </div>
            )}
          </main>

          {previewTopic && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-700 p-5 rounded-2xl max-w-sm w-full space-y-4">
                <h3 className="font-bold text-white">{previewTopic.col.title} ({previewTopic.lvl})</h3>
                <div className="max-h-48 overflow-y-auto space-y-2">
                  {(previewTopic.col.levels[previewTopic.lvl] || []).map((w, i) => (
                    <div key={i} className="flex justify-between text-xs p-2 bg-gray-800 rounded-lg">
                      <span className="font-bold text-white">{w.english}</span>
                      <span className="text-gray-400">{w.russian}</span>
                    </div>
                  ))}
                </div>
                <div className="flex space-x-2 pt-2">
                  <button onClick={() => setPreviewTopic(null)} className="flex-1 py-2 bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 rounded-xl">Закрыть</button>
                  <button onClick={() => generateMoreWords(previewTopic.col, previewTopic.lvl)} disabled={isGenerating} className="flex-1 py-2 bg-brand-600 hover:bg-brand-500 text-xs text-white font-bold rounded-xl">
                    {isGenerating ? 'Генерация...' : '+20 слов AI ✨'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {showSettings && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-700 p-5 rounded-2xl max-w-sm w-full space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center"><h3 className="font-bold text-white">⚙️ Настройки</h3><button onClick={() => setShowSettings(false)} className="text-gray-400 hover:text-white">✕</button></div>
                <div className="space-y-2">
                  <label className="text-xs text-gray-400">Ваше имя:</label>
                  <input type="text" value={userName} onChange={e => setUserName(e.target.value)} className="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm" />
                </div>
                <div className="space-y-2">
                  <label className="text-xs text-gray-400">Голос озвучки:</label>
                  <select value={selectedVoice} onChange={e => setSelectedVoice(e.target.value)} className="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-xl text-white text-sm">
                    {voices.map((v, i) => <option key={i} value={v.name}>{v.name} ({v.lang})</option>)}
                  </select>
                </div>
                <div className="pt-2 text-center">
                  <label className="text-xs text-gray-400 block mb-2">QR-код для синхронизации (телефон):</label>
                  <div id="qrcode" className="bg-white p-2 rounded-xl inline-block mx-auto border-4 border-white"></div>
                </div>
                <button onClick={() => setShowSettings(false)} className="w-full py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl text-sm mt-2">Сохранить</button>
              </div>
            </div>
          )}

          {activeWordModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-gray-900 border border-gray-700 p-5 rounded-2xl max-w-xs w-full text-center space-y-3">
                <h4 className="text-xl font-bold text-white">{activeWordModal.word}</h4>
                {activeWordModal.loading ? <div className="text-xs text-brand-400 animate-pulse">Перевод AI...</div> : <p className="text-lg text-emerald-400 font-semibold">{activeWordModal.translation}</p>}
                <div className="flex space-x-2 pt-2">
                  <button onClick={() => setActiveWordModal(null)} className="flex-1 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs rounded-xl">Закрыть</button>
                  <button onClick={addModalWordToDeck} className="flex-1 py-2 bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs rounded-xl">+ В колоду</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
